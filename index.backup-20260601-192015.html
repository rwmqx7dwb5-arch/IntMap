  /* GEBCO 2020 bathymetry (real ocean depth) via CORS proxy — Open-Meteo returns 0 over water. */
  const _bathyCache=new Map();
  async function fetchBathymetry(lat,lng){
    const key=lat.toFixed(2)+','+lng.toFixed(2);
    if(_bathyCache.has(key)) return _bathyCache.get(key);
    const u=`https://api.opentopodata.org/v1/gebco2020?locations=${lat.toFixed(4)},${lng.toFixed(4)}`;
    const proxies=[ x=>`https://api.allorigins.win/raw?url=${encodeURIComponent(x)}`, x=>`https://corsproxy.io/?url=${encodeURIComponent(x)}`, x=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(x)}` ];

      if(typeof e==='number' && e>0.5){ set(`${t('elev')} ${Math.round(e)} m`); return; }
      /* At/below sea level → fetch true depth from GEBCO bathymetry. */
      const d=await fetchBathymetry(rLat,rLng);
      if(typeof d==='number'){ set(d<0 ? `${t('depth')} ${Math.abs(Math.round(d))} m` : `${t('elev')} ${Math.round(d)} m`); }
      else if(typeof e==='number'){ set(e<0 ? `${t('depth')} ${Math.abs(Math.round(e))} m` : `${t('elev')} ${Math.round(e)} m`); }

  /* ===== Map-side global place search (Nominatim) + abstract / natural-language pre-processing =====
   * Handles patterns like:
   *   - "capital of <country>"
   *   - "highest mountain in <country>"
   *   - "largest city in <country>"
   *   - "<place> nearest to <city>"
   *   - country names by stat ("country with highest GDP")
   * For anything we can't pattern-match, we just hand the raw query to Nominatim, which
   * itself is reasonably forgiving for natural-language queries.
   */
  function preprocessNLQuery(q){
    const ql=q.toLowerCase().trim();
    /* "capital of <country>" → look up CAPITAL[code] */
    const mCap=ql.match(/^capital\s+of\s+(.+)$/) || ql.match(/^(.+?)の首都$/);
    if(mCap){
      const name=mCap[1].trim();
      const hit=Object.values(countryStats||{}).find(s=>{
        const en=(s.nameEn||'').toLowerCase(), jp=s.nameJp||'';
        return en===name || en.includes(name) || jp.includes(name);
      });
      if(hit && hit.capital) return hit.capital+', '+hit.nameEn;
    }
    /* "country with the highest <stat>" */
    const STAT_KEYS={'gdp':'gdp','economy':'gdp','population':'pop','area':'area','hdi':'hdi','democracy':'dem','military':'milSpend','life expectancy':'lifeExp','internet':'internet'};
    const mHigh=ql.match(/^(?:country|nation)\s+(?:with\s+)?(?:the\s+)?(?:highest|largest|biggest|most)\s+(.+)$/);
    if(mHigh){
      const key=Object.keys(STAT_KEYS).find(k=>mHigh[1].includes(k));
      if(key){ const sk=STAT_KEYS[key]; const top=Object.values(countryStats).filter(s=>s[sk]!=null).sort((a,b)=>b[sk]-a[sk])[0]; if(top) return top.nameEn; }
    }
    /* Japanese: "X 最大" / "X 最高" → similar fallback */
    const mJpHigh=ql.match(/^(.+?)(が|の)?(最大|最多|最高)(?:の国)?$/);
    if(mJpHigh){
      const w=mJpHigh[1].trim();
      const map={'人口':'pop','GDP':'gdp','面積':'area','軍事費':'milSpend','HDI':'hdi'};
      const sk=map[w]; if(sk){ const top=Object.values(countryStats).filter(s=>s[sk]!=null).sort((a,b)=>b[sk]-a[sk])[0]; if(top) return top.nameEn; }
    }
    return q;
  }

  function parseDate(input){ if(input instanceof Date)return isNaN(input.getTime())?new Date():input; let d=new Date(input); if(isNaN(d.getTime())&&typeof input==='string')d=new Date(input.replace(' ','T')+'Z'); return isNaN(d.getTime())?new Date():d; }

  const ymd=(d,tz)=>new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);

  function formatCustomDate(s){ const d=parseDate(s),tz=tzOpt(),now=new Date(); const a=ymd(d,tz),today=ymd(now,tz),yest=ymd(new Date(now.getTime()-864e5),tz),time=hm(d,tz); if(a===today)return currentLang==='en'?`today ${time}`:`今日 ${time}`; if(a===yest)return currentLang==='en'?`yesterday ${time}`:`昨日 ${time}`; const[,M,D]=a.split('-'); return `${+M}/${+D} ${time}`; }

  function positionTooltip(point){
    const el=ensureMapTooltip();

  /* iOS-style frosted "pill" behind news labels — generated as a stretchable sprite. */
  function ensureLabelPill(){
    if(!map || map.hasImage('news-pill')) return;
    try{
      const dpr=2, w=40, h=30, r=12;
      const cv=document.createElement('canvas'); cv.width=w*dpr; cv.height=h*dpr;
      const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
      ctx.fillStyle='rgba(18,18,20,0.80)';
      const rr=(x,y,ww,hh,rad)=>{ ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+ww,y,x+ww,y+hh,rad); ctx.arcTo(x+ww,y+hh,x,y+hh,rad); ctx.arcTo(x,y+hh,x,y,rad); ctx.arcTo(x,y,x+ww,y,rad); ctx.closePath(); };
      rr(0.5,0.5,w-1,h-1,r); ctx.fill();
      const data=ctx.getImageData(0,0,w*dpr,h*dpr).data;
      map.addImage('news-pill',{width:w*dpr,height:h*dpr,data},{
        pixelRatio:dpr, stretchX:[[r*dpr,(w-r)*dpr]], stretchY:[[r*dpr,(h-r)*dpr]], content:[8*dpr,6*dpr,(w-8)*dpr,(h-6)*dpr]

  /* ===== News location analysis =====
   * Now ALWAYS computes BOTH subject location AND publisher location, plus a fallback
   * if neither match. Result fields:
   *   subjectLoc / subjectName  — best subject match from title (highest precision)
   *   pubLoc / pubName          — publisher HQ
   *   loc / name / mapped       — current "active" location based on newsPinMode
   *
   * EVERY news item now gets a pin (no more dropouts):
   *   - subject match → mapped=true, blue dot
   *   - publisher only → mapped=publisher, purple dot
   *   - neither → fallback to title-hash on the equator strip (light purple, dim)
   */
  function hashLocFromString(s){
    let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
    const lng=((Math.abs(h)%36000)/100)-180;
    const lat=(((Math.abs(h>>8))%6000)/100)-30;
    return [lng,lat];
  }
  /* ===== Scoring model (replaces the old "first geo term wins" loop) =====
     Every geo entry is scored over the title + description; the highest score is the Subject.
        title hit          +10   strong signal — the headline names the place
        description hit     +3    supporting signal from the article snippet
        type "flashpoint"   +5    conflict zone / chokepoint → high news relevance
        type "city"         +2    precise locality
        locational context  +4    "in Gaza" / "ガザで" → the place is the story's setting
     Ties break toward the more local type (flashpoint > city > country > region). */
  const TYPE_SCORE={ flashpoint:5, city:2, country:0, region:0 };
  const TYPE_LOCAL={ flashpoint:4, city:3, country:2, region:1 };
  function scoreGeo(g,title,desc){
    let titleHit=false, descHit=false, ctx=false;
    for(const t of g._terms){
      if(t.jp?title.includes(t.term):t.matchRe.test(title)){ titleHit=true; if(!ctx&&t.ctxRe.test(title)) ctx=true; }
      if(desc&&(t.jp?desc.includes(t.term):t.matchRe.test(desc))){ descHit=true; if(!ctx&&t.ctxRe.test(desc)) ctx=true; }
    }
    if(!titleHit&&!descHit) return 0;
    return (titleHit?10:0)+(descHit?3:0)+(TYPE_SCORE[g.type]||0)+(ctx?4:0);
  }
  function analyzeContext(title,publisher,seed,desc){
    desc=desc||'';
    const short=currentLang==='jp'?(title.length>20?title.slice(0,20)+'…':title):(title.split(' ').slice(0,5).join(' ')+'…');
    /* ---- Subject: score every geo entry over title+description, keep the best ---- */
    let best=null, bestScore=0;
    for(const g of geoDB){
      const s=scoreGeo(g,title,desc);
      if(s<=0) continue;
      if(s>bestScore || (s===bestScore && (!best||(TYPE_LOCAL[g.type]||0)>(TYPE_LOCAL[best.type]||0)))){ best=g; bestScore=s; }
    }
    const subjectLoc=best?best.loc:null, subjectName=best?best.name[currentLang]:null;
    /* ---- Publisher HQ (expanded gazetteer, longest-key-first, word-boundary safe) ---- */
    const pm=matchPublisher(publisher);
    const pubLoc=pm?pm.loc:null, pubName=pm?((currentLang==='jp'?'発信: ':'Source: ')+pm.label):null;
    /* Remember title/publisher so the toggle/AI passes can re-seed fallbacks later */
    const res={ subjectLoc, subjectName, pubLoc, pubName, short, _title:title, _pub:publisher };
    applyPinMode(res);
    return res;
  }
  /* Single source of truth for the active pin location under the current newsPinMode.
     Subject mode shows ONLY the subject location; Publisher mode shows ONLY the publisher
     location — they never borrow from each other, so flipping the toggle always moves the pin.
     Unknown locations fall to a deterministic, MODE-SEEDED scatter point (mapped=false → dim
     pin) so even fully-unplaced stories still shift when the toggle flips. */
  function applyPinMode(a){
    if(!a) return;
    const title=a._title||'', pub=a._pub||'';
    if(newsPinMode==='publisher'){
      if(a.pubLoc){ a.loc=a.pubLoc; a.name=a.pubName; a.mapped='publisher'; }
      else { a.loc=hashLocFromString('pub:'+pub+'|'+title); a.name=pub||(currentLang==='jp'?'発信元不明':'Publisher unknown'); a.mapped=false; }
    } else {
      if(a.subjectLoc){ a.loc=a.subjectLoc; a.name=a.subjectName; a.mapped=true; }
      else { a.loc=hashLocFromString('sub:'+title); a.name=(currentLang==='jp'?'場所不明':'Location unknown'); a.mapped=false; }
    }
  }

  /* ===== AI FEATURE 1: news geocoding =====
     Items the local gazetteer couldn't place sit at fake hash coords (analysis.mapped===false).
     Ask the LLM for the real {name,lat,lng}, then promote them to mapped subject pins. */
  function aiReaffirmLoc(a){ applyPinMode(a); }
  /* Rebuild news-points from the current filter WITHOUT touching the sidebar feed (so a
     progressive update during geocoding doesn't reset scroll). Mirrors startNews()'s shape. */
  function aiRefreshNewsPins(){
    if(!(map&&map.getSource('news-points'))) return;
    newsFeatures=[];
    computeFilteredNews().forEach(item=>{ const a=item.analysis; if(a&&a.loc){
      const fid='n_'+Math.random().toString(36).slice(2,10);
      const mappedStr=a.mapped===true?'true':(a.mapped==='publisher'?'publisher':'none');
      newsFeatures.push({type:'Feature',id:fid,geometry:{type:'Point',coordinates:a.loc},properties:{
        fid, mapped:mappedStr, title:item.title, name:a.name||'', short:a.short||'', publisher:item.publisher, link:item.link, pubDate:item.pubDate }});
    }});
    map.getSource('news-points').setData({type:'FeatureCollection',features:newsFeatures});
  }
  const AI_GEO_CAP=120;  /* cover essentially the whole feed in one click (calls are batched) */
  /* Mode-aware AI locator. In Subject mode it geocodes the event location; in Publisher mode
     it geocodes the outlet's HQ. `force` (the button) re-analyses EVERY filtered story incl.
     already-pinned ones; auto mode passes force=false and only fills the gaps. */
  async function aiGeocodeNews(force){
    if(!aiReady()){ aiToast(t('aiNoKey')); return; }
    const mode=newsPinMode, pub=(mode==='publisher'), cacheKey=pub?'_aiPub':'_aiGeo';
    const need=it=>{ const a=it.analysis; if(!a) return false;
      if(force) return true;
      return pub ? (!a.pubLoc && !a[cacheKey]) : (!a.subjectLoc && !a[cacheKey]); };
    const todo=computeFilteredNews().filter(need).slice(0,AI_GEO_CAP);
    const btn=document.getElementById('ai-geocode-btn');
    if(!todo.length){ aiToast(t('aiGeoNone')); return; }
    aiSetBtnBusy(btn,true,t('aiGeoBusy'));
    const sys=pub
      ? "You are a precise geocoder. Each numbered line is the NAME of a news outlet / publisher. Return the city where that outlet is headquartered. Reply with ONLY a JSON array, one object per identifiable outlet: {\"i\":<index>,\"name\":\"<City, Country>\",\"lat\":<number>,\"lng\":<number>}. Omit outlets you cannot place. No commentary, no code fences."
      : "You are a precise geocoder for a world news map. For EACH numbered headline, give the single primary real-world location where the event takes place (city / region / country / landmark) — NOT the news outlet's HQ. Reply with ONLY a JSON array; one object per locatable item: {\"i\":<index number>,\"name\":\"<short English place name>\",\"lat\":<number>,\"lng\":<number>}. Omit any item with no clear location. No commentary, no code fences.";
    const BATCH=12; let done=0, hit=0, failed=false;
    try{
      for(let i=0;i<todo.length;i+=BATCH){
        const chunk=todo.slice(i,i+BATCH);
        const list=pub
          ? chunk.map((it,k)=>`${k}. ${it.publisher||'?'}`).join('\n')
          : chunk.map((it,k)=>`${k}. ${it.title}${it.desc?' — '+String(it.desc).slice(0,160):''}`).join('\n');
        let arr=null;
        try{ arr=await askAIJSON((pub?'Outlets:\n':'Headlines:\n')+list, sys); }
        catch(e){ aiToast((e&&e.message)||t('aiGeoErr')); failed=true; break; }
        if(Array.isArray(arr)) arr.forEach(o=>{
          if(!o||typeof o.lat!=='number'||typeof o.lng!=='number') return;
          if(o.lat<-90||o.lat>90||o.lng<-180||o.lng>180) return;

  const READER_NOISE=new Set(['edit','[edit]','skip to content','watch live','sign in','log in','menu','advertisement','home','news','sport','business','technology','more','share','save','reuters','associated press','follow us','related topics','watch','listen']);
  function cleanReaderMarkdown(md){
    let firstImg=''; let text=md||'';
    const im=text.match(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/);
    if(im) firstImg=im[1];
    text=text.replace(/```[\s\S]*?```/g,' ');                 /* code fences */
    text=text.replace(/`([^`]+)`/g,'$1');                     /* inline code */
    text=text.replace(/!\[[^\]]*\]\([^)]*\)/g,'');            /* strip images */
    text=text.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1');         /* links -> text */
    text=text.replace(/\\([\\_*\[\]()#~`>+.!-])/g,'$1');      /* unescape md */
    text=text.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/__([^_]+)__/g,'$1'); /* bold */
    text=text.replace(/\*([^*]+)\*/g,'$1');                   /* italic */
    const lines=text.split(/\n/); const blocks=[]; let buf=[];
    const isNoise=s=>READER_NOISE.has(s.toLowerCase().replace(/^[•§]\s*/,'').trim());
    const flush=()=>{ if(buf.length){ const p=buf.join(' ').replace(/\s+/g,' ').trim(); if(p&&p.length>1&&!isNoise(p)) blocks.push({t:'p',v:p}); buf=[]; } };
    for(const raw of lines){
      const line=raw.replace(/\s+$/,'');
      if(/^\s*#{1,6}\s+/.test(line)){ flush(); const h=line.replace(/^\s*#{1,6}\s+/,'').trim(); if(h&&!isNoise(h)) blocks.push({t:'h',v:h}); continue; }
      if(/^\s*>\s?/.test(line)){ flush(); const q=line.replace(/^\s*>\s?/,'').trim(); if(q&&!isNoise(q)) buf.push(q); continue; }
      if(/^\s*[-*+]\s+/.test(line)){ flush(); const li=line.replace(/^\s*[-*+]\s+/,'').trim(); if(li.length>=30&&!isNoise(li)) blocks.push({t:'p',v:'• '+li}); continue; }
      if(line.trim()===''){ flush(); continue; }
      if(/^[=*_\-|>#`~]{1,}$/.test(line.trim())) continue;   /* skip rule/noise lines */
      buf.push(line.trim());
    }
    flush();
    return {hero:firstImg, blocks};
  }
  async function fetchReadable(item){
    /* Strategy 1: r.jina.ai reader — clean article text, CORS-friendly (works from file://). */
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),12000);
      const r=await fetch('https://r.jina.ai/'+item.link,{signal:ctrl.signal});
      clearTimeout(to);
      if(r.ok){
        let txt=await r.text();
        if(txt&&txt.length>200){
          const mc=txt.indexOf('Markdown Content:');
          if(mc>=0) txt=txt.slice(mc+'Markdown Content:'.length);
          const parsed=cleanReaderMarkdown(txt);
          if(parsed.blocks.length>=2) return {blocks:parsed.blocks, hero:parsed.hero, ok:true};
        }
      }
    }catch(_){}
    /* Strategy 2: proxy raw HTML -> extract <article>/<p> text or og:description. */
    try{
      const html=await fetchViaProxy(item.link);
      if(html){
        const doc=new DOMParser().parseFromString(html,'text/html');
        let hero=''; const ogi=doc.querySelector('meta[property="og:image"]'); if(ogi) hero=ogi.getAttribute('content')||'';
        const scope=doc.querySelector('article')||doc.querySelector('main')||doc.body;
        const ps=[...scope.querySelectorAll('p')].map(p=>p.textContent.trim()).filter(t=>t.length>40);
        if(ps.length>=2) return {blocks:ps.slice(0,50).map(v=>({t:'p',v})), hero, ok:true};
        const desc=doc.querySelector('meta[property="og:description"],meta[name="description"]');
        if(desc) return {blocks:[{t:'p',v:desc.getAttribute('content')||''}], hero, ok:false};
      }
    }catch(_){}
    return {blocks:[], hero:'', ok:false};
  }

  async function aiTranslateReader(item,res,btn){
    if(!aiReady()){ aiToast(t('aiNoKey')); return; }
    const bodyEl=document.querySelector('#news-reader-pane .nrp-body'); if(!bodyEl||!btn) return;
    const setLbl=on=>{ btn.innerHTML = on ? '↩ '+aiEsc(t('aiShowOriginal')) : '✨ '+aiEsc(t('aiTranslate')); };
    if(bodyEl.dataset.translated==='1'){ if(res._origHTML!=null) bodyEl.innerHTML=res._origHTML; bodyEl.dataset.translated='0'; setLbl(false); return; }
    if(res._translatedHTML){ if(res._origHTML==null) res._origHTML=bodyEl.innerHTML; bodyEl.innerHTML=res._translatedHTML; bodyEl.dataset.translated='1'; setLbl(true); return; }
    const src=((res.blocks||[]).map(b=>b&&b.v).filter(Boolean).join('\n\n')||'').trim();
    if(!src){ aiToast(t('aiTransNoText')); return; }
    res._origHTML=bodyEl.innerHTML; btn.disabled=true; btn.innerHTML='<span class="ai-spin"></span>';
    try{
      const sys="You are a professional news translator. Translate the article into natural, fluent Japanese. Keep paragraph breaks. Do not add notes, labels, or the original text — output only the Japanese translation.";
      const out=await askAI('Title: '+item.title+'\n\n'+src, sys);
      const paras=String(out||'').split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
      res._translatedHTML=(paras.length?paras:[String(out||'')]).map(p=>`<p>${escForReader(p)}</p>`).join('');

    iframe.sandbox='allow-same-origin allow-scripts allow-popups allow-forms';

    iframe.onload=()=>{
      loaded=true;

    };
    iframe.onerror=()=>{ if(!loaded) showFallback(item); };
    /* If load doesn't complete in 5s (X-Frame-Options block usually doesn't fire onerror),
       try fetching via proxy and show fallback. */
    timeout=setTimeout(async ()=>{
      if(!loaded){
        try{ if(iframe.contentDocument && iframe.contentDocument.body && iframe.contentDocument.body.children.length>0){ loaded=true; const ld=document.getElementById('nb-loading'); if(ld) ld.remove(); return; } }catch(_){}
        showFallback(item);
      }
    }, 5000);
    wrap.appendChild(iframe);
  }

  /* ===== Stats — list with multi-select country comparison ===== */
  let compareSet=new Set();
  window.setStatsSort=function(k){ statsSort=k; renderStats(searchVal()); };
  window._toggleCompare=function(code){
    if(compareSet.has(code)) compareSet.delete(code);
    else if(compareSet.size<3) compareSet.add(code);
    else { /* swap out the oldest one */ const first=compareSet.values().next().value; compareSet.delete(first); compareSet.add(code); }
    renderStats(searchVal());
  };
  window._clearCompare=function(){ compareSet.clear(); renderStats(searchVal()); };
  window._showCompare=function(){
    if(compareSet.size<2){ return; }
    renderCompareView();
  };
  window._backToStats=function(){ renderStats(searchVal()); };
  function renderStats(q){
    const feed=document.getElementById('live-news-feed'); clearMarkers();
    if(!countryDataLoaded){ feed.innerHTML=`<div class="empty-msg">${t('loadingData')}</div>`; loadCountryData().then(()=>{ if(currentMode==='stats')renderStats(searchVal()); }); return; }
    let arr=Object.values(countryStats).filter(s=>s.nameEn);
    if(arr.length===0){ feed.innerHTML=`<div class="empty-msg">${t('noData')}</div>`; return; }
    if(q) arr=arr.filter(s=>s.nameEn.toLowerCase().includes(q)||(s.nameJp&&s.nameJp.includes(q)));
    const key=statsSort;
    arr.sort((a,b)=> key==='name' ? (currentLang==='jp'?(a.nameJp||'').localeCompare(b.nameJp||'','ja'):(a.nameEn||'').localeCompare(b.nameEn||'')) : ((b[key]||0)-(a[key]||0)) );
    const sb=(k,lbl)=>`<button class="stats-sort ${statsSort===k?'active':''}" onclick="setStatsSort('${k}')">${lbl}</button>`;
    /* Compare bar — always visible at top of Stats */
    const chips=[...compareSet].map(code=>{
      const s=countryStats[code]; if(!s) return '';
      return `<span class="scb-chip">${s.flag||'🏳️'} ${cName(s)}<button onclick="_toggleCompare('${code}')">×</button></span>`;
    }).join('');
    const canCompare = compareSet.size>=2;
    const compareBar=`<div class="stats-compare-bar">
      <div class="scb-title">📊 ${t('compare')} (${compareSet.size}/3)</div>
      <div class="scb-chips">${chips||`<span style="font-size:11px;color:var(--text-muted);">${t('compareEmpty')}</span>`}</div>
      <div class="scb-actions">
        <button class="primary" ${canCompare?'':'disabled style="opacity:0.4;cursor:not-allowed;"'} onclick="_showCompare()">${t('compareView')}</button>
        <button onclick="_clearCompare()">${t('compareClear')}</button>
      </div>
    </div>`;
    let html=compareBar+`<div class="stats-toolbar">${sb('gdp',t('sortGdp'))}${sb('pop',t('sortPop'))}${sb('area',t('sortArea'))}${sb('hdi',t('sortHDI'))}${sb('milSpend',t('sortMil'))}${sb('name',t('sortName'))}</div>`;
    if(arr.length===0) html+=`<div class="empty-msg">${t('noMatch')}</div>`;
    arr.forEach(s=>{
      let sub='—', lbl='';
      if(key==='pop'){ sub=fmtNum(s.pop); lbl=t('statPop'); }
      else if(key==='area'){ sub=fmtArea(s.area); lbl=t('statArea'); }
      else if(key==='hdi'){ sub=s.hdi?s.hdi.toFixed(3):'—'; lbl=t('statHDI'); }
      else if(key==='milSpend'){ sub=s.milSpend?'$'+s.milSpend+'B':'—'; lbl=t('statMil'); }
      else if(key==='name'){ sub=fmtMoney(s.gdp); lbl=t('statGdp'); }
      else{ sub=fmtMoney(s.gdp); lbl=t('statGdp'); }
      const active=compareSet.has(s.code)?'compare-on':'';
      html+=`<div class="stat-row ${active}" data-ccn="${s.code}"><span class="stat-flag">${s.flag||'🏳️'}</span><div class="stat-main"><div class="stat-name">${cName(s)}</div><div class="stat-sub">${s.region||''}${s.capital?' · '+s.capital:''}</div></div><div class="stat-val">${lbl}<br>${sub}</div></div>`;
    });
    feed.innerHTML=html;
    feed.querySelectorAll('.stat-row').forEach(row=>{
      /* Single-click → add/remove from compare; double-click → open detail */
      let clickTimer=null;
      row.onclick=(e)=>{
        if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; showCountryDetail(row.getAttribute('data-ccn')); return; }
        clickTimer=setTimeout(()=>{ window._toggleCompare(row.getAttribute('data-ccn')); clickTimer=null; },250);
      };
    });

  function renderCompareView(){
    const feed=document.getElementById('live-news-feed');
    const codes=[...compareSet];
    const items=codes.map(c=>countryStats[c]).filter(Boolean);
    if(items.length<2){ renderStats(searchVal()); return; }
    /* Color palette for the comparison bars */
    const COLORS=['#007aff','#ff3b30','#34c759','#ff9500','#5856d6','#af52de'];

    function section(title,key,fmt){

    const html=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <button class="stats-sort active" onclick="_backToStats()">‹ ${t('back')}</button>
        <button class="stats-sort" onclick="_clearCompare(); _backToStats();">${t('compareClear')}</button>
      </div>
      <div class="compare-panel">
        ${section(t('statGdp')+` (${GDP_YEAR})`,'gdp',v=>fmtMoney(v))}
        ${section(t('statGdpPc'),'gdppc',v=>fmtPc(v))}
        ${section(t('statPop')+` (${POP_YEAR})`,'pop',v=>fmtNum(v))}
        ${section(t('statArea'),'area',v=>fmtArea(v))}

        ${section(t('statHDI')+' (2022)','hdi',v=>v.toFixed(3))}
        ${section(t('statDem')+' (2023)','dem',v=>v.toFixed(2))}
        ${section(t('statLife'),'lifeExp',v=>v.toFixed(1)+' yr')}
        ${section(t('statInet'),'internet',v=>v+'%')}
      </div>`;

  /* ===== Information Dashboard data
   *  `specs` is the structured "neat" view requested for military bases (runway, garrison, etc.).
   * ===================================================================== */
  let extendedDashDB=[];

  /* Cache & lazy-fetch the lead image from a Wikipedia URL */
  const wikiImgCache={};
  async function fetchWikiImage(wikiUrl){
    if(!wikiUrl) return null;
    if(wikiImgCache[wikiUrl]!==undefined) return wikiImgCache[wikiUrl];
    try{
      const m=wikiUrl.match(/^https?:\/\/([a-z]+)\.wikipedia\.org\/wiki\/(.+)$/);
      if(!m) { wikiImgCache[wikiUrl]=null; return null; }
      const lang=m[1], title=m[2];
      const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${title}`);
      if(!r.ok){ wikiImgCache[wikiUrl]=null; return null; }
      const j=await r.json();
      const url=(j&&j.thumbnail&&j.thumbnail.source)||(j&&j.originalimage&&j.originalimage.source)||null;
      wikiImgCache[wikiUrl]=url; return url;
    }catch(e){ wikiImgCache[wikiUrl]=null; return null; }
  }
  function applyWikiImageBackground(info){
    if(info.img||!info.wiki) return;
    const wikiUrl=info.wiki[currentLang]||info.wiki.en;
    fetchWikiImage(wikiUrl).then(url=>{
      if(!url) return;
      const card=document.getElementById('card-'+info.id); if(!card) return;
      const img=card.querySelector('.wiki-card-img');
      if(img) img.style.backgroundImage=`url('${url}')`;
    });
  }
  function renderDashboard(){
    const dash=document.getElementById('info-dashboard'); clearMarkers(); const dict=i18n[currentLang];
    const filtered=extendedDashDB.filter(i=>activeDashCategories.has(i.cat));
    /* Push features into WebGL source. Pins are mathematically placed by the GPU. */
    dashFeatures=filtered.map(info=>({type:'Feature',id:info.id,geometry:{type:'Point',coordinates:info.loc},properties:{
      fid:info.id, type:info.type, color:INFO_COLORS[info.type]||'#007aff',
      title:info.title[currentLang], body:info.body[currentLang], layerRef:info.layerRef||''
    }}));
    /* Ensure pin layers exist NOW. Without this, on first tab-switch the source may not yet
       have been created → pins appeared with a delay. */
    if(map&&map.isStyleLoaded()) setupIntelLayers();
    if(map&&map.getSource('dash-points')) map.getSource('dash-points').setData({type:'FeatureCollection',features:dashFeatures});
    /* Sidebar cards */
    let cards='<div class="dash-cards-container">';
    filtered.forEach(info=>{
      let specsHTML='';
      if(info.specs){
        const items=Object.entries(info.specs).map(([k,v])=>`<div class="spec-item"><span class="spec-label">${dict[k]||k}</span><span class="spec-value">${v[currentLang]||v.en||'—'}</span></div>`).join('');
        if(items) specsHTML=`<div class="wiki-card-specs">${items}</div>`;
      }
      cards+=`<div class="wiki-card" id="card-${info.id}" onclick="flyToLoc(${info.loc[0]},${info.loc[1]})" onmouseenter="triggerLayerHover('${info.layerRef||''}',true); highlightDashMarker('${info.id}',true)" onmouseleave="triggerLayerHover('${info.layerRef||''}',false); highlightDashMarker('${info.id}',false)">
        <div class="wiki-card-img" data-type="${info.type}" style="background-image:url('${info.img||''}');"><span class="wiki-card-badge">${info.badge}</span></div>
        <div class="wiki-card-content"><h4 class="wiki-card-title">${info.title[currentLang]}</h4><p class="wiki-card-body">${info.body[currentLang]}</p>${specsHTML}<div class="wiki-card-footer"><a href="${info.wiki[currentLang]}" target="_blank" class="wiki-link" onclick="event.stopPropagation()">${dict.readWiki}</a></div></div></div>`;
    });
    cards+='</div>';
    const nav=`<div class="dash-nav" id="dash-nav"><button class="dash-nav-btn ${activeDashCategories.has('mil')?'active':''}" onclick="toggleDashCat('mil')">${dict.dashCatMil}</button><button class="dash-nav-btn ${activeDashCategories.has('tech')?'active':''}" onclick="toggleDashCat('tech')">${dict.dashCatTech}</button><button class="dash-nav-btn ${activeDashCategories.has('maritime')?'active':''}" onclick="toggleDashCat('maritime')">${dict.dashCatMar}</button><button class="dash-nav-btn ${activeDashCategories.has('geo')?'active':''}" onclick="toggleDashCat('geo')">${dict.dashCatGeo}</button></div>`;
    dash.innerHTML=nav+cards;
    /* Mouse wheel → horizontal scroll on the category nav */
    const dnav=document.getElementById('dash-nav');
    if(dnav){ dnav.addEventListener('wheel',(e)=>{ if(e.deltaY===0)return; e.preventDefault(); dnav.scrollLeft+=e.deltaY+e.deltaX; },{passive:false}); }
    /* Lazy-fetch Wikipedia thumbnails for cards without an explicit image */
    filtered.forEach(info=>{ if(!info.img) applyWikiImageBackground(info); });

  /* ===== Fetch news via CORS proxies ===== */
  const PROXIES=[ u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`, u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`, u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}` ];
  /* PARALLEL race — fire all proxies at once; first valid response wins.
     This roughly halves news load time over the old sequential approach. */
  async function fetchViaProxy(url){
    const attempts = PROXIES.map(make=>(async()=>{
      const r=await fetch(make(url));
      if(!r.ok) throw new Error('bad status '+r.status);
      const txt=await r.text();
      if(!txt || !(txt.includes('<rss')||txt.includes('<feed'))) throw new Error('not feed');
      return txt;
    })());
    try{
      return await Promise.any(attempts);
    }catch(_){
      /* Fallback: sequential retry in case Promise.any failed because all rejected */
      for(const make of PROXIES){
        try{
          const r=await fetch(make(url)); if(!r.ok) continue;
          const txt=await r.text();
          if(txt&&(txt.includes('<rss')||txt.includes('<feed'))) return txt;
        }catch(_){}
      }
      return null;
    }
  }
  /* Time-travel state: when newsDate is set (not null), feed URLs gain after:/before: qualifiers */
  let newsDate=null;
  function ymdISO(d){ return d.toISOString().slice(0,10); }
  function dateRangeQualifier(d){
    /* ±3 day window for that date */
    const start=new Date(d.getTime()-3*864e5), end=new Date(d.getTime()+3*864e5);
    return ` after:${ymdISO(start)} before:${ymdISO(end)}`;
  }
  /* Google News editions. In multi-language mode we pull several foreign editions too, so the
     feed includes non-UI-language headlines (which the AI then translates onto the cards). */
  const NEWS_EDITIONS_MULTI=['hl=fr&gl=FR&ceid=FR:fr','hl=de&gl=DE&ceid=DE:de','hl=es&gl=ES&ceid=ES:es','hl=ar&gl=EG&ceid=EG:ar','hl=zh-CN&gl=CN&ceid=CN:zh-Hans','hl=ru&gl=RU&ceid=RU:ru'];
  function feedUrls(){
    const p=currentLang==='en'?'hl=en-US&gl=US&ceid=US:en':'hl=ja&gl=JP&ceid=JP:ja';
    if(newsDate){
      /* Google News search supports after:/before: operators. Headlines endpoints don't,
         so a date-filtered query goes through search. */
      const q=(activeSearchQuery||'world')+dateRangeQualifier(newsDate);
      return [`https://news.google.com/rss/search?q=${encodeURIComponent(q)}&${p}`];
    }
    if(activeSearchQuery) return[`https://news.google.com/rss/search?q=${encodeURIComponent(activeSearchQuery)}&${p}`];
    const base=[`https://news.google.com/rss/headlines/section/topic/WORLD?${p}`,`https://news.google.com/rss/headlines/section/topic/BUSINESS?${p}`];
    if(newsLangMode==='multi'){
      /* the UI edition stays first (so home-language stories dominate), then foreign editions */
      NEWS_EDITIONS_MULTI.forEach(ed=>base.push(`https://news.google.com/rss/headlines/section/topic/WORLD?${ed}`));
    }
    return base;
  }
  /* News cache → instant render on load/return, refreshed in the background. */
  function loadNewsCache(){
    try{ const c=JSON.parse(localStorage.getItem('intmap_news_cache')||'null');
      if(c && c.lang===currentLang && !activeSearchQuery && !newsDate && Array.isArray(c.data) && c.data.length && (Date.now()-c.ts < 6*3600e3)) return c.data; }catch(_){}
    return null;
  }
  function saveNewsCache(){
    try{ if(!activeSearchQuery && !newsDate) localStorage.setItem('intmap_news_cache', JSON.stringify({ts:Date.now(), lang:currentLang, data:globalData.slice(0,120)})); }catch(_){}
  }
  function buildItems(byLink){
    const uniq=[...byLink.values()].sort((a,b)=>parseDate(b.pubDate)-parseDate(a.pubDate));
    return uniq.slice(0,150).map(it=>{ const sp=it.title.split(' - '); const publisher=sp.length>1?sp.pop():(currentLang==='en'?'News':'報道'); const title=sp.join(' - '); const desc=it.desc||''; return { title, publisher, link:it.link, pubDate:it.pubDate, desc, analysis:analyzeContext(title,publisher,it.link,desc) }; });
  }
  async function fetchData(){
    const feed=document.getElementById('live-news-feed');
    /* 1) Instant: show cached headlines immediately while fresh ones load. */
    if(globalData.length===0){ const cached=loadNewsCache(); if(cached&&cached.length){ globalData=cached; if(currentMode==='news'||currentMode==='saved') startNews(); } }
    if((currentMode==='news'||currentMode==='saved')&&feed&&globalData.length===0) feed.innerHTML=`<div class="empty-msg">${t('loading')}</div>`;
    /* 2) Fetch feeds and render incrementally — the first feed to arrive shows right away. */
    const parser=new DOMParser(); const byLink=new Map(); let any=false;
    const ingest=(txt)=>{
      if(!txt) return;
      const xml=parser.parseFromString(txt,'text/xml');
      xml.querySelectorAll('item, entry').forEach(it=>{
        const le=it.querySelector('link'); const link=(le&&(le.textContent||le.getAttribute('href')))||'';
        if(!link||byLink.has(link))return;
        /* RSS <description>, else Atom <summary>/<content>; HTML stripped to plain text for analysis. */
        const descNode=it.querySelector('description')||it.querySelector('summary')||it.querySelector('content');
        /* Google News packs each related article as <a>headline</a><font>publisher</font>.
           Drop the <font> publisher names first — otherwise "The Washington Post" etc. leak
           false city matches ("Washington") into the scorer. The <a> headline text is kept. */
        const descHtml=(descNode?.textContent||'').replace(/<font\b[^>]*>[\s\S]*?<\/font>/gi,' ');
        byLink.set(link,{
          title:it.querySelector('title')?.textContent||'',
          link,
          pubDate:it.querySelector('pubDate, published, updated')?.textContent||'',
          desc:stripHTML(descHtml)
        });
      });
      if(byLink.size){ globalData=buildItems(byLink); any=true; if(currentMode==='news'||currentMode==='saved') startNews(); }
    };
    try{
      await Promise.all(feedUrls().map(async u=>{ try{ ingest(await fetchViaProxy(u)); }catch(_){} }));
      if(!any && globalData.length===0) throw new Error('no items');
      if(any) saveNewsCache();
    }catch(e){ if(globalData.length===0&&feed&&(currentMode==='news'||currentMode==='saved')) feed.innerHTML=`<div class="empty-msg" style="color:var(--threat-unmapped);">${t('networkError')}</div>`; console.warn('fetchData failed:',e); }
  }

  /* ===== Settings + Timezones ===== */
  function populateTimezones(){
    const sel=document.getElementById('setting-tz'); let zones=[];
    try{ zones=Intl.supportedValuesOf('timeZone'); }catch(e){ zones=['UTC','Asia/Tokyo','America/New_York','Europe/London','Europe/Moscow','Europe/Berlin','Asia/Shanghai','America/Los_Angeles','Asia/Kolkata','Australia/Sydney']; }
    const prev=userTZ; sel.innerHTML='';
    const auto=document.createElement('option'); auto.value='auto'; auto.id='opt-tz-auto'; auto.textContent=i18n[currentLang].optLocal; sel.appendChild(auto);
    const utc=document.createElement('option'); utc.value='UTC'; utc.textContent='UTC'; sel.appendChild(utc);
    zones.forEach(z=>{ if(z==='UTC')return; const o=document.createElement('option'); o.value=z; o.textContent=z.replace(/_/g,' '); sel.appendChild(o); });
    sel.value=prev;
  }
  const modal=document.getElementById('settings-modal');

  async function fetchElevDepth(lat,lng){
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}`);
      if(!r.ok) return null;
      const j=await r.json(); const e=j&&j.elevation&&j.elevation[0];
      return (typeof e==='number')?e:null;
    }catch(_){ return null; }
  }
  function addPin(lng,lat){

    userPins.push(pin); refreshPins();

    return id;
  }

      else elevHTML=`<b>${Math.round(pin.elev)} m</b>`;
    }
    let distHTML2='';
    const idx=userPins.findIndex(p=>p.id===pin.id);

      const prev=userPins[idx-1];
      const km=turf.distance(turf.point([prev.lng,prev.lat]),turf.point([pin.lng,pin.lat]),{units:'kilometers'});

  }
  function positionPinPopup(){

      {divider:true},

      ...(userPins.length?[{label:`🗑 ${t('ctxClearPins')} (${userPins.length})`, action:clearAllPins}]:[])
    ];

      if(it.head) return `<div class="ctx-head">${it.h}</div>`;
      return `<button data-act="${items.indexOf(it)}">${it.label}</button>`;
    }).join('');
    m.querySelectorAll('button[data-act]').forEach(b=>{ b.onclick=()=>{ const i=+b.getAttribute('data-act'); items[i].action(); m.style.display='none'; }; });

    window._koppenCanvas=null; window._koppenImg=null; window._koppenReady=false;
    function loadKoppenCanvas(){
      if(window._koppenImg) return Promise.resolve();
      return new Promise(resolve=>{
        const im=new Image(); im.crossOrigin='anonymous';
        im.onload=()=>{
          const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;

          im2.onerror=()=>resolve(); im2.src=KURL_FALLBACK;

    function nearestKoppenCode(r,g,b,a){
      if(a<32) return null;
      let best=null,bestD=Infinity;
      for(const [code,c] of KCOL){
        const dr=r-c[0], dg=g-c[1], db=b-c[2]; const d=dr*dr+dg*dg+db*db;
        if(d<bestD){ bestD=d; best=code; }
      }
      return bestD<6000?best:null;

    window._koppenLoadStarted=false;

      if(!window._koppenReady){
        if(!window._koppenLoadStarted){ window._koppenLoadStarted=true; loadKoppenCanvas(); }
        return null;
      }
      if(!window._koppenCanvas) return null;
      if(lat>84||lat<-60) return null;
      const W=window._koppenCanvas.width, H=window._koppenCanvas.height;
      const x=Math.max(0,Math.min(W-1,Math.round((lng+180)/360*W)));
      const y=Math.max(0,Math.min(H-1,Math.round((84-lat)/144*H)));
      try{ const p=window._koppenCanvas.getContext('2d').getImageData(x,y,1,1).data; return nearestKoppenCode(p[0],p[1],p[2],p[3]); }
      catch(e){ return null; }

    /* Produce a Köppen image with only the selected codes opaque (others dimmed/hidden).

    function buildKoppenHighlightURL(selectedSet){
      if(!window._koppenReady||!window._koppenCanvas) return null;
      if(!selectedSet||selectedSet.size===0) return null;
      const src=window._koppenCanvas, W=src.width, H=src.height;
      const out=document.createElement('canvas'); out.width=W; out.height=H;
      const sctx=src.getContext('2d'), octx=out.getContext('2d');
      const img=sctx.getImageData(0,0,W,H), d=img.data;
      /* selected: stay vivid; non-selected: desaturate + lower alpha so background shows through */
      for(let i=0;i<d.length;i+=4){
        const code=nearestKoppenCode(d[i],d[i+1],d[i+2],d[i+3]);
        if(!code||!selectedSet.has(code)){
          /* Dim & desaturate by half (still visible but muted) */
          const g=(d[i]+d[i+1]+d[i+2])/3;
          d[i]=g*0.6+d[i]*0.0; d[i+1]=g*0.6+d[i+1]*0.0; d[i+2]=g*0.6+d[i+2]*0.0;
          d[i+3]=Math.floor(d[i+3]*0.3);
        }else{
          /* selected: punch up brightness for "glow" effect */
          d[i]=Math.min(255,d[i]*1.05); d[i+1]=Math.min(255,d[i+1]*1.05); d[i+2]=Math.min(255,d[i+2]*1.05);

      }
      octx.putImageData(img,0,0);
      try{ return out.toDataURL('image/png'); }catch(e){ return null; }

    function genSyntheticShips(){
      const arr=[];
      SHIP_PORTS.forEach(([lng,lat,type])=>{

          });

      });
      /* Add scattered ships along major shipping lanes so the open ocean isn't empty */
      const LANES=[
        /* Trans-Pacific lane: Asia → US west coast */

        {a:[-74,40], b:[-2,50], n:25},

    /* === EEZ via MarineRegions WMS === */

    }
    function daysAgo(d){ const today=new Date(); today.setHours(0,0,0,0); const t=new Date(d); t.setHours(0,0,0,0); return Math.round((today-t)/864e5); }
    function syncFromSlider(){
      const v=parseInt(slider.value,10);
      if(v>=3650){ newsDate=null; datePicker.value=''; }
      else{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(3650-v)); newsDate=d; datePicker.value=ymdISO(d); }
      setLabel();
      clearTimeout(pendingTimer); pendingTimer=setTimeout(()=>{ if(currentMode==='news'||currentMode==='saved'){ globalData=[]; fetchData(); } },250);
    }
    function syncFromPicker(){
      if(!datePicker.value){ newsDate=null; slider.value=3650; setLabel(); }
      else{
        const d=new Date(datePicker.value+'T00:00:00');
        if(isNaN(d.getTime())) return;
        const da=daysAgo(d);
        if(da<0){ /* future */ newsDate=null; slider.value=3650; }
        else if(da>3650){ slider.value=0; newsDate=d; }
        else{ slider.value=3650-da; newsDate=d; }
        setLabel();
      }
      clearTimeout(pendingTimer); pendingTimer=setTimeout(()=>{ if(currentMode==='news'||currentMode==='saved'){ globalData=[]; fetchData(); } },150);
    }
    tg.onclick=()=>tl.classList.toggle('collapsed');
    slider.addEventListener('input',syncFromSlider);
    datePicker.addEventListener('change',syncFromPicker);
    btnToday.onclick=()=>{ newsDate=null; slider.value=3650; datePicker.value=''; setLabel(); globalData=[]; fetchData(); };

    datePicker.max=ymdISO(new Date());

  function compressImage(file, maxDim=1100, quality=0.72){
    return new Promise((resolve,reject)=>{
      const fr=new FileReader();
      fr.onload=()=>{ const img=new Image(); img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        try{ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',quality)); }
        catch(_){ resolve(fr.result); }
      }; img.onerror=()=>resolve(fr.result); img.src=fr.result; };
      fr.onerror=reject; fr.readAsDataURL(file);
    });
  }

          </div>
          <div class="comm-comments">
            ${(post.comments||[]).map(c=>`<div class="comm-comment"><div class="comm-comment-meta">${(c.author?escapeHtml(c.author)+' · ':'')}${formatCustomDate(new Date(c.ts).toISOString())}</div>${escapeHtml(c.text)}</div>`).join('')}
            <div class="comm-comment-add">

              <button data-pid="${post.id}">${t('commPost')}</button>
            </div>
          </div>
        </div>`;
      });

    cont.innerHTML=html;
    /* Wire the toolbar + per-post actions (all writes go to Supabase) */
    document.getElementById('comm-add-btn').onclick=()=>{
      if(!requireLogin()) return;
      /* Open the composer straight away (location defaults to the current map centre, and can be
         moved with "Move pin on map"). This removes the old arm-then-tap step that often left
         users unable to post. */
      communityAddArmed=false;

    cont.querySelectorAll('.locate-btn').forEach(b=>b.onclick=()=>{
      const p=communityPosts.find(p=>p.id===b.dataset.id);
      if(p && map) map.flyTo({center:[p.lng,p.lat],zoom:5,speed:1.2});
    });
    cont.querySelectorAll('.del-btn').forEach(b=>b.onclick=async()=>{
      if(!confirm(currentLang==='jp'?'この投稿を削除しますか？':'Delete this post?')) return;
      try{ await cmDelete(b.dataset.id); }catch(e){ imToast((e&&e.message)||'Delete failed'); return; }
      await loadCommunity();
    });
    cont.querySelectorAll('.comm-post-loc').forEach(el=>el.onclick=()=>{
      const lat=+el.dataset.lat, lng=+el.dataset.lng;
      if(map) map.flyTo({center:[lng,lat],zoom:5,speed:1.2});

    cont.querySelectorAll('.comm-comment-add button').forEach(b=>b.onclick=async()=>{
      if(!requireLogin()) return;
      const input=b.previousElementSibling, txt=input.value.trim(); if(!txt) return;
      input.value='';
      try{ await cmComment(b.dataset.pid,txt); }catch(e){ imToast((e&&e.message)||'Comment failed'); return; }
      await loadCommunity();

    cont.querySelectorAll('.comm-comment-add input').forEach(inp=>{
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ inp.nextElementSibling.click(); } });
    });
    /* Sort toggle */
    cont.querySelectorAll('.comm-sort button').forEach(b=>b.onclick=()=>{ communitySort=b.dataset.sort; renderCommunity(); });
    /* Upvote (toggle) */
    cont.querySelectorAll('.vote-btn').forEach(b=>b.onclick=async()=>{
      if(!requireLogin()) return;
      const p=communityPosts.find(p=>p.id===b.dataset.id); if(!p) return;
      try{ await cmVote(p.id, !p.voted); }catch(e){ imToast((e&&e.message)||'Vote failed'); return; }
      await loadCommunity();

    /* Report */
    cont.querySelectorAll('.report-btn').forEach(b=>b.onclick=async()=>{
      if(!requireLogin()) return;
      if(!confirm(currentLang==='jp'?'この投稿を不適切として通報しますか？':'Report this post as inappropriate?')) return;
      try{ await cmReport(b.dataset.id); imToast(currentLang==='jp'?'通報しました。ご協力ありがとうございます。':'Reported. Thank you.'); }catch(e){ imToast((e&&e.message)||'Report failed'); }
    });

  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  /* When add-mode is armed, map-click drops a community post pin and opens the compose modal */
  if(map){
    map.on('click',(e)=>{
      if(!communityAddArmed) return;
      /* Skip if it's actually a tool action — handleMapClick will handle and toolMode set */
      if(toolMode) return;
      pendingPostLoc=[e.lngLat.lng, e.lngLat.lat];
      communityAddArmed=false;
      openComposeModal();
    });
  }
  function openComposeModal(){
    const m=document.getElementById('compose-modal');
    document.getElementById('compose-title').textContent=t('commPostNew');
    document.getElementById('compose-post-title').value='';
    document.getElementById('compose-post-body').value='';

    document.getElementById('compose-post-body').placeholder=t('commBody');
    document.getElementById('compose-cancel').textContent=t('commCancel');
    document.getElementById('compose-submit').textContent=t('commPost');
    pendingImg=''; showComposeImgPreview('');
    document.getElementById('compose-img-label').textContent=currentLang==='jp'?'画像を追加':'Add image';
    document.getElementById('compose-place-label').textContent=currentLang==='jp'?'地図でピンを移動':'Move pin on map';
    if(pendingPostLoc){
      document.getElementById('compose-coord-hint').textContent=
        `${t('commPlacedAt')}: ${pendingPostLoc[1].toFixed(3)}°, ${pendingPostLoc[0].toFixed(3)}°`;
    } else {
      document.getElementById('compose-coord-hint').textContent=
        currentLang==='jp'?'地図をクリックして位置を指定してください。':'Click on the map to place a location.';
    }
    m.classList.add('active');
  }
  document.getElementById('compose-cancel').onclick=()=>{
    document.getElementById('compose-modal').classList.remove('active'); pendingPostLoc=null;
    if(currentMode==='community') renderCommunity();
  };
  /* "Move pin on map": hide the composer, arm a one-shot map tap that re-opens it at the new spot */
  document.getElementById('compose-place').onclick=()=>{
    document.getElementById('compose-modal').classList.remove('active');
    communityAddArmed=true;
    imToast(currentLang==='jp'?'地図をタップしてピンを移動':'Tap the map to move the pin');
  };
  document.getElementById('compose-submit').onclick=async()=>{
    if(!requireLogin()) return;
    const title=document.getElementById('compose-post-title').value.trim();
    const body=document.getElementById('compose-post-body').value.trim();
    if(!title && !body){ imToast(currentLang==='jp'?'タイトルか本文を入力してください。':'Enter a title or some text.'); return; }
    /* never dead-end on a missing location: fall back to the current map centre */
    if(!pendingPostLoc){ if(map){ const c=map.getCenter(); pendingPostLoc=[c.lng,c.lat]; } else { imToast(currentLang==='jp'?'位置が設定されていません。':'Location not set.'); return; } }
    const loc=[pendingPostLoc[0],pendingPostLoc[1]], img=pendingImg||'';
    const btn=document.getElementById('compose-submit'); btn.disabled=true;
    try{ await cmAddPost(title, body, img, loc[1], loc[0]); }
    catch(e){ btn.disabled=false; alert((currentLang==='jp'?'投稿に失敗しました: ':'Post failed: ')+((e&&e.message)||e)); return; }
    btn.disabled=false;
    document.getElementById('compose-modal').classList.remove('active');
    pendingPostLoc=null; pendingImg=''; showComposeImgPreview('');
    await loadCommunity();
    /* Fly to the new post */
    if(map) map.flyTo({center:[loc[0],loc[1]],zoom:5,speed:1.0});
  };
  /* Compose image input wiring (bound once) */
  (function(){
    const inp=document.getElementById('compose-img');
    if(inp){
      inp.addEventListener('change', async (e)=>{
        const f=e.target.files&&e.target.files[0]; if(!f) return;
        if(!/^image\//.test(f.type||'')){ alert(currentLang==='jp'?'画像ファイルを選択してください':'Please choose an image file'); e.target.value=''; return; }
        try{ pendingImg=await compressImage(f); showComposeImgPreview(pendingImg); }catch(_){ }
        e.target.value='';
      });
    }
    const rm=document.getElementById('compose-img-remove');

  /* Push community pins when style first loads, so they appear without needing to enter the tab */
  if(map){
    if(map.isStyleLoaded()){ try{ setupCommunityLayer(); }catch(_){} }
    map.on('load',()=>{ try{ setupCommunityLayer(); }catch(_){} });
    map.on('styledata',()=>{ try{ setupCommunityLayer(); }catch(_){} });
