    /* === iOS liquid-glass touches === */

    /* === Community tab === */
    .comm-toolbar{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card-bg); border-radius:12px; border:1px solid rgba(128,128,128,0.1); margin-bottom:10px; font-size:12px; }

    .comm-comment{ background:var(--input-bg); border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.4; }

    .comm-comment-add input{ flex:1; min-width:0; background:var(--input-bg); border:1px solid rgba(128,128,128,0.15); border-radius:8px; padding:7px 10px; font-size:12px; color:var(--text-main); outline:none; }
    .comm-comment-add input:focus{ border-color:var(--primary-color); }
    .comm-comment-add button{ background:var(--primary-color); color:#fff; border:none; padding:0 14px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; }
    /* Community: image, voting, reporting, sort */

    .comm-sort{ display:inline-flex; background:var(--input-bg); border-radius:9px; padding:2px; margin-left:auto; }

    .comm-sort button.active{ background:var(--card-bg); color:var(--text-main); box-shadow:0 1px 4px rgba(0,0,0,0.08); }

    .compose-img-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .compose-img-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--input-bg); border:1px dashed rgba(128,128,128,0.4); color:var(--text-main); padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; }
    .compose-img-btn:hover{ border-color:var(--primary-color); color:var(--primary-color); }
    .compose-img-preview{ position:relative; display:none; }
    .compose-img-preview img{ max-height:72px; max-width:120px; border-radius:8px; display:block; object-fit:cover; }
    .compose-img-remove{ position:absolute; top:-8px; right:-8px; width:22px; height:22px; border-radius:50%; background:var(--info-mil); color:#fff; border:2px solid var(--card-bg); cursor:pointer; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; }
    #img-lightbox{ position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out; }
    #img-lightbox img{ max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.6); }

    .compose-modal.active{ display:flex; }
    .compose-content{ background:var(--popup-bg); border-radius:18px; padding:20px 22px; width:440px; max-width:90vw; box-shadow:var(--shadow); border:1px solid rgba(128,128,128,0.15); }

    /* Legends made draggable + collapsible */
    .data-legend, .koppen-legend{ cursor:default; }
    .data-legend .dl-drag, .koppen-legend .kl-drag{ position:absolute; top:6px; left:8px; color:var(--text-muted); font-size:13px; cursor:move; user-select:none; padding:2px 4px; border-radius:5px; }
    .data-legend .dl-drag:hover, .koppen-legend .kl-drag:hover{ background:var(--input-bg); color:var(--text-main); }
    .data-legend h4, .koppen-legend h4{ padding-left:18px; }
    .legend-collapsed .dl-bar, .legend-collapsed .dl-scale, .legend-collapsed .dl-hint, .legend-collapsed .kl-item, .legend-collapsed .kl-hint, .legend-collapsed .kl-clear{ display:none !important; }

    /* =====================================================================
       iPhone / iOS-native mobile UI — rebuilt from scratch (v2)
       Apple-OS design language: a Maps-style DRAGGABLE bottom sheet with
       three detents (peek / half / full), frosted "liquid glass" materials,
       safe-area aware, 44pt+ touch targets, SF system typography. The dozen
       map controls are condensed into 2–3 round iOS FABs that open slide-up
       option sheets. All behaviour lives in initMobileUI() (see script).
       ===================================================================== */
    .sheet-grip{ display:none; }                       /* shown only on phones */
    .m-fab-stack, .m-sheet, .m-scrim{ display:none; }  /* mobile-only chrome   */

    @media(max-width:768px){
      :root{ --sidebar-w:100vw; --sheet-ease:cubic-bezier(0.32,0.72,0,1); --peek-h:196px; }
      html,body{ overscroll-behavior:none; }
      *{ -webkit-tap-highlight-color:transparent; }
      .operation-room{ display:block; position:relative; height:100dvh; }
      .map-container{ position:fixed; inset:0; width:100vw; height:100dvh; }

      /* ---------- Bottom sheet (the old left sidebar) ---------- */
      .sidebar{
        position:fixed; left:0; right:0; bottom:0; top:auto;
        width:100%; max-width:100%;
        height:92dvh; max-height:calc(100dvh - env(safe-area-inset-top) - 4px);
        margin:0 !important; padding:0 16px; box-sizing:border-box;
        border:none; border-top:0.5px solid rgba(128,128,128,0.18);
        border-radius:16px 16px 0 0;
        background:var(--sidebar-bg); backdrop-filter:saturate(180%) blur(30px); -webkit-backdrop-filter:saturate(180%) blur(30px);
        box-shadow:0 -8px 36px rgba(0,0,0,0.22);
        z-index:1100; min-height:0; overflow:hidden;
        transform:translateY(var(--sheet-ty,42dvh));
        transition:transform 0.46s var(--sheet-ease); will-change:transform;
      }
      .sidebar.sheet-dragging{ transition:none; }
      .sidebar.collapsed{ margin:0 !important; }       /* legacy class is inert here */

      /* taller grip = easier to grab; more breathing room above the tabs */
      .sheet-grip{ display:block; position:relative; flex:0 0 auto; height:34px; cursor:grab; touch-action:none; }
      .sheet-grip::before{ content:''; position:absolute; top:13px; left:50%; transform:translateX(-50%); width:40px; height:5px; border-radius:3px; background:rgba(128,128,128,0.45); transition:background 0.2s; }
      .sheet-grip:active::before{ background:rgba(128,128,128,0.72); }

      .header-area{ flex:0 0 auto; margin:0 0 8px; }
      h2{ font-size:18px; }
      .btn-settings{ padding:7px 13px; font-size:13px; min-height:34px; border-radius:17px; }

      .search-bar{ flex:0 0 auto; margin:0 0 10px; padding:5px 5px 5px 14px; border-radius:12px; }
      .search-input{ font-size:16px; padding:10px 4px; }     /* 16px stops iOS focus-zoom */
      .search-btn{ min-height:36px; padding:9px 15px; }

      /* mode tabs → iOS segmented control */
      .control-panel{ flex:0 0 auto; flex-wrap:nowrap; gap:0; margin:0 0 10px; padding:3px; background:var(--input-bg); border-radius:11px; }
      .mode-btn{ flex:1 1 0; min-width:0; min-height:36px; padding:8px 4px; font-size:12px; font-weight:600; border-radius:8px; background:transparent; color:var(--text-muted); box-shadow:none !important; }
      .mode-btn.active{ background:var(--card-bg); color:var(--text-main); box-shadow:0 1px 5px rgba(0,0,0,0.12) !important; }
      [data-theme="dark"] .mode-btn.active{ background:#3a3a3c; color:#fff; }

      .news-filter-toggle, .news-pin-toggle{ flex:0 0 auto; }
      .ios-segment-btn{ padding:8px 12px; font-size:12px; min-height:32px; }

      .content-area, .news-reader-pane{ flex:1 1 auto; min-height:0; margin-right:0; padding-right:0; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding-bottom:max(16px,env(safe-area-inset-bottom)); touch-action:pan-y; }

      /* --- declutter the News header + trim oversized controls so more cards fit --- */
      .search-bar{ margin:0 0 8px; }
      .control-panel{ margin:0 0 8px; }
      .news-pin-toggle{ margin:0 0 8px; padding:6px 10px; }
      .news-pin-toggle-label{ font-size:10.5px; }
      #ai-geocode-row{ margin:0 0 8px !important; }
      .ai-action-btn{ padding:9px 10px; font-size:12px; }
      .ios-segment-btn{ padding:7px 10px; font-size:12px; min-height:30px; }
      .m-sheet-title{ font-size:18px; }
      .m-tool-btn{ padding:13px 8px; } .m-tool-btn .ico{ font-size:18px; }

      /* the desktop edge-toggle is replaced by the grip */
      .btn-toggle-sidebar{ display:none !important; }

      /* ---------- Map place-search → expandable round FAB (top-left) ---------- */
      .map-search{ top:max(12px,calc(env(safe-area-inset-top) + 4px)) !important; left:14px !important; right:auto; transform:none !important;
        width:46px; height:46px; min-width:0; padding:0; border-radius:23px; overflow:hidden; justify-content:center; gap:0;
        box-shadow:0 4px 16px rgba(0,0,0,0.18);
        transition:width 0.34s var(--sheet-ease), border-radius 0.34s var(--sheet-ease), opacity 0.25s, transform 0.25s; }
      .map-search input{ width:0; min-width:0; padding:0; opacity:0; font-size:16px; transition:opacity 0.18s; }
      .map-search > button, .map-search #ms-btn{ width:46px; height:46px; flex:0 0 auto; border-radius:23px; }
      .map-search.ms-open{ width:calc(100vw - 28px); height:auto; border-radius:14px; padding:4px 4px 4px 14px; justify-content:flex-start; gap:6px; }
      .map-search.ms-open input{ width:auto; flex:1 1 auto; opacity:1; padding:11px 4px; }
      .map-search.ms-open > button, .map-search.ms-open #ms-btn{ width:auto; }
      .map-search-results{ top:54px; }

      /* ---------- Hide the cramped desktop control cluster ---------- */
      .map-controls-top{ display:none !important; }

      /* ---------- iOS round control FABs (top-right) ---------- */
      .m-fab-stack{ display:flex; flex-direction:column; gap:10px; position:fixed; right:14px;
        top:max(12px,calc(env(safe-area-inset-top) + 4px)); z-index:1150;
        transition:opacity 0.3s, transform 0.3s; }
      .m-fab{ width:46px; height:46px; border-radius:23px; border:0.5px solid rgba(128,128,128,0.16);
        background:var(--sidebar-bg); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
        box-shadow:0 4px 16px rgba(0,0,0,0.18); display:flex; align-items:center; justify-content:center;
        color:var(--text-main); padding:0; transition:transform 0.14s, background 0.2s, color 0.2s; }
      .m-fab:active{ transform:scale(0.9); }
      .m-fab.on{ background:var(--primary-color); color:#fff; border-color:transparent; }
      .m-fab svg{ display:block; }
      /* compass is always available on mobile (like desktop); it simply counter-rotates */
      .m-fab-compass{ display:flex; }
      .m-compass-svg{ transition:transform 0.1s linear; }

      /* hide floating chrome when the sheet is fully expanded, or while searching (avoids the
         expanded search box overlapping the top-right FAB stack) */
      body.sheet-full .m-fab-stack, body.search-open .m-fab-stack{ opacity:0; pointer-events:none; transform:translateX(14px); }
      body.sheet-full .map-search{ opacity:0; pointer-events:none; transform:translateX(-14px) !important; }

      /* ---------- Slide-up option sheets (Map / Tools) ---------- */
      .m-scrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.3); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); z-index:1690; opacity:0; pointer-events:none; transition:opacity 0.32s; }
      .m-scrim.show{ opacity:1; pointer-events:auto; }
      .m-sheet{ display:flex; flex-direction:column; position:fixed; left:0; right:0; bottom:0; z-index:1700;
        background:var(--popup-bg); backdrop-filter:saturate(180%) blur(30px); -webkit-backdrop-filter:saturate(180%) blur(30px);
        border-radius:16px 16px 0 0; box-shadow:0 -8px 36px rgba(0,0,0,0.26);
        max-height:82dvh; padding:0 18px max(18px,env(safe-area-inset-bottom));
        transform:translateY(110%); transition:transform 0.42s var(--sheet-ease); will-change:transform; }
      .m-sheet.show{ transform:translateY(0); }
      .m-sheet-grip{ flex:0 0 auto; height:22px; position:relative; touch-action:none; cursor:grab; }
      .m-sheet-grip::before{ content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:36px; height:5px; border-radius:3px; background:rgba(128,128,128,0.45); }
      .m-sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 2px 12px; }
      .m-sheet-title{ font-size:20px; font-weight:700; letter-spacing:-0.3px; }
      .m-sheet-done{ background:transparent; border:none; color:var(--primary-color); font-size:16px; font-weight:600; padding:4px 6px; }
      .m-sheet-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto; min-height:0; padding-bottom:6px; }

      .m-seg-block{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
      .m-seg{ display:flex; background:var(--input-bg); border-radius:11px; padding:3px; gap:3px; }
      .m-seg-btn{ flex:1; min-height:40px; border:none; background:transparent; color:var(--text-muted); font-size:14px; font-weight:600; border-radius:8px; transition:0.2s; }
      .m-seg-btn.active{ background:var(--card-bg); color:var(--text-main); box-shadow:0 1px 5px rgba(0,0,0,0.12); }
      [data-theme="dark"] .m-seg-btn.active{ background:#3a3a3c; color:#fff; }

      .m-tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
      .m-tool-btn{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:15px 8px; border:none; border-radius:14px; background:var(--input-bg); color:var(--text-main); font-size:13px; font-weight:600; transition:0.18s; }
      .m-tool-btn .ico{ font-size:20px; line-height:1; }
      .m-tool-btn:active{ transform:scale(0.96); }
      .m-tool-btn.active{ background:var(--primary-color); color:#fff; }

      /* config panels relocated into the option sheets: strip their floating skin */
      .m-sheet .layer-dropdown{ display:flex !important; position:static !important; inset:auto !important; margin:0 !important; padding:0 !important; min-width:0 !important; max-height:none !important; box-shadow:none !important; border:none !important; background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
      .m-sheet .layer-dropdown .layer-option{ padding:11px 6px; font-size:15px; min-height:42px; }
      .m-sheet .sat-controller{ position:static !important; inset:auto !important; width:auto !important; margin:12px 0 0 !important; box-shadow:none !important; border:1px solid rgba(128,128,128,0.14) !important; max-height:none !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }

      /* ---------- Floating map panels dock just above the sheet peek ---------- */
      .coord-readout{ display:none !important; }
      .country-info{ left:12px !important; right:12px !important; top:auto !important; bottom:calc(var(--peek-h) + 12px); width:auto !important; max-height:38dvh; overflow-y:auto; }
      .tool-panel{ left:12px !important; right:12px !important; top:auto !important; bottom:calc(var(--peek-h) + 12px); width:auto !important; max-width:none; max-height:42dvh; overflow-y:auto; }
      .map-container.sat-on .tool-panel{ bottom:calc(var(--peek-h) + 12px) !important; }
      .koppen-legend, .data-legend{ top:auto !important; bottom:calc(var(--peek-h) + 12px) !important; right:10px !important; left:auto !important; max-width:calc(100vw - 20px); width:auto; max-height:32dvh; overflow-y:auto; }
      .news-timeline{ top:auto !important; bottom:calc(var(--peek-h) + 12px) !important; right:12px !important; left:auto !important; max-width:calc(100vw - 24px); font-size:11px; }
      .ai-view-summary-btn{ bottom:calc(var(--peek-h) + 12px); font-size:12px; padding:8px 14px; }
      body.sheet-full .ai-view-summary-btn{ display:none; }
      .news-timeline .ntl-body{ min-width:0; } .ntl-label{ min-width:0; flex:1; font-size:11px; }
      .pin-popup{ min-width:0; width:max-content; max-width:calc(100vw - 24px); font-size:13px; }
      .ctx-menu{ min-width:210px; } .ctx-menu button{ padding:13px 12px; font-size:15px; }

      /* ---------- Modals → bottom sheets ---------- */
      .modal-overlay, .compose-modal{ align-items:flex-end; padding:0; }
      .modal-content, .compose-content{ position:relative; width:100% !important; max-width:100% !important; border-radius:18px 18px 0 0 !important; padding:26px 20px max(22px,env(safe-area-inset-bottom)) !important; max-height:88dvh; animation:mSheetUp 0.42s var(--sheet-ease); }
      .modal-content::before, .compose-content::before, .country-popup::before{ content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:36px; height:5px; border-radius:3px; background:rgba(128,128,128,0.4); }
      /* Settings uses an explicit × button instead of the grip bar */
      #settings-modal .modal-content::before{ display:none !important; }
      #settings-modal .modal-content{ padding-top:20px !important; }
      .modal-content input, .modal-content select, .compose-content input, .compose-content textarea, .setting-group select{ font-size:16px; }
      .setting-group select{ min-height:46px; }
      .country-popup{ position:fixed !important; left:0 !important; right:0 !important; bottom:0 !important; top:auto !important; width:100% !important; max-width:100% !important; max-height:84dvh; border-radius:18px 18px 0 0; transform:none !important; padding:26px 18px max(20px,env(safe-area-inset-bottom)); animation:mSheetUp 0.42s var(--sheet-ease); }

      /* news in-site browser respects the notch */
      .nb-toolbar{ padding-top:max(8px,env(safe-area-inset-top)); padding-left:10px; padding-right:10px; }
      .nb-url{ font-size:11px; padding:7px 10px; } .nb-btn{ min-height:40px; }

      /* roomier tap targets across content */
      .news-item{ padding:16px; } .stat-row{ padding:15px 14px; }
      .dash-nav-btn{ padding:10px 14px; min-height:38px; }
      .news-item .news-actions button{ padding:11px; font-size:12px; }
      .comm-add-btn{ padding:12px; font-size:13px; } .comm-post-actions button{ min-height:36px; }
      .scb-actions button{ padding:11px 6px; font-size:12px; }
      .wiki-card-img{ height:120px; } .wiki-card-content{ padding:14px; }

      /* touch devices: no sticky :hover lift, use a subtle press instead */
      .news-item:hover, .news-item.hovered, .wiki-card:hover, .wiki-card.hovered{ transform:none; }
      .news-item:active, .wiki-card:active{ transform:scale(0.985); }
    }

    @keyframes mSheetUp{ from{ transform:translateY(7%); opacity:0.5; } to{ transform:translateY(0); opacity:1; } }

    @media(max-width:480px){
      h2{ font-size:17px; }
      .m-sheet-title{ font-size:19px; }
    }
    @media (prefers-reduced-motion: reduce){
      .sidebar, .m-sheet, .m-scrim, .map-search{ transition-duration:0.01ms !important; }
      .modal-content, .compose-content, .country-popup{ animation:none !important; }
    }
  </style>
</head>
<body>
<div class="operation-room">
  <div class="sidebar" id="sidebar">
    <div class="sheet-grip" id="sheet-grip" aria-hidden="true"></div>
    <div class="header-area">
      <div class="title-group"><h2>IntMap</h2><div class="lang-toggle"><button class="lang-btn active" id="lang-en">EN</button><button class="lang-btn" id="lang-jp">JP</button></div></div>
      <button class="btn-settings" id="btn-open-settings"><span id="text-settings">Settings</span></button>
    </div>
    <div class="control-panel">
      <button class="mode-btn active" id="btn-news" data-i18n="tabNews">News</button>
      <button class="mode-btn" id="btn-info" data-i18n="tabInfo">Information</button>
      <button class="mode-btn" id="btn-stats" data-i18n="tabStats">Stats</button>
      <button class="mode-btn" id="btn-community" data-i18n="tabCommunity">Community</button>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="Search..." data-i18n-ph="searchPh">
      <button class="search-btn" id="btn-search" data-i18n="searchBtn">Search</button>
    </div>
    <div class="news-filter-toggle" id="news-filter-toggle" style="display:none; margin:0 0 12px 0;">
      <div class="ios-segment" role="tablist" style="width:100%;">
        <button class="ios-segment-btn active" id="newsfilter-all" style="flex:1;">All</button>
        <button class="ios-segment-btn" id="newsfilter-saved" style="flex:1;">★ Saved</button>
      </div>
    </div>
    <div class="news-pin-toggle" id="news-pin-toggle" style="display:none;">
      <span class="news-pin-toggle-label" data-i18n="lblPinMode">News pin position</span>
      <div class="ios-segment" role="tablist">
        <button class="ios-segment-btn active" id="pinmode-loc" data-i18n="pinModeLoc">Subject</button>
        <button class="ios-segment-btn" id="pinmode-pub" data-i18n="pinModePub">Publisher</button>
      </div>
    </div>
    <div id="ai-geocode-row" style="display:none; margin:0 0 12px 0;">
      <button class="ai-action-btn" id="ai-geocode-btn">✨ AI-locate all news</button>
    </div>
    <div class="content-area" id="live-news-feed"></div>
    <div class="content-area" id="info-dashboard" style="display:none;"></div>
    <div class="content-area" id="community-feed" style="display:none;"></div>
    <div class="news-reader-pane" id="news-reader-pane" style="display:none;"></div>
  </div>

  <div class="map-container" id="map-container">
    <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Toggle Sidebar"><span class="chev"></span></button>
    <div class="map-search" id="map-search">
      <input id="ms-input" type="text" placeholder="Search any place on Earth..." data-i18n-ph="msPh">
      <button id="ms-btn" title="Search">🔍</button>
      <div class="map-search-results" id="ms-results"></div>
    </div>
    <div class="map-controls-top">
      <div class="map-view-group">
        <button class="view-btn active" id="btn-view-map" data-i18n="viewMap">Map</button>
        <button class="view-btn" id="btn-view-sat" data-i18n="viewSat">Satellite</button>
      </div>
      <div class="map-view-group">
        <button class="view-btn" id="btn-view-flat" data-i18n="flat">Flat</button>
        <button class="view-btn active" id="btn-view-globe" data-i18n="globe">Globe</button>
        <button class="view-btn compass-btn" id="btn-compass" title="Reset North">
          <svg class="compass-svg" width="20" height="20" viewBox="0 0 24 24">
            <polygon points="12,2 9,12 12,9.5 15,12" fill="#ff3b30"/>
            <polygon points="12,22 9,12 12,14.5 15,12" fill="#9aa0a6"/>
          </svg>
        </button>
      </div>
      <div class="map-view-group">
        <button class="view-btn" id="btn-tool-grid" data-i18n="gridBtn" title="Grid + Labels">🌐 Grid</button>
        <button class="view-btn" id="btn-tool-measure" data-i18n="measureBtn" title="Measure Distance">📏 Measure</button>
        <button class="view-btn" id="btn-tool-area" data-i18n="areaBtn" title="Measure Area">📐 Area</button>
        <button class="view-btn" id="btn-tool-radius" data-i18n="radiusBtn" title="Radius">⭕ Radius</button>
        <div class="layer-menu-container">
          <button class="view-btn" id="btn-layers" data-i18n="layersBtn" style="background:rgba(0,0,0,0.05); margin-left:4px;">Layers ▾</button>
          <div class="layer-dropdown" id="layer-dropdown">
             <label class="layer-option"><input type="checkbox" id="cb-names" checked> <span data-i18n="placeNames">Place names</span></label>
             <label class="layer-option"><input type="checkbox" id="cb-borders" checked> <span data-i18n="borders">Country borders</span></label>
             <label class="layer-option"><input type="checkbox" id="cb-countries"> <span data-i18n="countries">Countries (info)</span></label>
             <hr style="border:0; border-top:1px solid rgba(128,128,128,0.2); width:100%; margin:4px 0;">
             <div class="layer-group-title" data-i18n="lyrGrpGeo">Geopolitical theory</div>
             <label class="layer-option"><input type="checkbox" data-layer="heartland" class="geo-layer-cb"> <span class="lyr-sw" style="background:#ff3b30"></span> Heartland</label>
             <label class="layer-option"><input type="checkbox" data-layer="rimland" class="geo-layer-cb"> <span class="lyr-sw" style="background:#0a84ff"></span> Rimland</label>
             <label class="layer-option"><input type="checkbox" data-layer="sahel" class="geo-layer-cb"> <span class="lyr-sw" style="background:#ffcc00"></span> Sahel Risk Zone</label>
             <label class="layer-option"><input type="checkbox" data-layer="islandChain1" class="geo-layer-cb"> <span class="lyr-sw" style="background:#ff9500"></span> 1st Island Chain</label>
             <label class="layer-option"><input type="checkbox" data-layer="islandChain2" class="geo-layer-cb"> <span class="lyr-sw" style="background:#af52de"></span> 2nd Island Chain</label>
             <label class="layer-option"><input type="checkbox" data-layer="stringOfPearls" class="geo-layer-cb"> <span class="lyr-sw" style="background:#5856d6"></span> String of Pearls</label>
             <label class="layer-option"><input type="checkbox" data-layer="seaRoute" class="geo-layer-cb"> <span class="lyr-sw" style="background:#34c759"></span> Northern Sea Route</label>
             <label class="layer-option"><input type="checkbox" data-layer="chokepoints" class="geo-layer-cb"> <span class="lyr-sw" style="background:#ff9500"></span> Global Chokepoints</label>
             <div class="layer-group-title" data-i18n="lyrGrpStrat">Strategic networks</div>
             <label class="layer-option"><input type="checkbox" data-layer="nato" class="geo-layer-cb"> <span class="lyr-sw" style="background:#1d4ed8"></span> NATO Posture</label>
             <label class="layer-option"><input type="checkbox" data-layer="bri" class="geo-layer-cb"> <span class="lyr-sw" style="background:#e8590c"></span> Belt &amp; Road (BRI)</label>
             <label class="layer-option"><input type="checkbox" data-layer="pipelines" class="geo-layer-cb"> <span class="lyr-sw" style="background:#c2271f"></span> Major Pipelines</label>
             <label class="layer-option"><input type="checkbox" data-layer="cables" class="geo-layer-cb"> <span class="lyr-sw" style="background:#30b0c7"></span> Submarine Cables</label>
             <label class="layer-option"><input type="checkbox" data-layer="nuclear" class="geo-layer-cb"> <span class="lyr-sw" style="background:#9b59b6"></span> Nuclear Sites</label>
          </div>
        </div>
      </div>
    </div>
    <div id="map"></div>
    <div id="tool-panel" class="tool-panel"></div>
    <div id="country-info" class="country-info"></div>
    <div id="coord-readout" class="coord-readout"></div>
    <button id="ai-view-summary-btn" class="ai-view-summary-btn" type="button" data-i18n-title="aiViewSumBtn" title="Summarize the visible area">🛰️ <span data-i18n="aiViewSumBtn">Summarize this view</span></button>
    <div id="sat-controller" class="sat-controller"></div>
    <div id="measure-tooltip" class="measure-tooltip"></div>
    <div id="ctx-menu" class="ctx-menu"></div>
    <div id="pin-popup" class="pin-popup"></div>
    <!-- Time-travel news timeline -->
    <div id="news-timeline" class="news-timeline collapsed">
      <button class="ntl-toggle" id="ntl-toggle" data-i18n-title="tlTitle" title="Time-travel news">🕘</button>
      <div class="ntl-body" id="ntl-body">
        <div class="ntl-head">
          <span class="ntl-label" id="ntl-label">Today</span>
          <input type="date" id="ntl-date" class="ntl-date">
          <button class="ntl-today" id="ntl-today" data-i18n="tlToday">Today</button>
        </div>
        <input type="range" id="ntl-slider" class="ntl-slider" min="0" max="3650" value="3650" step="1">
        <div class="ntl-scale"><span data-i18n="tl10y">−10y</span><span data-i18n="tl5y">−5y</span><span data-i18n="tlNow">Now</span></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settings-modal">
  <div class="modal-content" style="position:relative;">
    <button id="settings-close-x" type="button" aria-label="Close" title="Close" style="position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;border-radius:50%;background:var(--input-bg);color:var(--text-main);font-size:17px;line-height:1;cursor:pointer;z-index:2;">×</button>
    <h3 style="margin:0 0 20px 0; font-size:18px;" id="modal-title">Settings</h3>
    <div class="setting-group"><label id="lbl-theme">Appearance</label><select id="setting-theme"><option value="auto" id="opt-theme-auto">System Default</option><option value="light">Light Mode</option><option value="dark">Dark Mode</option></select></div>
    <div class="setting-group"><label id="lbl-units" data-i18n="lblUnits">Measurement units</label><select id="setting-units"><option value="both" data-i18n="unitBoth">Metric + Imperial</option><option value="metric" data-i18n="unitMetric">Metric only</option><option value="imperial" data-i18n="unitImperial">Imperial only</option></select></div>
    <div class="setting-group"><label data-i18n="lblNewsLang">News languages</label><select id="setting-newslang"><option value="ui" data-i18n="newsLangUi">Current language only</option><option value="multi" data-i18n="newsLangMulti">All languages (auto-translate titles)</option></select></div>
    <div class="setting-group"><label data-i18n="lblAiLocate">AI location analysis</label><select id="setting-ailocate"><option value="manual" data-i18n="aiLocManual">Manual (button)</option><option value="auto" data-i18n="aiLocAuto">Automatic for all news</option></select></div>
    <div class="setting-group"><label id="lbl-tz">Timezone Setting</label><select id="setting-tz"></select></div>

      tiles:(d)=>['https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_NOAA20_CorrectedReflectance_TrueColor/default/'+d+'/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg'] },

  const satDefaultDay=new Date(Date.now()-3*864e5).toISOString().slice(0,10); /* GIBS lags ~1-2 days; -3 is safe */
  let satState={ providerId:'esri', day:satDefaultDay, year:2024, opacity:1 };

  const satProviderById=(id)=>SAT_PROVIDERS.find(p=>p.id===id);
  /* Pro entitlement: admins always count; otherwise a profiles.is_pro flag (read in refreshCurrentUser). */
  function imIsPro(){ return !!(typeof currentUser!=='undefined' && currentUser && (currentUser.isAdmin || currentUser.isPro)); }
  /* BYOK/paid satellite providers require Pro AND a saved key; free providers are always usable. */
  const satHasKey=(p)=>p.tier==='free' || (imIsPro() && !!(satKeys[p.keyName]&&String(satKeys[p.keyName]).trim()));
  const satMaxDay=()=>new Date().toISOString().slice(0,10);
  function satMsg(key,p){ return String(t(key)||'').replace('{provider}',(p&&(p.name[currentLang]||p.name.en||p.short))||''); }
  function satCaptureLabel(p){ if(!p) return ''; if(!p.dated) return t('satLatest'); if(p.dateMode==='year') return satState.year+' '+t('satMosaicSuffix'); return satState.day; }

  function satRefreshReadout(){ try{ renderCoordReadout(); }catch(_){} }
  function satToast(msg){
    let el=document.getElementById('sat-toast');
    if(!el){ el=document.createElement('div'); el.id='sat-toast'; el.className='sat-toast'; document.body.appendChild(el); }
    el.textContent=msg; el.classList.add('show');
    clearTimeout(satToast._t); satToast._t=setTimeout(()=>el.classList.remove('show'),4400);

  /* Self-rescheduling style-ready guard (same pattern that fixed the layer race). */
  function satReady(cb,n){ n=n||0; if(map&&map.isStyleLoaded()){ try{cb();}catch(_){ } return; } if(n>80) return; setTimeout(()=>satReady(cb,n+1),160); }
  function satBuildTiles(p){
    const da=p.dateMode==='year'?satState.year:satState.day;
    if(p.tier==='pro'){ const k=satKeys[p.keyName]; if(!k||!String(k).trim()) return null; return p.tiles(da,String(k).trim()); }
    return p.tiles(da);
  }
  /* Core: load the selected provider into the idle buffer, then cross-fade (double-buffering). */
  function satApply(animate){
    if(!map) return;
    const p=satProviderById(satState.providerId); if(!p) return;
    satErrCount=0;
    /* Esri = the always-present base layer (layer-sat): no buffer needed → it is our fallback. */
    if(p.id==='esri'){ satShowBase(animate); return; }
    const tiles=satBuildTiles(p);
    if(!tiles){ satToast(t('satLocked')); satRevertToFallback(); return; }
    if(map.getLayer('layer-sat')) map.setPaintProperty('layer-sat','raster-opacity',1); /* solid fallback under the buffer */
    const target=(satActive===0)?1:0, srcId='sat-src-'+target, lyrId='sat-fx-'+target;
    try{ if(map.getLayer(lyrId)) map.removeLayer(lyrId); if(map.getSource(srcId)) map.removeSource(srcId); }catch(_){}
    try{
      map.addSource(srcId,{type:'raster',tiles:tiles,tileSize:256,maxzoom:p.maxzoom||19,attribution:p.attribution||''});
      const before=map.getLayer('layer-sat-labels')?'layer-sat-labels':undefined;
      map.addLayer({id:lyrId,type:'raster',source:srcId,layout:{visibility:'visible'},
        paint:{'raster-opacity':animate?0:satState.opacity,'raster-opacity-transition':{duration:animate?450:0}}},before);
    }catch(e){ console.warn('satApply add failed',e); return; }
    const prev=satActive;
    const finish=()=>{
      if(map.getLayer(lyrId)) map.setPaintProperty(lyrId,'raster-opacity',satState.opacity);
      if(prev!==-1 && prev!==target){
        const pl='sat-fx-'+prev, ps='sat-src-'+prev;
        if(map.getLayer(pl)){ map.setPaintProperty(pl,'raster-opacity-transition',{duration:450}); map.setPaintProperty(pl,'raster-opacity',0); }
        setTimeout(()=>{ if(satActive!==prev){ try{ if(map.getLayer(pl)) map.removeLayer(pl); if(map.getSource(ps)) map.removeSource(ps); }catch(_){} } },520);
      }
      satActive=target; satLastGood=satState.providerId; satErrCount=0;
    };
    if(!animate){ finish(); return; }
    let done=false;
    const onData=(e)=>{ if(e&&e.sourceId===srcId&&e.isSourceLoaded){ if(done)return; done=true; map.off('sourcedata',onData); finish(); } };
    map.on('sourcedata',onData);
    setTimeout(()=>{ if(!done){ done=true; map.off('sourcedata',onData); finish(); } },1900);
  }
  function satShowBase(animate){
    if(satActive!==-1){
      const a=satActive, pl='sat-fx-'+a, ps='sat-src-'+a;
      if(map.getLayer(pl)){ map.setPaintProperty(pl,'raster-opacity-transition',{duration:animate?450:0}); map.setPaintProperty(pl,'raster-opacity',0); }
      setTimeout(()=>{ if(satState.providerId==='esri'){ try{ if(map.getLayer(pl)) map.removeLayer(pl); if(map.getSource(ps)) map.removeSource(ps); }catch(_){} } },animate?520:0);
      satActive=-1;
    }
    if(map.getLayer('layer-sat')) map.setPaintProperty('layer-sat','raster-opacity',satState.opacity);
    satLastGood='esri';
  }
  function satSetOpacity(v){
    satState.opacity=v;
    const p=satProviderById(satState.providerId);
    if(p&&p.id==='esri'){ if(map.getLayer('layer-sat')) map.setPaintProperty('layer-sat','raster-opacity',v); }
    else if(satActive!==-1&&map.getLayer('sat-fx-'+satActive)){ map.setPaintProperty('sat-fx-'+satActive,'raster-opacity',v); }
  }
  function satSelectProvider(id){
    const p=satProviderById(id); if(!p) return;
    if(!satHasKey(p)){ satToast(t('satLocked')); satRenderController(); return; }
    satState.providerId=id; satErrCount=0;
    satRenderController(); satApply(true); satRefreshReadout();
  }
  function satStepDay(delta){
    const d=new Date(satState.day+'T00:00:00Z'); if(isNaN(d.getTime())) return;
    d.setUTCDate(d.getUTCDate()+delta);
    let s=d.toISOString().slice(0,10); const today=satMaxDay(); if(s>today) s=today;
    satState.day=s;
    const inp=document.getElementById('satc-day'); if(inp) inp.value=s;
    satApply(true); satRefreshReadout();
  }
  function satRevertToFallback(){
    const fb=(satLastGood&&satLastGood!==satState.providerId)?satLastGood:'esri';
    satState.providerId=fb; satErrCount=0;
    satRenderController(); satApply(true); satRefreshReadout();
  }
  /* Render-state tracking: tile/auth failures on a sat buffer → notify + fall back. */
  function satOnError(e){
    if(!e||!e.sourceId||String(e.sourceId).indexOf('sat-src-')!==0) return;
    const p=satProviderById(satState.providerId); if(!p) return;
    const st=e.error&&e.error.status;
    if(st===401||st===403){ satToast(satMsg('satErrAuth',p)); satErrCount=0; satRevertToFallback(); return; }
    satErrCount++;
    if(satErrCount>=4){ satErrCount=0; satToast(satMsg('satErrTiles',p)); satRevertToFallback(); }
  }
  /* Sat-Controller panel (provider + capture-date + opacity). Rebuilt on change / language. */
  function satRenderController(){

    const p=satProviderById(satState.providerId)||SAT_PROVIDERS[0];
    let opts='';
    SAT_PROVIDERS.forEach(pr=>{
      const sel=pr.id===satState.providerId?' selected':'', nm=pr.name[currentLang]||pr.name.en;
      if(pr.tier==='free') opts+=`<option value="${pr.id}"${sel}>${nm}</option>`;
      else { const has=satHasKey(pr); opts+=`<option value="${pr.id}"${sel}${has?'':' disabled'}>${has?'':'🔒 '}${nm}${has?'':' — '+t('satLocked')}</option>`; }
    });

    } else if(p.dated&&p.dateMode==='year'){

    }
    panel.innerHTML=`<div class="satc-head">📡 <span>${t('satCtrlTitle')}</span><button id="satc-close" title="${currentLang==='jp'?'閉じる':'Close'}" aria-label="Close" style="margin-left:auto;background:var(--input-bg);border:none;color:var(--text-main);width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;">×</button></div>`+
      `<div class="satc-row"><label>${t('satProvider')}</label><select id="satc-provider">${opts}</select></div>`+
      dateCtrl+
      `<div class="satc-row"><label>${t('opacity')}</label><input type="range" id="satc-op" min="0.2" max="1" step="0.05" value="${satState.opacity}"></div>`+
      aiSatChangeBlockHTML(p)+

    const yy=panel.querySelector('#satc-year'); if(yy) yy.onchange=ev=>{ satState.year=parseInt(ev.target.value,10)||satState.year; satApply(true); satRefreshReadout(); };
    const pv=panel.querySelector('#satc-prev'); if(pv) pv.onclick=()=>satStepDay(-1);

    const cl=panel.querySelector('#satc-close'); if(cl) cl.onclick=()=>{ satPanelDismissed=true; panel.style.display='none'; };
  }
  /* Settings-modal API-key management (Pro / BYOK providers). */

    if(!map) return;

    if(currentMapType==='sat') satReady(()=>{ satRenderController(); satApply(false); });
  }
  /* Debug aid (same spirit as window.__imap / window.refreshDatedLayer): inspect the sat engine. */
  try{ window.__sat={ providers:SAT_PROVIDERS, state:satState, keys:()=>satKeys, build:satBuildTiles, hasKey:satHasKey,
    render:satRenderController, apply:satApply, select:satSelectProvider, setOpacity:satSetOpacity, step:satStepDay,
    chip:satChipHTML, capture:satCaptureLabel, renderKeys:satRenderKeyInputs, saveKeys:satSaveKeyInputs,
    mapReady:()=>{ try{ return !!(map&&map.isStyleLoaded()); }catch(e){ return 'err:'+e.message; } } }; }catch(_){}

  /* =====================================================================
   *  AI ENGINE — BYOK (OpenAI / Anthropic / Google Gemini) + Chrome on-device.
   *  Single entry point:  askAI(prompt, systemPrompt, imageDatas) -> Promise<string>
   *  All four AI features (geocoding, translation, area summary, vision change
   *  detection) route through this wrapper, so every per-provider difference
   *  lives in ONE place. Mirrors the satellite BYOK pattern (registry +
   *  localStorage + Settings UI). Keys never leave the browser.
   * ===================================================================== */
  /* Providers = the 4 API integrations. The MODEL is NOT a fixed list — it's free text
     (per provider), so any model the provider offers (incl. ones newer than IntMap) works.
     `suggest` is just a non-binding datalist; `defaultModel` is the fallback/placeholder.
     `vision` is now a PROVIDER capability (only Chrome on-device can't take images). */
  /* Models are NOT pinned by IntMap — they are fetched live from each provider's API
     (see aiListModels), so new/renamed/retired models are picked up automatically.
     `fallbackModel` is only used if that live fetch fails (offline/CORS); `tier` is a
     light preference for auto-selecting a fast/cheap current model from the live list. */
  const AI_PROVIDERS=[
    { id:'openai', name:{en:'OpenAI',jp:'OpenAI'}, needsKey:true, vision:true, keyPh:'sk-…', getKey:'https://platform.openai.com/api-keys', fallbackModel:'gpt-4o-mini', tier:/mini/i },
    { id:'anthropic', name:{en:'Anthropic (Claude)',jp:'Anthropic (Claude)'}, needsKey:true, vision:true, keyPh:'sk-ant-…', getKey:'https://console.anthropic.com/settings/keys', fallbackModel:'claude-3-5-haiku-latest', tier:/haiku/i },
    { id:'gemini', name:{en:'Google Gemini',jp:'Google Gemini'}, needsKey:true, vision:true, keyPh:'AIza…', getKey:'https://aistudio.google.com/app/apikey', fallbackModel:'gemini-2.0-flash', tier:/flash/i },
    { id:'chrome', name:{en:'Chrome Built-in AI',jp:'Chrome内蔵AI'}, needsKey:false, vision:false, onDevice:true, getKey:'https://developer.chrome.com/docs/ai/built-in' }
  ];
  let aiConfig={ provider:'openai', models:{}, keys:{} };
  try{ const s=JSON.parse(localStorage.getItem('intmap_ai_config')||'null'); if(s&&typeof s==='object'){
    if(s.provider) aiConfig.provider=s.provider;
    aiConfig.keys=Object.assign({},s.keys||{});
    aiConfig.models=Object.assign({},s.models||{});
    if(typeof s.model==='string' && s.model && !aiConfig.models[aiConfig.provider]) aiConfig.models[aiConfig.provider]=s.model; /* migrate legacy single-model field */
  } }catch(_){}
  const saveAIConfig=()=>{ try{ localStorage.setItem('intmap_ai_config',JSON.stringify(aiConfig)); }catch(_){} };
  const aiProviderById=(id)=>AI_PROVIDERS.find(p=>p.id===id)||AI_PROVIDERS[0];
  /* The live-selected model for a provider; emergency fallback only if the list fetch failed. */
  function aiModelFor(p){ return (aiConfig.models&&aiConfig.models[p.id]&&String(aiConfig.models[p.id]).trim())||p.fallbackModel||''; }
  function aiCurrent(){ const p=aiProviderById(aiConfig.provider); return {p, model:aiModelFor(p)}; }
  function aiKeyFor(p){ return (aiConfig.keys&&aiConfig.keys[p.id]&&String(aiConfig.keys[p.id]).trim())||''; }
  function aiReady(){ const {p}=aiCurrent(); return p.needsKey? !!aiKeyFor(p) : true; }
  function aiVisionReady(){ const {p}=aiCurrent(); return !!p.vision && aiReady(); }
  function aiErrSnippet(txt){ try{ const j=JSON.parse(txt); return (j.error&&(j.error.message||j.error.code))||JSON.stringify(j).slice(0,180); }catch(_){ return String(txt||'').slice(0,180); } }

  /* Fetch the CURRENT model list straight from the provider with the user's key, so
     IntMap never hardcodes a model name. Returns string[] (model ids) or null on failure. */
  async function aiListModels(p,key){
    try{
      if(p.id==='openai'){
        const r=await fetch('https://api.openai.com/v1/models',{headers:{'Authorization':'Bearer '+key}});
        if(!r.ok) return null; const j=await r.json();
        return (j.data||[]).map(m=>m.id).filter(id=>/^(gpt-|o[0-9]|chatgpt)/i.test(id) && !/(embedding|whisper|tts|audio|realtime|image|dall-e|moderation|transcribe|search|babbage|davinci)/i.test(id)).sort();
      }
      if(p.id==='anthropic'){
        const r=await fetch('https://api.anthropic.com/v1/models?limit=100',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
        if(!r.ok) return null; const j=await r.json();
        return (j.data||[]).map(m=>m.id);
      }
      if(p.id==='gemini'){
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key));
        if(!r.ok) return null; const j=await r.json();
        return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name||'').replace(/^models\//,'')).filter(id=>/gemini/i.test(id));
      }
    }catch(_){}
    return null;
  }
  /* Auto-pick a sensible CURRENT model from the live list (prefers the provider's fast tier). */
  function aiPickDefaultModel(p,list){
    if(!list||!list.length) return p.fallbackModel||'';
    const stable=list.filter(id=>!/(preview|exp|nightly|thinking|tts|image|audio|embedding)/i.test(id));
    const pool=stable.length?stable:list;
    if(p.tier){ const hit=pool.filter(id=>p.tier.test(id)); if(hit.length) return hit.sort().reverse()[0]; }
    return pool.sort().reverse()[0];
  }

  /* ---- Unified entry point used by every AI feature ---- */
  async function askAI(prompt, systemPrompt, imageDatas){
    const {p,model}=aiCurrent();
    const imgs=(imageDatas||[]).filter(Boolean);
    if(p.needsKey && !aiKeyFor(p)) throw new Error(t('aiNoKey'));
    if(imgs.length && !p.vision) throw new Error(t('aiNoVision'));
    if(p.id==='openai')    return aiCallOpenAI(model, aiKeyFor(p), prompt, systemPrompt, imgs);
    if(p.id==='anthropic') return aiCallAnthropic(model, aiKeyFor(p), prompt, systemPrompt, imgs);
    if(p.id==='gemini')    return aiCallGemini(model, aiKeyFor(p), prompt, systemPrompt, imgs);
    if(p.id==='chrome')    return aiCallChrome(prompt, systemPrompt);
    throw new Error('Unknown AI provider');
  }
  async function askAIJSON(prompt, systemPrompt, imageDatas){ return aiParseJSON(await askAI(prompt, systemPrompt, imageDatas)); }
  function aiParseJSON(raw){
    if(raw==null) return null;
    let s=String(raw).trim();
    const fence=s.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) s=fence[1].trim();
    const seg=s.match(/[\[{][\s\S]*[\]}]/); if(seg) s=seg[0];
    try{ return JSON.parse(s); }catch(_){ try{ return JSON.parse(s.replace(/,\s*([\]}])/g,'$1')); }catch(__){ return null; } }
  }
  function aiImgPart(d){ const m=/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/.exec(d||''); return m?{mime:m[1],b64:m[2]}:null; }

  async function aiCallOpenAI(model,key,prompt,system,imgs){
    const userContent = imgs.length ? [{type:'text',text:prompt}, ...imgs.map(d=>({type:'image_url',image_url:{url:d}}))] : prompt;
    const messages=[]; if(system) messages.push({role:'system',content:system});
    messages.push({role:'user',content:userContent});
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,messages,temperature:0.3,max_tokens:1600})});
    if(!r.ok) throw new Error('OpenAI '+r.status+': '+aiErrSnippet(await r.text().catch(()=>'')));
    const j=await r.json(); return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  }
  async function aiCallAnthropic(model,key,prompt,system,imgs){
    const content=[];
    imgs.forEach(d=>{ const ip=aiImgPart(d); if(ip) content.push({type:'image',source:{type:'base64',media_type:ip.mime,data:ip.b64}}); });
    content.push({type:'text',text:prompt});
    const body={model,max_tokens:1600,messages:[{role:'user',content}]}; if(system) body.system=system;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body)});
    if(!r.ok) throw new Error('Anthropic '+r.status+': '+aiErrSnippet(await r.text().catch(()=>'')));
    const j=await r.json(); return (j.content&&j.content.map(b=>b.text||'').join(''))||'';
  }
  async function aiCallGemini(model,key,prompt,system,imgs){
    const parts=[{text:prompt}];
    imgs.forEach(d=>{ const ip=aiImgPart(d); if(ip) parts.push({inline_data:{mime_type:ip.mime,data:ip.b64}}); });
    const body={contents:[{role:'user',parts}],generationConfig:{temperature:0.3,maxOutputTokens:1600}};
    if(system) body.systemInstruction={parts:[{text:system}]};
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('Gemini '+r.status+': '+aiErrSnippet(await r.text().catch(()=>'')));
    const j=await r.json(); const c=j.candidates&&j.candidates[0];
    if(c&&c.finishReason==='SAFETY') throw new Error('Gemini: blocked by safety filter');
    return (c&&c.content&&c.content.parts&&c.content.parts.map(p=>p.text||'').join(''))||'';
  }
  /* Chrome Built-in AI (global LanguageModel / window.ai). The API shape has shifted
     across Chrome versions, so probe several. No image support (Gemini Nano = text). */
  async function aiCallChrome(prompt,system){
    try{
      if(typeof self!=='undefined' && self.LanguageModel && self.LanguageModel.create){
        const s=await self.LanguageModel.create(system?{initialPrompts:[{role:'system',content:system}]}:{});
        const out=await s.prompt(prompt); try{ s.destroy&&s.destroy(); }catch(_){} return out;
      }
      if(window.ai){
        const lm=window.ai.languageModel||window.ai.assistant;
        if(lm&&lm.create){ const s=await lm.create(system?{systemPrompt:system}:{}); const out=await s.prompt(prompt); try{ s.destroy&&s.destroy(); }catch(_){} return out; }
        if(window.ai.createTextSession){ const s=await window.ai.createTextSession(); const out=await s.prompt((system?system+'\n\n':'')+prompt); try{ s.destroy&&s.destroy(); }catch(_){} return out; }
      }
    }catch(e){ throw new Error('Chrome AI: '+((e&&e.message)||e)); }
    throw new Error(t('aiChromeUnavail'));
  }

  /* ---- Shared UI: toast + report popup (used by all four features) ---- */
  function aiToast(msg){
    let el=document.getElementById('ai-toast');
    if(!el){ el=document.createElement('div'); el.id='ai-toast'; el.className='sat-toast'; document.body.appendChild(el); }
    el.textContent=msg; el.classList.add('show');
    clearTimeout(aiToast._t); aiToast._t=setTimeout(()=>el.classList.remove('show'),4600);
  }
  function aiEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  /* Generic report popup. opts:{title, sub, images:[{src,caption}]}. Returns an api
     with setLoading()/setBody(text)/setError(msg,onRetry)/close(). */
  function aiReport(opts){
    opts=opts||{};
    let ov=document.getElementById('ai-report-modal');
    if(!ov){ ov=document.createElement('div'); ov.id='ai-report-modal'; ov.className='modal-overlay'; document.body.appendChild(ov);
      ov.addEventListener('click',e=>{ if(e.target===ov) ov.style.display='none'; }); }
    const imgsHtml=(opts.images&&opts.images.length)?`<div class="ai-report-imgs">${opts.images.map(im=>`<figure><img src="${aiEsc(im.src)}">${im.caption?`<figcaption>${aiEsc(im.caption)}</figcaption>`:''}</figure>`).join('')}</div>`:'';
    ov.innerHTML=`<div class="modal-content">
      <div class="ai-report-head">✨ <span>${aiEsc(opts.title||'AI')}</span></div>
      ${opts.sub?`<div class="ai-report-sub">${aiEsc(opts.sub)}</div>`:''}
      ${imgsHtml}
      <div class="ai-report-body loading" id="ai-report-body"><span class="ai-spin"></span><span>${aiEsc(t('aiThinking'))}</span></div>
      <div class="ai-report-actions" id="ai-report-actions"></div>
    </div>`;
    ov.style.display='flex';
    const bodyEl=ov.querySelector('#ai-report-body'), actEl=ov.querySelector('#ai-report-actions');
    const api={
      el:ov,
      close(){ ov.style.display='none'; },
      setLoading(msg){ bodyEl.className='ai-report-body loading'; bodyEl.innerHTML=`<span class="ai-spin"></span><span>${aiEsc(msg||t('aiThinking'))}</span>`; actEl.innerHTML=''; },
      setBody(text){ bodyEl.className='ai-report-body'; bodyEl.textContent=String(text||'');
        actEl.innerHTML=`<button id="ai-rep-copy">${aiEsc(t('aiCopy'))}</button><button class="primary" id="ai-rep-close">${aiEsc(t('aiClose'))}</button>`;
        actEl.querySelector('#ai-rep-close').onclick=api.close;
        actEl.querySelector('#ai-rep-copy').onclick=ev=>{ try{ navigator.clipboard.writeText(String(text||'')); ev.target.textContent=t('aiCopied'); }catch(_){} };
      },
      setError(msg,onRetry){ bodyEl.className='ai-report-body'; bodyEl.innerHTML=`<span style="color:#ff453a">⚠ ${aiEsc(t('aiError'))}</span><br><span style="font-size:12px;color:var(--text-muted)">${aiEsc(msg||'')}</span>`;
        actEl.innerHTML=(onRetry?`<button id="ai-rep-retry">${aiEsc(t('aiRetry'))}</button>`:'')+`<button class="primary" id="ai-rep-close">${aiEsc(t('aiClose'))}</button>`;
        actEl.querySelector('#ai-rep-close').onclick=api.close;
        const rb=actEl.querySelector('#ai-rep-retry'); if(rb) rb.onclick=()=>{ api.setLoading(); onRetry(); };
      }
    };
    return api;
  }

  /* ---- Settings modal: AI section (provider + model + key + connection test) ---- */
  function aiRenderSettings(){
    const wrap=document.getElementById('ai-settings-body'); if(!wrap) return;
    const p=aiProviderById(aiConfig.provider);
    const provOpts=AI_PROVIDERS.map(pr=>`<option value="${pr.id}"${pr.id===p.id?' selected':''}>${pr.name[currentLang]||pr.name.en}</option>`).join('');
    const hasKey=!!aiKeyFor(p);
    const keyBlock = p.needsKey
      ? `<div class="ai-row"><div class="ai-key-top"><span class="ai-key-name">${t('aiApiKey')}</span><span class="ai-status ${hasKey?'on':''}">${hasKey?'● '+t('aiKeyConnected'):'○ '+t('aiKeyNone')}</span></div>
          <input type="password" class="sat-key-input" id="ai-key-input" value="${aiEsc(aiKeyFor(p))}" placeholder="${aiEsc(p.keyPh||'')}" autocomplete="off" autocapitalize="off" spellcheck="false">
          <a href="${p.getKey}" target="_blank" rel="noopener" style="font-size:10.5px;color:var(--primary-color);text-decoration:none;display:inline-block;margin-top:5px;">${t('aiGetKey')}</a></div>`
      : `<div class="ai-row" style="font-size:11.5px;color:var(--text-muted);line-height:1.45;">${t('aiOnDevice')} <a href="${p.getKey}" target="_blank" rel="noopener" style="color:var(--primary-color);text-decoration:none;">${t('aiGetKey')}</a></div>`;
    const modelLabel = currentLang==='jp' ? 'モデル（プロバイダから自動取得）' : 'Model (loaded live from provider)';
    const modelHint  = hasKey ? (currentLang==='jp'?'読み込み中…':'Loading…') : (currentLang==='jp'?'先にAPIキーを入力してください':'Enter your API key first');
    const modelBlock = p.onDevice ? ''
      : `<div class="ai-row"><label style="font-size:12px;margin-bottom:6px;display:block;color:var(--text-muted);">${modelLabel}</label>
          <div id="ai-model-wrap"><select id="ai-model" disabled><option>${modelHint}</option></select></div></div>`;
    wrap.innerHTML=
      `<div class="ai-row"><label style="font-size:12px;margin-bottom:6px;display:block;color:var(--text-muted);">${t('aiProvider')}</label><select id="ai-provider">${provOpts}</select></div>`+
      keyBlock+
      modelBlock+
      `<button class="ai-test-btn" id="ai-test-btn">${t('aiTest')}</button><div class="ai-test-msg" id="ai-test-msg"></div>`;
    wrap.querySelector('#ai-provider').onchange=ev=>{ aiReadKeyInput(); aiConfig.provider=ev.target.value; saveAIConfig(); aiRenderSettings(); };
    const ki=wrap.querySelector('#ai-key-input'); if(ki) ki.addEventListener('change',()=>{ aiReadKeyInput(); saveAIConfig(); aiLoadModelsIntoSelect(); });
    wrap.querySelector('#ai-test-btn').onclick=aiTestConnection;
    if(!p.onDevice) aiLoadModelsIntoSelect();   /* fetch the live model list now */
  }
  /* Populate the model dropdown from the provider's live list; never blocks the user. */
  async function aiLoadModelsIntoSelect(){
    const p=aiProviderById(aiConfig.provider); if(p.onDevice) return;
    const wrap=document.getElementById('ai-model-wrap'); if(!wrap) return;
    const key=aiKeyFor(p);
    if(p.needsKey && !key){ wrap.innerHTML=`<select id="ai-model" disabled><option>${currentLang==='jp'?'先にAPIキーを入力してください':'Enter your API key first'}</option></select>`; return; }
    wrap.innerHTML=`<select id="ai-model" disabled><option>${currentLang==='jp'?'読み込み中…':'Loading…'}</option></select>`;
    const list=await aiListModels(p,key);
    if(!list||!list.length){
      /* Live list unavailable (offline/CORS): fall back to a free-text box so nothing is blocked. */
      wrap.innerHTML=`<input type="text" class="sat-key-input" id="ai-model" value="${aiEsc((aiConfig.models&&aiConfig.models[p.id])||'')}" placeholder="${aiEsc(p.fallbackModel||'')}">
        <div style="font-size:10.5px;color:var(--text-muted);margin-top:5px;">${currentLang==='jp'?'モデル一覧を取得できませんでした。必要ならモデル名を直接入力できます。':'Could not load the model list — type a model name if needed.'}</div>`;
      const mi=document.getElementById('ai-model'); if(mi) mi.onchange=()=>aiReadModelInput();
      return;
    }
    if(!aiConfig.models) aiConfig.models={};
    let cur=aiConfig.models[p.id];
    if(!cur || !list.includes(cur)){ cur=aiPickDefaultModel(p,list); aiConfig.models[p.id]=cur; saveAIConfig(); }
    wrap.innerHTML=`<select id="ai-model">${list.map(id=>`<option value="${aiEsc(id)}"${id===cur?' selected':''}>${aiEsc(id)}</option>`).join('')}</select>`;
    const s=document.getElementById('ai-model'); if(s) s.onchange=()=>{ aiConfig.models[p.id]=s.value; saveAIConfig(); try{ aiSyncFeatureButtons(); }catch(_){} };
    try{ aiSyncFeatureButtons(); }catch(_){}
  }
  function aiReadKeyInput(){ const ki=document.getElementById('ai-key-input'); if(!ki) return; const p=aiProviderById(aiConfig.provider); const v=ki.value.trim(); if(v) aiConfig.keys[p.id]=v; else delete aiConfig.keys[p.id]; }
  function aiReadModelInput(){ const mi=document.getElementById('ai-model'); if(!mi) return; const p=aiProviderById(aiConfig.provider); if(!aiConfig.models) aiConfig.models={}; const v=mi.value.trim(); if(v) aiConfig.models[p.id]=v; else delete aiConfig.models[p.id]; }
  function aiSaveSettings(){
    const pv=document.getElementById('ai-provider'); if(pv) aiConfig.provider=pv.value;

  async function aiTestConnection(){

    aiReadModelInput(); aiReadKeyInput();

  /* Each AI feature registers a syncer here; called after the AI config changes so

  const aiButtonSyncers=[];
  function aiSyncFeatureButtons(){ aiButtonSyncers.forEach(fn=>{ try{ fn(); }catch(_){} }); }
  /* Toggle a busy spinner + disabled state on an .ai-action-btn (shared by all features). */
  function aiSetBtnBusy(btn,busy,label){
    if(!btn) return;
    if(busy){ if(!btn.dataset.olabel) btn.dataset.olabel=btn.textContent; btn.disabled=true; btn.innerHTML='<span class="ai-spin"></span><span>'+aiEsc(label||btn.dataset.olabel)+'</span>'; }

  /* ===== AI FEATURE 4: satellite change detection (vision) =====
     Capture the map canvas at two dates and ask a vision model to compare them. Requires
     preserveDrawingBuffer:true on the map (set in the map config) + a vision-capable model. */
  function aiSatChangeBlockHTML(p){
    if(!p||!p.dated) return '';
    const today=satMaxDay(); let inputs;
    if(p.dateMode==='year'){
      const yo=v=>(p.years||[]).map(y=>`<option value="${y}"${y===v?' selected':''}>${y}</option>`).join('');
      inputs=`<select id="aic-date-a">${yo((p.years||[])[0])}</select><span>→</span><select id="aic-date-b">${yo((p.years||[])[(p.years||[]).length-1])}</select>`;
    } else {
      const dA=new Date(Date.now()-33*864e5).toISOString().slice(0,10);
      inputs=`<input type="date" id="aic-date-a" value="${dA}" max="${today}"><span>→</span><input type="date" id="aic-date-b" value="${satState.day}" max="${today}">`;
    }
    return `<div class="aic-sec"><div class="aic-head">🛰 ${t('aiVisHead')}</div><div class="aic-dates">${inputs}</div><button class="ai-action-btn" id="ai-satchange-btn">✨ ${t('aiVisBtn')}</button></div>`;
  }
  function aiDownscaleDataURL(canvas,maxDim){
    try{ const w=canvas.width,h=canvas.height,s=Math.min(1,(maxDim||1024)/Math.max(w,h));

  function buildGeoFC(data){
    const feats=[];
    (data.areas||[]).forEach(a=>{
      const ring=a.ring.slice(); const f=ring[0], l=ring[ring.length-1];
      if(f[0]!==l[0]||f[1]!==l[1]) ring.push(f);
      feats.push({type:'Feature',geometry:{type:'Polygon',coordinates:[ring]},properties:{}});
      if(a.label){ let sx=0,sy=0; a.ring.forEach(p=>{sx+=p[0];sy+=p[1];}); feats.push({type:'Feature',geometry:{type:'Point',coordinates:[sx/a.ring.length,sy/a.ring.length]},properties:{label:a.label}}); }
    });
    (data.lines||[]).forEach(ln=>{
      feats.push({type:'Feature',geometry:{type:'LineString',coordinates:ln.path},properties:{}});
      if(ln.label){ const m=ln.path[Math.floor(ln.path.length/2)]; feats.push({type:'Feature',geometry:{type:'Point',coordinates:m},properties:{label:ln.label}}); }
    });
    (data.points||[]).forEach(pt=>{
      feats.push({type:'Feature',geometry:{type:'Point',coordinates:pt.at},properties:{label:pt.label,marker:1}});
    });
    return {type:'FeatureCollection',features:feats};
  }
  function ensureGeoLayers(){
    if(!map) return;
    /* Style may not be ready yet (e.g. right after setProjection on load). Retry until it is. */
    if(!map.isStyleLoaded()){ clearTimeout(ensureGeoLayers._t); ensureGeoLayers._t=setTimeout(ensureGeoLayers,160); return; }
    for(const[key,data] of Object.entries(geoLayersDB)){
      if(map.getSource(key)) continue;
      try{ map.addSource(key,{type:'geojson',data:buildGeoFC(data)}); }catch(e){ continue; }
      try{
        if(data.areas&&data.areas.length){
          map.addLayer({id:key+'-fill',type:'fill',source:key,filter:['==','$type','Polygon'],layout:{visibility:'none'},paint:{'fill-color':data.color,'fill-opacity':0.22}});
          /* soft, fuzzy zone edge — no hard outline (zones are conceptual, not borders) */
          map.addLayer({id:key+'-edge',type:'line',source:key,filter:['==','$type','Polygon'],layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':data.color,'line-width':16,'line-opacity':0.18,'line-blur':8}});
        }
        map.addLayer({id:key+'-glow',type:'line',source:key,filter:['==','$type','LineString'],layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':data.color,'line-width':10,'line-opacity':0.18,'line-blur':4}});
        map.addLayer({id:key+'-line',type:'line',source:key,filter:['==','$type','LineString'],layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':data.color,'line-width':3.5,'line-opacity':0.95}});
        map.addLayer({id:key+'-pt',type:'circle',source:key,filter:['==','marker',1],layout:{visibility:'none'},paint:{'circle-radius':5,'circle-color':data.color,'circle-stroke-color':'#fff','circle-stroke-width':2,'circle-opacity':0.95}});
        map.addLayer({id:key+'-label',type:'symbol',source:key,filter:['has','label'],layout:{visibility:'none','text-field':['get','label'],'text-size':12,'text-font':['literal',['Open Sans Regular']],'text-offset':[0,1.1],'text-anchor':'top','text-allow-overlap':false,'symbol-placement':'point'},paint:{'text-color':data.color,'text-halo-color':'rgba(255,255,255,0.95)','text-halo-width':1.8}});
      }catch(e){ console.warn('geoLayer add fail',key,e); }
    }
    updateGeoLayers();
  }
  function updateGeoLayers(){
    if(!map||!map.isStyleLoaded())return;
    const isDark=document.documentElement.getAttribute('data-theme')==='dark';
    for(const key of Object.keys(geoLayersDB)){
      const cb=document.querySelector(`input[data-layer="${key}"]`);
      const vis=((cb&&cb.checked)||forceHoverLayers.has(key))?'visible':'none';
      ['-fill','-edge','-glow','-line','-pt','-label'].forEach(s=>{ if(map.getLayer(key+s)) map.setLayoutProperty(key+s,'visibility',vis); });
      if(map.getLayer(key+'-label')) map.setPaintProperty(key+'-label','text-halo-color',isDark?'rgba(0,0,0,0.85)':'rgba(255,255,255,0.95)');
    }
  }
  window.triggerLayerHover=function(k,h){ if(!k)return; if(h)forceHoverLayers.add(k); else forceHoverLayers.delete(k); updateGeoLayers(); };

  function resolveCountryId(feat){
    const p=(feat&&feat.properties)||{};
    /* Only accept a candidate that actually exists in countryStats. MapLibre may
       auto-assign a NUMERIC feature id (our GeoJSON used non-numeric string ids),
       so the old code returned feat.id like "12" → countryStats miss → all N/A. */
    const cands=[feat&&feat.id, p.ISO_A3_EH, p.ISO_A3, p.ADM0_A3, p.SOV_A3, p.ADM0_A3_US, p.ADM0_ISO];
    for(const c of cands){ if(c!=null && c!=='' && c!=='-99' && countryStats[String(c)]) return String(c); }

    const nm=(p.NAME_EN||p.ADMIN||p.NAME||'').toLowerCase();

  async function enrichCountry(id){
    if(!id) return null;

    if(!s) return null;
    if(s._enrichedTried) return s;
    s._enrichedTried=true;
    try{
      const r=await fetch(`https://restcountries.com/v3.1/alpha/${encodeURIComponent(id)}?fields=name,capital,languages,currencies,population,area,region,subregion,flag,latlng,timezones,car,callingCodes,demonyms,borders,independent,unMember`);

      if(!s.capital && c.capital && c.capital.length) s.capital=c.capital[0];
      if(!s.languages && c.languages) s.languages=Object.values(c.languages).join(', ');
      if(!s.currency && c.currencies){ const cur=Object.entries(c.currencies)[0]; if(cur) s.currency=`${cur[0]}${cur[1]&&cur[1].name?' ('+cur[1].name+')':''}`; }
      if(!s.pop && c.population) s.pop=c.population;
      if((!s.area||s.area<1) && c.area) s.area=c.area;
      if(!s.density && s.pop && s.area) s.density=s.pop/s.area;
      if(!s.region && c.region) s.region=c.region;
      if(!s.subregion && c.subregion) s.subregion=c.subregion;
      if((!s.flag||s.flag==='🏳️') && c.flag) s.flag=c.flag;
      if(!s.latlng && c.latlng && c.latlng.length===2) s.latlng=c.latlng;
      if(c.timezones) s.timezones=c.timezones;
      if(c.borders) s.borders=c.borders;
      if(c.independent!=null) s.independent=c.independent;
      if(c.unMember!=null) s.unMember=c.unMember;

  /* ===== Grid (zoom-adaptive, red equator) ===== */
  function gridStepForZoom(z){
    if(z<1.5) return {major:30,minor:10};
    if(z<3)   return {major:15,minor:5};
    if(z<5)   return {major:10,minor:2};
    if(z<7)   return {major:5, minor:1};
    if(z<9)   return {major:2, minor:0.5};
    if(z<11)  return {major:1, minor:0.25};
    if(z<13)  return {major:0.5,minor:0.1};
    return    {major:0.1,minor:0.025};
  }
  function buildGridFeatures(){
    if(!hasTurf()) return [];
    const z=map?map.getZoom():2;
    const {major,minor}=gridStepForZoom(z);
    const b=map?map.getBounds():null;
    let minLng=-180,maxLng=180,minLat=-80,maxLat=80;
    if(b){
      const pad=Math.max(major*2,2);
      minLng=Math.max(-180,Math.floor(b.getWest()/major)*major-pad);
      maxLng=Math.min(180, Math.ceil(b.getEast()/major)*major+pad);
      minLat=Math.max(-85, Math.floor(b.getSouth()/major)*major-pad);
      maxLat=Math.min(85,  Math.ceil(b.getNorth()/major)*major+pad);
    }
    const f=[];
    /* Minor lines */
    for(let lng=Math.ceil(minLng/minor)*minor; lng<=maxLng; lng+=minor){
      if(Math.abs(lng%major)<1e-6) continue;
      const pts=[]; const step=Math.max(minor/2,0.5);
      for(let la=minLat; la<=maxLat; la+=step) pts.push([lng,la]);
      if(pts.length>1) f.push({type:'Feature',geometry:{type:'LineString',coordinates:pts},properties:{kind:'minor'}});
    }
    for(let lat=Math.ceil(minLat/minor)*minor; lat<=maxLat; lat+=minor){
      if(Math.abs(lat%major)<1e-6 || Math.abs(lat)<1e-6) continue;
      const pts=[]; const step=Math.max(minor/2,0.5);
      for(let lo=minLng; lo<=maxLng; lo+=step) pts.push([lo,lat]);
      if(pts.length>1) f.push({type:'Feature',geometry:{type:'LineString',coordinates:pts},properties:{kind:'minor'}});
    }
    /* Major lines */
    for(let lng=Math.ceil(minLng/major)*major; lng<=maxLng; lng+=major){
      const pts=[]; const step=Math.max(major/4,0.5);
      for(let la=minLat; la<=maxLat; la+=step) pts.push([lng,la]);
      if(pts.length>1) f.push({type:'Feature',geometry:{type:'LineString',coordinates:pts},properties:{kind:'major'}});
    }
    for(let lat=Math.ceil(minLat/major)*major; lat<=maxLat; lat+=major){
      if(Math.abs(lat)<1e-6) continue; /* equator drawn separately in red */
      const pts=[]; const step=Math.max(major/4,0.5);
      for(let lo=minLng; lo<=maxLng; lo+=step) pts.push([lo,lat]);
      if(pts.length>1) f.push({type:'Feature',geometry:{type:'LineString',coordinates:pts},properties:{kind:'major'}});
    }
    /* Red equator */
    if(minLat<=0 && maxLat>=0){
      const pts=[]; const step=Math.max(major/4,1);
      for(let lo=minLng; lo<=maxLng; lo+=step) pts.push([lo,0]);
      if(pts.length>1) f.push({type:'Feature',geometry:{type:'LineString',coordinates:pts},properties:{kind:'equator'}});
    }
    /* Prime meridian */
    if(minLng<=0 && maxLng>=0){
      const pts=[]; const step=Math.max(major/4,1);
      for(let la=minLat; la<=maxLat; la+=step) pts.push([0,la]);
      if(pts.length>1) f.push({type:'Feature',geometry:{type:'LineString',coordinates:pts},properties:{kind:'prime'}});
    }
    /* Edge labels (along axes) */
    const labelStep=major;
    const c=map?map.getCenter():{lng:0,lat:0};
    const baseLng=Math.max(minLng+major*0.5,Math.min(maxLng-major*0.5,c.lng));
    const baseLat=Math.max(minLat+major*0.5,Math.min(maxLat-major*0.5,c.lat));
    for(let lat=Math.ceil(minLat/labelStep)*labelStep; lat<=maxLat; lat+=labelStep){
      if(Math.abs(lat)>85) continue;
      f.push({type:'Feature',geometry:{type:'Point',coordinates:[baseLng,lat]},properties:{label:degLabel(+lat.toFixed(3),'lat')}});
    }
    for(let lng=Math.ceil(minLng/labelStep)*labelStep; lng<=maxLng; lng+=labelStep){
      f.push({type:'Feature',geometry:{type:'Point',coordinates:[lng,baseLat]},properties:{label:degLabel(+lng.toFixed(3),'lng')}});
    }
    /* Intersection labels at major grid crossings — sparse so they don't clutter */
    const crossStep=major*2;
    for(let lat=Math.ceil(minLat/crossStep)*crossStep; lat<=maxLat; lat+=crossStep){
      if(Math.abs(lat)>80) continue;
      for(let lng=Math.ceil(minLng/crossStep)*crossStep; lng<=maxLng; lng+=crossStep){
        if(Math.abs(lat)<1e-6 && Math.abs(lng)<1e-6) continue;
        f.push({type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{kind:'cross',label:`${degLabel(+lat.toFixed(3),'lat')} ${degLabel(+lng.toFixed(3),'lng')}`}});
      }
    }
    return f;
  }

  /* ===== Units & measurement =====
   * Auto-scale: metric flips km→m below 1 km; imperial flips mi→ft (yd for mid range) below 0.19 mi.
   */
  function fmtMetricDist(km){
    if(km<1){
      const m=km*1000;
      return (m<10?m.toFixed(1):Math.round(m))+' m';
    }
    return (km<10?km.toFixed(2):km<100?km.toFixed(1):Math.round(km).toLocaleString())+' km';
  }
  function fmtImperialDist(km){
    const mi=km*KM2MI;
    if(mi<0.0095){ /* less than 50 ft → show ft */
      const ft=mi*5280;
      return (ft<10?ft.toFixed(1):Math.round(ft))+' ft';
    }
    if(mi<0.19){ /* up to ~1000 ft → show yards */
      const yd=mi*1760;
      return Math.round(yd).toLocaleString()+' yd';
    }
    return (mi<10?mi.toFixed(2):mi<100?mi.toFixed(1):Math.round(mi).toLocaleString())+' mi';
  }
  const uDist=(km)=>({m:fmtMetricDist(km), i:fmtImperialDist(km)});
  function fmtMetricArea(k){
    if(k<0.01){ /* < 10,000 m² → m² */
      const m2=k*1e6;
      return Math.round(m2).toLocaleString()+' m²';
    }
    if(k<1){ /* hectares range */
      return (k*100).toFixed(2)+' ha';
    }
    return Math.round(k).toLocaleString()+' km²';
  }
  function fmtImperialArea(k){
    const mi2=k*0.386102;
    if(mi2<0.0004){ /* < ~10,000 ft² */
      const ft2=k*10763910;
      return Math.round(ft2).toLocaleString()+' ft²';
    }
    if(mi2<1){
      const ac=mi2*640;
      return ac.toFixed(2)+' ac';
    }
    return Math.round(mi2).toLocaleString()+' mi²';
  }
  const uArea=(k)=>({m:fmtMetricArea(k), i:fmtImperialArea(k)});
  function distHTML(km){ const u=uDist(km); return unitMode==='metric'?u.m:unitMode==='imperial'?u.i:`${u.m} <span class="unit-sub">(${u.i})</span>`; }
  function distTXT(km){ const u=uDist(km); return unitMode==='metric'?u.m:unitMode==='imperial'?u.i:`${u.m} (${u.i})`; }
  function areaHTML(k){ const u=uArea(k); return unitMode==='metric'?u.m:unitMode==='imperial'?u.i:`${u.m} <span class="unit-sub">(${u.i})</span>`; }

  function bearingHTML(a,b){ const d=bearingDeg(a,b); return `${d.toFixed(1)}° <span class="unit-sub">(${compassDir(d)})</span>`; }

  function buildToolFeatures(){

    const f=[];

    });

    if(toolMode==='measure'){
      const all=measurePoints;
      for(let i=1;i<all.length;i++){
        try{ f.push(turf.greatCircle(turf.point(all[i-1]),turf.point(all[i]),{npoints:64})); }
        catch(e){ f.push(turf.lineString([all[i-1],all[i]])); }
      }
      measurePoints.forEach(p=>f.push(turf.point(p)));
      /* Dashed preview from the last fixed point to the live cursor */
      if(liveCursor && measurePoints.length>=1){
        const last=measurePoints[measurePoints.length-1];
        try{ const gc=turf.greatCircle(turf.point(last),turf.point(liveCursor),{npoints:32}); gc.properties={...(gc.properties||{}),preview:true}; f.push(gc); }
        catch(e){ f.push({type:'Feature',geometry:{type:'LineString',coordinates:[last,liveCursor]},properties:{preview:true}}); }
      }
    } else if(toolMode==='area'){
      if(measurePoints.length>=3){
        /* Great-circle polygon: subdivide each edge along the great-circle path */
        const ring=[];
        const closed=[...measurePoints,measurePoints[0]];
        for(let i=0;i<closed.length-1;i++){
          try{
            const gc=turf.greatCircle(turf.point(closed[i]),turf.point(closed[i+1]),{npoints:48});
            const cs=gc.geometry.coordinates;
            if(gc.geometry.type==='MultiLineString'){ cs.forEach(seg=>seg.forEach(p=>ring.push(p))); }
            else cs.forEach(p=>ring.push(p));
          }catch(e){ ring.push(closed[i]); ring.push(closed[i+1]); }
        }
        if(ring.length>=4){
          const first=ring[0], last=ring[ring.length-1];
          if(first[0]!==last[0]||first[1]!==last[1]) ring.push(first);
          try{ f.push(turf.polygon([ring],{color:'#007aff',opacity:0.18})); }
          catch(e){ f.push(turf.polygon([[...measurePoints,measurePoints[0]]],{color:'#007aff',opacity:0.18})); }
        }
      } else if(measurePoints.length>=2){
        try{
          const gc=turf.greatCircle(turf.point(measurePoints[0]),turf.point(measurePoints[1]),{npoints:48});
          f.push(gc);
        }catch(e){ f.push(turf.lineString(measurePoints)); }
      }
      measurePoints.forEach(p=>f.push(turf.point(p)));
      /* Dashed preview while drawing area: great-circle line to cursor + closing arc */
      if(liveCursor && measurePoints.length>=1){
        const last=measurePoints[measurePoints.length-1];
        try{ const gc=turf.greatCircle(turf.point(last),turf.point(liveCursor),{npoints:32}); gc.properties={...(gc.properties||{}),preview:true}; f.push(gc); }
        catch(e){ f.push({type:'Feature',geometry:{type:'LineString',coordinates:[last,liveCursor]},properties:{preview:true}}); }
        if(measurePoints.length>=2){
          try{ const gc=turf.greatCircle(turf.point(liveCursor),turf.point(measurePoints[0]),{npoints:32}); gc.properties={...(gc.properties||{}),preview:true}; f.push(gc); }
          catch(e){ f.push({type:'Feature',geometry:{type:'LineString',coordinates:[liveCursor,measurePoints[0]]},properties:{preview:true}}); }
        }
      }
    }
    return f;
  }

  function totalDistance(p){ let s=0; for(let i=1;i<p.length;i++)s+=turf.distance(turf.point(p[i-1]),turf.point(p[i]),{units:'kilometers'}); return s; }
  function ringPerimeter(p){ if(p.length<2)return 0; let s=totalDistance(p); if(p.length>=3)s+=turf.distance(turf.point(p[p.length-1]),turf.point(p[0]),{units:'kilometers'}); return s; }
  function ringArea(p){
    if(p.length<3)return 0;
    try{
      /* Great-circle-subdivided ring for accurate spherical area on a globe */
      const ring=[];
      const closed=[...p,p[0]];
      for(let i=0;i<closed.length-1;i++){
        try{
          const gc=turf.greatCircle(turf.point(closed[i]),turf.point(closed[i+1]),{npoints:48});
          const cs=gc.geometry.coordinates;
          if(gc.geometry.type==='MultiLineString'){ cs.forEach(seg=>seg.forEach(pt=>ring.push(pt))); }
          else cs.forEach(pt=>ring.push(pt));
        }catch(e){ ring.push(closed[i]); ring.push(closed[i+1]); }
      }
      if(ring.length<4) return turf.area(turf.polygon([[...p,p[0]]]))/1e6;
      const first=ring[0], last=ring[ring.length-1];
      if(first[0]!==last[0]||first[1]!==last[1]) ring.push(first);
      return turf.area(turf.polygon([ring]))/1e6;
    }catch(e){return 0;}
  }

  /* ===== AI FEATURE 3: spatial news summarization (radius / area) =====
     Collect the news pins whose coordinates fall inside the drawn circle(s) or polygon,
     then ask the LLM for a ~3-line geopolitical read on the region. */
  async function aiSummarizeArea(){
    if(!aiReady()){ aiToast(t('aiNoKey')); return; }
    if(!hasTurf()){ aiToast('Turf.js unavailable'); return; }
    let inside=null;
    if(toolMode==='radius'){
      if(!radiusItems.length){ aiToast(t('aiSumNoArea')); return; }
      inside=(lng,lat)=>radiusItems.some(c=>{ try{ return turf.distance(turf.point(c.center),turf.point([lng,lat]),{units:'kilometers'})<=c.radiusKm; }catch(_){ return false; } });
    } else if(toolMode==='area'){
      if(measurePoints.length<3){ aiToast(t('aiSumNoArea')); return; }
      let poly; try{ poly=turf.polygon([[...measurePoints,measurePoints[0]]]); }catch(_){ aiToast(t('aiSumNoArea')); return; }
      inside=(lng,lat)=>{ try{ return turf.booleanPointInPolygon(turf.point([lng,lat]),poly); }catch(_){ return false; } };
    } else { return; }
    const seen=new Set(), picked=[];
    newsFeatures.forEach(f=>{ const c=f.geometry&&f.geometry.coordinates, p=f.properties||{}; if(!c||!inside(c[0],c[1])) return; const k=p.link||p.title; if(seen.has(k)) return; seen.add(k); picked.push(p); });
    const uniq=picked.slice(0,40);
    if(!uniq.length){ aiToast(t('aiSumNoNews')); return; }
    _aiAreaSummarize(uniq,'aiSumTitle');
  }
  /* Shared report+run used by BOTH the drawn-area summary and the live-view summary. */
  function _aiAreaSummarize(uniq, titleKey){
    const rep=aiReport({ title:t(titleKey), sub:t('aiSumSub').replace('{n}',uniq.length) });
    const run=async()=>{
      rep.setLoading(t('aiThinking'));
      try{
        const lines=uniq.map((p,i)=>`${i+1}. [${p.name||'?'}] ${p.title||''}${p.publisher?' ('+p.publisher+')':''}`).join('\n');

  /* === Instant elevation/depth from cached terrarium DEM tiles (includes ocean bathymetry) === */
  const _demCache=new Map();
  function _ll2tile(lng,lat,z){ const n=Math.pow(2,z); const x=(lng+180)/360*n; const lr=lat*Math.PI/180; const y=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n; return {x,y,n}; }
  function demElevAt(lng,lat,onReady){
    const z=10; const tl=_ll2tile(lng,lat,z); const xi=Math.floor(tl.x), yi=Math.floor(tl.y);
    if(xi<0||yi<0||xi>=tl.n||yi>=tl.n||lat>85||lat<-85) return null;
    const key=z+'/'+xi+'/'+yi; let c=_demCache.get(key);
    if(c===undefined){
      _demCache.set(key,'loading');
      const img=new Image(); img.crossOrigin='anonymous';
      img.onload=()=>{ try{ const cv=document.createElement('canvas'); cv.width=256; cv.height=256; cv.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0); _demCache.set(key,cv); if(onReady) onReady(); }catch(e){ _demCache.set(key,null); } };
      img.onerror=()=>_demCache.set(key,null);
      img.src=`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${xi}/${yi}.png`;
      return null;
    }
    if(c==='loading'||c===null) return null;
    const px=Math.min(255,Math.max(0,Math.floor((tl.x-xi)*256))), py=Math.min(255,Math.max(0,Math.floor((tl.y-yi)*256)));
    try{ const d=c.getContext('2d',{willReadFrequently:true}).getImageData(px,py,1,1).data; return (d[0]*256+d[1]+d[2]/256)-32768; }catch(e){ return null; }
