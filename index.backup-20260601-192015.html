  /* =====================================================================
   *  iOS-native mobile UI controller — built from scratch.
   *  Only active at <=768px; desktop layout is left completely untouched.
   *  Owns: the draggable bottom sheet, the round control FABs + their
   *  slide-up option sheets, the place-search FAB, and the auto compass.
   * ===================================================================== */
  function initMobileUI(){
    const mq=window.matchMedia('(max-width:768px)');
    const sidebar=document.getElementById('sidebar');
    const mapContainer=document.getElementById('map-container');
    if(!sidebar) return;

    /* ---- node relocation (keeps handlers + state across orientation flips) ---- */
    function rememberHome(node){ if(node && !node.__home && node.parentNode){ const ph=document.createComment('home'); node.parentNode.insertBefore(ph,node); node.__home=ph; } }
    function moveTo(node,target){ if(node && target){ rememberHome(node); target.appendChild(node); } }
    function restoreHome(node){ if(node && node.__home && node.__home.parentNode){ node.__home.parentNode.insertBefore(node,node.__home); } }
    const layerDropdown=document.getElementById('layer-dropdown');
    const satController=document.getElementById('sat-controller');
    const moMountLayers=document.getElementById('mo-mount-layers');
    const moMountSat=document.getElementById('mo-mount-sat');

    /* ---- option sheets (Map / Tools) ---- */
    const scrim=document.getElementById('m-scrim');
    const moSheet=document.getElementById('mo-sheet');
    const toolsSheet=document.getElementById('tools-sheet');
    const fabMap=document.getElementById('m-fab-map');
    const fabTools=document.getElementById('m-fab-tools');
    let openSheetEl=null;
    function openSheet(el){ if(!el) return; if(openSheetEl && openSheetEl!==el) openSheetEl.classList.remove('show'); openSheetEl=el; syncControls(); if(scrim) scrim.classList.add('show'); el.classList.add('show'); }
    function closeSheet(){ if(openSheetEl){ openSheetEl.classList.remove('show'); openSheetEl=null; } if(scrim) scrim.classList.remove('show'); }
    if(scrim) scrim.addEventListener('click',closeSheet);
    const moDone=document.getElementById('mo-done'); if(moDone) moDone.addEventListener('click',closeSheet);
    const toolsDone=document.getElementById('tools-done'); if(toolsDone) toolsDone.addEventListener('click',closeSheet);
    if(fabMap) fabMap.addEventListener('click',()=>{ openSheetEl===moSheet?closeSheet():openSheet(moSheet); });
    if(fabTools) fabTools.addEventListener('click',()=>{ openSheetEl===toolsSheet?closeSheet():openSheet(toolsSheet); });

    /* ---- proxy buttons drive the real (hidden) desktop controls ---- */
    function proxy(btn){ const id=btn.getAttribute('data-proxy'); const real=document.getElementById(id); if(!real) return; real.click(); setTimeout(syncControls,0); if(/^btn-tool-/.test(id)) closeSheet(); }
    document.querySelectorAll('#mo-sheet [data-proxy], #tools-sheet [data-proxy]').forEach(b=>b.addEventListener('click',()=>proxy(b)));
    function syncControls(){
      document.querySelectorAll('#mo-sheet [data-proxy], #tools-sheet [data-proxy]').forEach(b=>{
        const real=document.getElementById(b.getAttribute('data-proxy')); if(!real) return;
        if(b.classList.contains('m-seg-btn')){ const txt=(real.textContent||'').trim(); if(txt) b.textContent=txt; }
        else if(b.classList.contains('m-tool-btn')){ const m=(real.textContent||'').trim().match(/^(\S+)\s+([\s\S]+)$/); const lbl=b.querySelector('span:last-child'); if(lbl&&m) lbl.textContent=m[2].trim(); }
        b.classList.toggle('active', real.classList.contains('active')||real.classList.contains('tool-on'));
      });
      if(fabMap) fabMap.classList.toggle('on', currentMapType==='sat');
      if(fabTools) fabTools.classList.toggle('on', !!toolMode || isGridOn);
    }
    ['lang-en','lang-jp'].forEach(id=>{ const b=document.getElementById(id); if(b) b.addEventListener('click',()=>setTimeout(syncControls,40)); });

    /* ---- compass FAB: appears only when the map is rotated/tilted ---- */
    const fabCompass=document.getElementById('m-fab-compass');
    const compassSvg=fabCompass?fabCompass.querySelector('.m-compass-svg'):null;
    if(fabCompass) fabCompass.addEventListener('click',()=>{ const r=document.getElementById('btn-compass'); if(r) r.click(); });
    function updateCompass(){ if(!map||!fabCompass) return; let b=0,p=0; try{ b=map.getBearing()||0; p=map.getPitch()||0; }catch(_){}
      fabCompass.classList.toggle('show', Math.abs(b)>1 || p>1); if(compassSvg) compassSvg.style.transform='rotate('+(-b)+'deg)'; }
    if(map){ try{ map.on('rotate',updateCompass); map.on('pitch',updateCompass); map.on('moveend',updateCompass); }catch(_){} }

    /* ---- swipe down on an option-sheet grip to dismiss it ---- */
    function makeDismiss(sheet){ if(!sheet) return; const grip=sheet.querySelector('.m-sheet-grip'); if(!grip) return; let drag=false,sy=0;
      grip.addEventListener('pointerdown',e=>{ drag=true; sy=e.clientY; sheet.style.transition='none'; try{grip.setPointerCapture(e.pointerId);}catch(_){} });
      grip.addEventListener('pointermove',e=>{ if(!drag) return; sheet.style.transform='translateY('+Math.max(0,e.clientY-sy)+'px)'; });
      const end=e=>{ if(!drag) return; drag=false; sheet.style.transition=''; const dy=((e&&e.clientY)||sy)-sy; sheet.style.transform=''; if(dy>90) closeSheet(); };
      grip.addEventListener('pointerup',end); grip.addEventListener('pointercancel',()=>{ if(drag){ drag=false; sheet.style.transition=''; sheet.style.transform=''; } });
    }
    makeDismiss(moSheet); makeDismiss(toolsSheet);

    /* ---- responsive: relocate config panels in/out of the sheets ---- */
    function applyLayout(isM){
      if(isM){ moveTo(layerDropdown,moMountLayers); moveTo(satController,moMountSat); }
      else{ restoreHome(layerDropdown); restoreHome(satController); closeSheet(); document.body.classList.remove('sheet-full'); }
    }

    /* =================== THE BOTTOM SHEET =================== */
    let currentDetent='half';
    function curTy(){ return parseFloat(getComputedStyle(sidebar).getPropertyValue('--sheet-ty'))||0; }
    function detents(){
      const H=sidebar.offsetHeight||Math.round(window.innerHeight*0.92);
      /* Peek collapses the sheet down to JUST BELOW the News/Information tab row, so everything
         beneath the tabs (pin toggle, filters, the feed) hides away — maximising the map. */
      const tabs=sidebar.querySelector('.control-panel');
      let peek;
      if(tabs && tabs.offsetParent!==null){ peek=tabs.offsetTop+tabs.offsetHeight+10; }
      else { const vis=['live-news-feed','info-dashboard','community-feed','news-reader-pane'].map(id=>document.getElementById(id)).find(e=>e && e.offsetParent!==null); peek=vis?vis.offsetTop:196; }
      peek=Math.min(Math.max(peek,120),Math.round(H*0.62));
      const tyPeek=Math.max(0,H-peek); const tyHalf=Math.min(Math.round(H*0.5),tyPeek);
      return { full:0, half:tyHalf, peek:tyPeek, H:H, peekH:peek };
    }
    function recompute(){ const d=detents(); if(mapContainer) mapContainer.style.setProperty('--peek-h',d.peekH+'px'); return d; }
    function setDetent(name,animate){
      if(animate===undefined) animate=true; const d=recompute(); currentDetent=name;
      const ty=(d[name]!=null)?d[name]:d.half;
      if(!animate) sidebar.classList.add('sheet-dragging');
      sidebar.style.setProperty('--sheet-ty',ty+'px');
      if(!animate){ void sidebar.offsetHeight; sidebar.classList.remove('sheet-dragging'); }
      document.body.classList.toggle('sheet-full', name==='full');
      /* keep the map's optical centre inside the area visible ABOVE the sheet */
      if(map && map.setPadding){ const covered=Math.min(Math.max(0,d.H-ty), Math.round(window.innerHeight*0.82));
        try{ map.setPadding({top:0,left:0,right:0,bottom:covered}, {duration:animate?300:0}); }catch(_){} }
    }
    window.__setDetent=setDetent;

    let dragging=false,startY=0,startTy=0,lastY=0,lastT=0,vel=0,maxTy=0;
    function dragStart(y){ const d=recompute(); maxTy=d.peek; dragging=true; startY=y; startTy=curTy(); lastY=y; lastT=performance.now(); vel=0; sidebar.classList.add('sheet-dragging'); }
    function dragMove(y){ if(!dragging) return; let ty=Math.max(0,Math.min(maxTy,startTy+(y-startY))); sidebar.style.setProperty('--sheet-ty',ty+'px'); const now=performance.now(),dt=now-lastT; if(dt>0) vel=(y-lastY)/dt; lastY=y; lastT=now; }
    function dragEnd(){ if(!dragging) return; dragging=false; sidebar.classList.remove('sheet-dragging'); const d=recompute(); const ty=curTy();
      const order=[{n:'full',v:d.full},{n:'half',v:d.half},{n:'peek',v:d.peek}]; let target;
      if(vel>0.45) target=order.find(o=>o.v>ty+2)||order[order.length-1];
      else if(vel<-0.45){ const rev=order.slice().reverse(); target=rev.find(o=>o.v<ty-2)||order[0]; }
      else target=order.reduce((a,b)=>Math.abs(b.v-ty)<Math.abs(a.v-ty)?b:a);
      setDetent(target.n);
    }
    const grip=sidebar.querySelector('.sheet-grip');
    if(grip){
      grip.addEventListener('pointerdown',e=>{ if(!mq.matches) return; try{grip.setPointerCapture(e.pointerId);}catch(_){} dragStart(e.clientY); });
      grip.addEventListener('pointermove',e=>{ if(dragging) dragMove(e.clientY); });
      grip.addEventListener('pointerup',dragEnd); grip.addEventListener('pointercancel',dragEnd);
    }
    /* drag-to-collapse from the top of the content, only when fully expanded */
    ['live-news-feed','info-dashboard','community-feed','news-reader-pane'].forEach(id=>{
      const sc=document.getElementById(id); if(!sc) return; let active=false,sy=0;
      sc.addEventListener('touchstart',e=>{ if(!mq.matches||currentDetent!=='full'){active=false;return;} sy=e.touches[0].clientY; active=false; },{passive:true});
      sc.addEventListener('touchmove',e=>{ if(!mq.matches||currentDetent!=='full') return; const y=e.touches[0].clientY,dy=y-sy;
        if(!active){ if(sc.scrollTop<=0 && dy>6){ active=true; dragStart(y); } else return; }
        if(active){ e.preventDefault(); dragMove(y); } },{passive:false});
      const end=()=>{ if(active){ active=false; dragEnd(); } };
      sc.addEventListener('touchend',end,{passive:true}); sc.addEventListener('touchcancel',end,{passive:true});
    });
    /* tapping a tab while collapsed lifts the sheet; focusing search expands it */
    document.querySelectorAll('.control-panel .mode-btn').forEach(b=>{
      b.addEventListener('click',()=>{ if(!mq.matches) return; const wasPeek=currentDetent==='peek'; setTimeout(()=>{ if(wasPeek) setDetent('half'); else setDetent(currentDetent,false); },70); });
    });
    const si=document.getElementById('search-input'); if(si) si.addEventListener('focus',()=>{ if(mq.matches && currentDetent!=='full') setDetent('full'); });

    /* =================== place-search FAB =================== */
    (function(){
      const ms=document.getElementById('map-search'); const input=document.getElementById('ms-input'); if(!ms) return;
      function open(){ ms.classList.add('ms-open'); document.body.classList.add('search-open'); setTimeout(()=>{ try{input.focus();}catch(_){} },60); }
      function close(){ ms.classList.remove('ms-open'); document.body.classList.remove('search-open'); }
      ms.addEventListener('click',e=>{ if(!mq.matches) return; if(!ms.classList.contains('ms-open')){ e.stopPropagation(); e.preventDefault(); open(); } },true);
      if(input) input.addEventListener('blur',()=>{ if(mq.matches && !input.value.trim()) setTimeout(close,150); });
      document.addEventListener('click',e=>{ if(mq.matches && ms.classList.contains('ms-open') && !ms.contains(e.target) && (!input||!input.value.trim())) close(); });
    })();

    /* =================== boot + responsive (self-healing) =================== */
    let lastIsM=null;
    function syncResponsive(){
      const isM=mq.matches; const crossed=(isM!==lastIsM);
      if(crossed){ applyLayout(isM); lastIsM=isM; }
      if(isM){ recompute(); setDetent(crossed?'half':currentDetent,false); }
      else{ document.body.classList.remove('sheet-full'); if(map&&map.setPadding){ try{ map.setPadding({top:0,left:0,right:0,bottom:0}); }catch(_){} } }
    }
    syncResponsive();                                                     // initial layout at load width
    if(mq.matches) requestAnimationFrame(()=>setDetent('half',true));     // animated entrance on phones
    if(mq.addEventListener) mq.addEventListener('change',syncResponsive); // width crosses 768 in either direction
    window.addEventListener('resize',syncResponsive);                    // dvh / toolbar / rotation changes
    window.addEventListener('orientationchange',()=>setTimeout(syncResponsive,220));
    updateCompass();
  }

  /* =====================================================================
   *  SUPABASE INTEGRATION — cloud data loading, auth, community + favorites,
   *  and realtime. This block turns the prototype into a multi-user service.
   * ===================================================================== */
  const DB = window.sb;        /* Supabase client (null only if the SDK failed to load) */
  let currentUser = null;      /* {id,email,name,isAdmin} when logged in, else null */
  function imToast(msg){ try{ aiToast(msg); }catch(_){ try{ satToast(msg); }catch(__){ try{ alert(msg); }catch(___){} } } }

  /* ---------- DATA: geo_pins -> geoRaw -> rebuildGeoIndex ---------- */
  async function loadGeoFromSupabase(){
    if(!DB) return;
    const { data, error } = await DB.from('geo_pins').select('type,terms,name_en,name_jp,lng,lat').order('sort_order',{ascending:true});
    if(error){ console.warn('[IntMap] geo_pins load failed:', error.message); return; }
    const grouped={};
    (data||[]).forEach(r=>{ (grouped[r.type]=grouped[r.type]||[]).push({ terms:r.terms||[], loc:[r.lng,r.lat], name:{en:r.name_en, jp:r.name_jp||r.name_en} }); });
    geoRaw=grouped; rebuildGeoIndex();
  }
  /* ---------- DATA: dashboard_cards -> extendedDashDB ---------- */
  async function loadDashFromSupabase(){
    if(!DB) return;
    const { data, error } = await DB.from('dashboard_cards').select('*').order('sort_order',{ascending:true});
    if(error){ console.warn('[IntMap] dashboard_cards load failed:', error.message); return; }
    extendedDashDB=(data||[]).map(r=>({
      id: r.slug || ('card-'+r.id), layerRef: r.layer_ref||null, cat: r.cat, type: r.type, loc:[r.lng,r.lat],
      img: r.img||'', title:{en:r.title_en, jp:r.title_jp||r.title_en}, badge:r.badge||'',
      body:{en:r.body_en||'', jp:r.body_jp||r.body_en||''},
      wiki: (r.wiki_en||r.wiki_jp)?{en:r.wiki_en||r.wiki_jp, jp:r.wiki_jp||r.wiki_en}:null,
      specs: r.specs||undefined
    }));
  }

  /* ---------- AUTH ---------- */
  function injectAuthUI(){
    const settingsBtn=document.getElementById('btn-open-settings');
    const acct=document.createElement('button');
    acct.id='btn-account'; acct.className='btn-settings'; acct.style.marginRight='8px'; acct.textContent='Log in';
    acct.onclick=()=>{ currentUser ? openAccountMenu() : openAuthModal(); };
    if(settingsBtn&&settingsBtn.parentNode) settingsBtn.parentNode.insertBefore(acct,settingsBtn);
    else document.body.appendChild(acct);

    const m=document.createElement('div'); m.id='auth-modal';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:5000;padding:20px;';
    const inStyle='width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid transparent;background:var(--input-bg);color:var(--text-main);margin-bottom:10px;';
    const oaStyle='width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:9px;border:1px solid rgba(128,128,128,0.25);background:var(--card-bg);color:var(--text-main);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:8px;';
    m.innerHTML=`<div style="background:var(--card-bg);color:var(--text-main);border-radius:16px;box-shadow:var(--shadow);padding:24px;width:100%;max-width:360px;box-sizing:border-box;max-height:92vh;overflow-y:auto;">
      <h2 style="margin:0 0 4px;font-size:19px;">IntMap account</h2>
      <p id="am-sub" style="margin:0 0 16px;color:var(--text-muted);font-size:13px;line-height:1.5;">Log in or create an account to post, comment and save favorites across devices.</p>
      <div style="display:flex;background:var(--input-bg);border-radius:10px;padding:3px;margin-bottom:14px;">
        <button id="am-tab-login" style="flex:1;border:none;background:var(--card-bg);color:var(--text-main);padding:8px;border-radius:8px;font-weight:600;cursor:pointer;">Log In</button>
        <button id="am-tab-signup" style="flex:1;border:none;background:transparent;color:var(--text-muted);padding:8px;border-radius:8px;font-weight:600;cursor:pointer;">Sign Up</button>
      </div>
      <button id="am-oauth-google" style="${oaStyle}"><span style="font-weight:700;color:#4285F4;">G</span> Continue with Google</button>
      <button id="am-oauth-apple" style="${oaStyle}"> Continue with Apple</button>
      <div style="display:flex;align-items:center;gap:10px;margin:12px 0 14px;color:var(--text-muted);font-size:12px;"><div style="flex:1;height:1px;background:rgba(128,128,128,0.2);"></div>or<div style="flex:1;height:1px;background:rgba(128,128,128,0.2);"></div></div>
      <input id="am-name" type="text" placeholder="Display name" autocomplete="nickname" maxlength="40" style="${inStyle}display:none;">
      <input id="am-email" type="email" placeholder="you@example.com" autocomplete="username" style="${inStyle}">
      <input id="am-pass" type="password" placeholder="Password (min. 6 characters)" autocomplete="current-password" style="${inStyle}margin-bottom:14px;">
      <button id="am-submit" style="width:100%;background:var(--primary-color);color:#fff;border:none;padding:11px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;">Log In</button>
      <p id="am-msg" style="margin:12px 0 0;color:var(--text-muted);font-size:12.5px;line-height:1.5;"></p>
      <button id="am-close" style="width:100%;background:transparent;border:none;color:var(--text-muted);margin-top:8px;padding:6px;cursor:pointer;font-size:13px;">Close</button>
    </div>`;
    document.body.appendChild(m);
    let amMode='login';
    function setTab(mode){ amMode=mode;
      $am('am-tab-login').style.background = mode==='login'?'var(--card-bg)':'transparent';
      $am('am-tab-login').style.color = mode==='login'?'var(--text-main)':'var(--text-muted)';
      $am('am-tab-signup').style.background = mode==='signup'?'var(--card-bg)':'transparent';
      $am('am-tab-signup').style.color = mode==='signup'?'var(--text-main)':'var(--text-muted)';
      $am('am-name').style.display = mode==='signup'?'block':'none';
      $am('am-pass').setAttribute('autocomplete', mode==='signup'?'new-password':'current-password');
      $am('am-submit').textContent = mode==='login'?'Log In':'Create account';
      $am('am-msg').textContent='';
    }
    function $am(id){ return document.getElementById(id); }
    $am('am-tab-login').onclick=()=>setTab('login');
    $am('am-tab-signup').onclick=()=>setTab('signup');
    $am('am-close').onclick=()=>{ m.style.display='none'; };
    m.onclick=(e)=>{ if(e.target===m) m.style.display='none'; };
    $am('am-submit').onclick=async()=>{
      const email=$am('am-email').value.trim(), password=$am('am-pass').value, name=$am('am-name').value.trim(), msg=$am('am-msg');
      if(!email||!password){ msg.textContent='Enter email and password.'; return; }
      if(amMode==='signup'){
        if(!name){ msg.textContent='Choose a display name (shown on your community posts).'; return; }
        if(password.length<6){ msg.textContent='Password must be at least 6 characters.'; return; }
      }
      $am('am-submit').disabled=true; msg.textContent='Working…';
      try{
        if(amMode==='signup'){
          /* display_name is stored in user metadata; the profile row picks it up on first login */
          const {error}=await DB.auth.signUp({email,password,options:{data:{display_name:name}}}); if(error) throw error;
          msg.textContent='Account created. If email confirmation is required, confirm via the link we emailed you, then log in.'; setTab('login');
        } else {
          const {error}=await DB.auth.signInWithPassword({email,password}); if(error) throw error;
          m.style.display='none';
        }
      }catch(e){ msg.textContent='Error: '+((e&&e.message)||e); }
      finally{ $am('am-submit').disabled=false; }
    };
    /* OAuth (Google / Apple). NOTE: each provider must be ENABLED in the Supabase dashboard
       (Authentication → Providers) with this site added as a redirect URL, or it errors. */
    async function oauth(provider){ const msg=$am('am-msg'); msg.textContent='Redirecting…';
      try{ const {error}=await DB.auth.signInWithOAuth({ provider, options:{ redirectTo: location.href.split('#')[0] } }); if(error) throw error; }
      catch(e){ msg.textContent='Error: '+((e&&e.message)||e); } }
    $am('am-oauth-google').onclick=()=>oauth('google');
    $am('am-oauth-apple').onclick=()=>oauth('apple');
    window.__amSetTab=setTab;
  }
  function openAuthModal(){ const m=document.getElementById('auth-modal'); if(m){ if(window.__amSetTab) window.__amSetTab('login'); m.style.display='flex'; } }
  function openAccountMenu(){
    if(!currentUser) return openAuthModal();
    let m=document.getElementById('acct-modal');
    if(!m){
      m=document.createElement('div'); m.id='acct-modal';
      m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:5000;padding:20px;';
      m.innerHTML=`<div style="background:var(--card-bg);color:var(--text-main);border-radius:16px;box-shadow:var(--shadow);padding:24px;width:100%;max-width:360px;box-sizing:border-box;">
        <h2 style="margin:0 0 4px;font-size:19px;">${currentLang==='jp'?'プロフィール':'Your profile'}</h2>
        <p id="acct-email" style="margin:0 0 16px;color:var(--text-muted);font-size:13px;"></p>
        <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;">${currentLang==='jp'?'表示名':'Display name'}</label>
        <input id="acct-name" type="text" maxlength="40" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid transparent;background:var(--input-bg);color:var(--text-main);margin:6px 0 14px;">
        <button id="acct-save" style="width:100%;background:var(--primary-color);color:#fff;border:none;padding:11px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;">${currentLang==='jp'?'保存':'Save profile'}</button>
        <p id="acct-msg" style="margin:10px 0 0;color:var(--text-muted);font-size:12.5px;"></p>
        <button id="acct-logout" style="width:100%;background:var(--input-bg);color:var(--info-mil);border:none;padding:10px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;margin-top:12px;">${currentLang==='jp'?'ログアウト':'Log out'}</button>
        <button id="acct-close" style="width:100%;background:transparent;border:none;color:var(--text-muted);margin-top:6px;padding:6px;cursor:pointer;font-size:13px;">${currentLang==='jp'?'閉じる':'Close'}</button>
      </div>`;
      document.body.appendChild(m);
      m.onclick=(e)=>{ if(e.target===m) m.style.display='none'; };
      document.getElementById('acct-close').onclick=()=>{ m.style.display='none'; };
      document.getElementById('acct-logout').onclick=async()=>{ m.style.display='none'; await DB.auth.signOut(); };
      document.getElementById('acct-save').onclick=async()=>{
        const name=document.getElementById('acct-name').value.trim(), msg=document.getElementById('acct-msg');
        if(!name){ msg.textContent=currentLang==='jp'?'表示名を入力してください。':'Display name cannot be empty.'; return; }
        const btn=document.getElementById('acct-save'); btn.disabled=true; msg.textContent=currentLang==='jp'?'保存中…':'Saving…';
        try{
          const {error}=await DB.from('profiles').update({display_name:name}).eq('id',currentUser.id); if(error) throw error;
          try{ await DB.auth.updateUser({data:{display_name:name}}); }catch(_){}
          currentUser.name=name; updateAccountButton(); msg.textContent=currentLang==='jp'?'保存しました。':'Saved.';
          if(currentMode==='community') loadCommunity();
          setTimeout(()=>{ m.style.display='none'; }, 600);
        }catch(e){ msg.textContent='Error: '+((e&&e.message)||e); }
        finally{ btn.disabled=false; }
      };
    }
    document.getElementById('acct-email').textContent=currentUser.email;
    document.getElementById('acct-name').value=currentUser.name||'';
    document.getElementById('acct-msg').textContent='';
    m.style.display='flex';
  }
  function updateAccountButton(){ const b=document.getElementById('btn-account'); if(b) b.textContent = currentUser ? ('👤 '+(currentUser.name||currentUser.email.split('@')[0])) : 'Log in'; }
  async function refreshCurrentUser(){
    if(!DB){ currentUser=null; return; }
    const { data:{ session } } = await DB.auth.getSession();
    if(!session){ currentUser=null; updateAccountButton(); return; }
    const meta=session.user.user_metadata||{};
    let isAdmin=false, isPro=false, name='';
    try{
      /* try to read is_pro too; if that column doesn't exist yet, fall back to the basic select */
      let r=await DB.from('profiles').select('display_name,is_admin,is_pro').eq('id',session.user.id).maybeSingle();
      if(r.error) r=await DB.from('profiles').select('display_name,is_admin').eq('id',session.user.id).maybeSingle();
      const prof=r.data;
      if(prof){ isAdmin=!!prof.is_admin; isPro=!!prof.is_pro; if(prof.display_name) name=prof.display_name; }
      /* First login after email/OAuth signup: copy the chosen name (or OAuth name) into the profile */
      if(!name){ const want=meta.display_name||meta.full_name||meta.name||''; if(want){ try{ await DB.from('profiles').update({display_name:want}).eq('id',session.user.id); name=want; }catch(_){} } }
    }catch(_){}
    if(!name) name=session.user.email.split('@')[0];
    currentUser={ id:session.user.id, email:session.user.email, name, isAdmin, isPro:isPro||isAdmin }; updateAccountButton();
  }

  /* ---------- FAVORITES (★ saved articles) ---------- */
  async function loadFavorites(){
    if(!currentUser||!DB) return;
    const {data,error}=await DB.from('favorites').select('article_link');
    if(error){ console.warn('[IntMap] favorites load:', error.message); return; }
    let cloud=(data||[]).map(r=>r.article_link);
    /* one-time merge of any favorites saved as a guest before logging in */
    let local=[]; try{ local=JSON.parse(localStorage.getItem('intmap_bookmarks'))||[]; }catch(_){}
    const toAdd=local.filter(l=>!cloud.includes(l));
    if(toAdd.length){ try{ await DB.from('favorites').insert(toAdd.map(l=>({user_id:currentUser.id,article_link:l}))); cloud=cloud.concat(toAdd); }catch(_){}
      try{ localStorage.removeItem('intmap_bookmarks'); }catch(_){} }
    bookmarks=cloud;
  }
  async function toggleFavorite(link,title){
    if(!currentUser){ openAuthModal(); return false; }
    const has=bookmarks.includes(link);
    if(has){ bookmarks=bookmarks.filter(b=>b!==link); await DB.from('favorites').delete().eq('user_id',currentUser.id).eq('article_link',link); }
    else { bookmarks.push(link); await DB.from('favorites').insert({ user_id:currentUser.id, article_link:link, article_title:title||null }); }
    return !has;
  }

  /* ---------- COMMUNITY (cloud) ---------- */
  function requireLogin(){ if(!currentUser){ openAuthModal(); return false; } return true; }
  async function loadCommunity(){
    if(!DB){ communityPosts=[]; renderCommunity(); return; }
    const uid=currentUser?currentUser.id:null;
    const {data,error}=await DB.from('community_posts')
      .select('id,user_id,author_name,title,body,img,lat,lng,created_at,community_comments(id,author_name,body,created_at),community_votes(user_id)')
      .order('created_at',{ascending:false});
    if(error){ console.warn('[IntMap] community load:', error.message); communityPosts=[]; renderCommunity(); return; }
    communityPosts=(data||[]).map(p=>({
      id:p.id, userId:p.user_id, title:p.title||'', body:p.body||'', img:p.img||'', lat:p.lat, lng:p.lng,
      ts:Date.parse(p.created_at)||Date.now(), author:p.author_name||'',
      votes:(p.community_votes||[]).length,
      voted: uid?(p.community_votes||[]).some(v=>v.user_id===uid):false,
      comments:(p.community_comments||[]).slice().sort((a,b)=>(Date.parse(a.created_at)||0)-(Date.parse(b.created_at)||0))
                .map(c=>({ts:Date.parse(c.created_at)||Date.now(), text:c.body, author:c.author_name||''}))
    }));
    pushCommunityFeatures(); renderCommunity();
  }
  async function cmAddPost(title,body,img,lat,lng){
    const {error}=await DB.from('community_posts').insert({ user_id:currentUser.id, author_name:currentUser.name, title:title||null, body:body||null, img:img||null, lat, lng });
    if(error) throw error;
  }
  async function cmComment(postId,text){
    const {error}=await DB.from('community_comments').insert({ post_id:postId, user_id:currentUser.id, author_name:currentUser.name, body:text });
    if(error) throw error;
  }
  async function cmVote(postId,on){
    if(on){ const {error}=await DB.from('community_votes').insert({ post_id:postId, user_id:currentUser.id }); if(error && error.code!=='23505') throw error; }
    else { const {error}=await DB.from('community_votes').delete().eq('post_id',postId).eq('user_id',currentUser.id); if(error) throw error; }
  }
  async function cmDelete(postId){ const {error}=await DB.from('community_posts').delete().eq('id',postId); if(error) throw error; }
  async function cmReport(postId){ const {error}=await DB.from('community_reports').insert({ post_id:postId, user_id:currentUser.id }); if(error && error.code!=='23505') throw error; }

  /* ---------- REALTIME (live auto-reflect) ---------- */
  function subscribeRealtime(){
    if(!DB||!DB.channel) return;
    try{
      DB.channel('intmap-public')
        .on('postgres_changes',{event:'*',schema:'public',table:'geo_pins'},        ()=>loadGeoFromSupabase().then(()=>{ try{ if(globalData&&globalData.length) renderUI(); }catch(_){} }))
        .on('postgres_changes',{event:'*',schema:'public',table:'dashboard_cards'}, ()=>loadDashFromSupabase().then(()=>{ try{ if(currentMode==='info') renderDashboard(); }catch(_){} }))
        .on('postgres_changes',{event:'*',schema:'public',table:'community_posts'},    ()=>loadCommunity())
        .on('postgres_changes',{event:'*',schema:'public',table:'community_comments'}, ()=>{ if(currentMode==='community') loadCommunity(); })
        .on('postgres_changes',{event:'*',schema:'public',table:'community_votes'},    ()=>{ if(currentMode==='community') loadCommunity(); })
        .subscribe();
    }catch(e){ console.warn('[IntMap] realtime subscribe failed:', e&&e.message); }
  }

  /* ---------- BOOT ---------- */
  async function bootSupabase(){
    if(!DB){ console.warn('[IntMap] Supabase unavailable — load supabase.js / supabase-config.js. Running with empty data.'); return; }
    injectAuthUI();
    await refreshCurrentUser();
    DB.auth.onAuthStateChange(async()=>{ await refreshCurrentUser(); await loadFavorites();
      try{ if(currentMode==='news'||currentMode==='saved') startNews(); }catch(_){}
      try{ if(currentMode==='community') loadCommunity(); }catch(_){}
      /* Pro entitlement may have changed → re-check satellite provider access */
      try{ if(currentMapType==='sat'){ const cur=satProviderById(satState.providerId); if(cur&&cur.tier==='pro'&&!satHasKey(cur)) satRevertToFallback(); else satRenderController(); } }catch(_){} });
    await Promise.all([ loadGeoFromSupabase(), loadDashFromSupabase(), loadFavorites() ]);
    try{ renderUI(); }catch(_){}          /* re-render the active tab now data + favorites are in */
    try{ loadCommunity(); }catch(_){}      /* prime the community map pins */
    subscribeRealtime();
  }

  /* ===== Init ===== */
  populateTimezones(); updateI18n(); fetchData(); setInterval(fetchData,180000); bootSupabase();
  try{ initMobileUI(); }catch(e){ console.warn('initMobileUI failed:',e); }
});
</script>
</body>
</html>
