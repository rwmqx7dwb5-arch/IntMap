# (#R185) Keep the bundled satellite catalogue close to the live one.
#
# The live-satellites layer reads CelesTrak. On 2026-08-01 celestrak.org resolved and then refused
# every connection for hours, and with one source the layer drew nothing at all — which is the one
# outcome the brief rules out (「何も表示されないのは論外」). The app therefore ships a real element
# set of its own (data/tle/), and this job is what stops that copy from going stale: it rebuilds it
# from CelesTrak — or, when CelesTrak cannot be reached, it carries the previous bundle forward and
# updates it from SatNOGS DB (scripts/lib/tle-compose.mjs), which mirrors the same
# Space-Track / CelesTrak elements.
#
# Element sets are re-issued on a roughly two-hour timescale for low orbits, but a snapshot is a
# FALLBACK, not the live path: twice a day keeps its worst case at ~12 h old, which SGP4 propagates
# to a few kilometres for LEO, and the layer states the age of the elements it used either way.
#
# ⚠ IT OPENS A PULL REQUEST RATHER THAN PUSHING. `main` carries a ruleset requiring a pull request
# with NO bypass actors, so `github-actions[bot]` cannot push to it either — a job that committed
# straight to main would have failed on every run that actually had an update, which is every run
# that mattered. Checked with `gh api repos/.../rulesets`: rules = deletion, pull_request,
# required_status_checks, non_fast_forward; bypass_actors = [].
#
# ⚠⚠ (#R372) …AND OPENING THE PULL REQUEST WAS NEVER THE LAST STEP. Measured: of the scheduled runs
# from 2026-08-01 to 08-24, EVERY ONE came back `action_required` with a 0 s duration — this repo's
# Actions setting is `fork-pr-contributor-approval = first_time_contributors`, and GitHub counts
# `github-actions[bot]` as one, so its pull requests never start their own checks. The three that
# ever landed (#78, #79, #110) landed because a person clicked Approve. Nobody clicked after 08-09,
# so for fifteen days `main` shipped an element set built on 08-09 while this branch carried one
# built that morning — SGP4 error grows with element age, so the layer's positions drifted for
# every reader who could not reach CelesTrak. The catalogue was never broken; the LAST STEP was
# a human clicking a button twice a day, and that is not a step a data path may contain.
# So the job now finishes the job: it approves the checks it caused, waits for them, and merges.
# It does NOT weaken `main` — the same ruleset, the same two required checks, the same PR. What
# changed is who presses the button. If GitHub ever refuses the approval to `GITHUB_TOKEN`, this
# step FAILS LOUDLY rather than leaving another silent fifteen days.
#
# (upstream-liveness) THIS IS ALSO WHERE EVERY OTHER UNATTENDED DATA REFRESH LANDS. Everything above
# — a bot PR on a ruleset-protected main, approving the runs it caused, merging, dispatching the
# deploy — is the hard part of refreshing ANY bundle, and a second workflow would have needed a copy
# of all of it. So the catalogue's job carries the other bundles that are due (the step
# «Rebuild the other bundles …» below) in the same pull request. Which bundles, and why those, is
# declared per builder (`autoRefresh` in its GOVERNANCE) and explained in docs/DATA-GOVERNANCE.md.
# The file keeps its name because tests and documents address it by it.
name: TLE snapshot

on:
  schedule:
    - cron: '17 3,15 * * *'      # 03:17 and 15:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write                 # (#R372) .../actions/runs/<id>/approve on this one branch, and dispatching deploy.yml after the merge
  checks: read                   # (shell-experience) the annotations of the Atlas evaluation's failed step — why it did not run

concurrency:
  group: tle-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
      - name: Rebuild data/tle from the live sources
        run: node scripts/build-tle-snapshot.mjs
      # ── (upstream-liveness) THE OTHER BUNDLES THAT ARE DUE RIDE THE SAME PULL REQUEST ───────────
      # Before this step the catalogue was the only bundle anything rebuilt on a schedule (measured
      # 2026-09-30: spacecraft and small-bodies last written 2026-08-10, the GIBS date ranges 08-21).
      # scripts/data-refresh.mjs runs the builders whose GOVERNANCE declares `autoRefresh` — light,
      # keyless, every response checked before a byte is written (check:datagov, rule refresh-safe)
      # — and only when a bundle is `aging` or `stale` by its own declared cadence, so a monthly
      # upstream is asked monthly although this job runs twice a day. A builder that fails leaves its
      # bundle as it was and prints a warning; it does not stop the catalogue.
      # ⚠ `!cancelled()`, NOT THE DEFAULT `success()`: the catalogue failing (CelesTrak and SatNOGS
      # both down) must not also stop the other bundles, and the job stays red for the catalogue
      # exactly as before — the step that failed is still the one that failed.
      # ⚠ No `npm ci`: data-refresh.mjs reads declarations with nothing but the runtime (the one npm
      # dependency of check:datagov, acorn, is imported only where it is used).
      - name: Rebuild the other bundles whose declared cadence says they are due
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}      # a shallow clone dates its bytes by asking GitHub
        run: node scripts/data-refresh.mjs --run --summary refresh-summary.md --paths-out refresh-paths.txt
      # ── (shell-experience) WHAT LAST NIGHT'S CHECKS SAID, WHERE THE READER CAN READ IT ─────────────────────
      # upstream-liveness.yml and atlas-eval.yml measure things the reader is affected by (which suppliers are not
      # answering; when Atlas was last evaluated) into artifacts and run pages nobody outside CI reads. This step
      # writes their digest to data/service-status.json — read by the app's status page (Settings ▸ IntMap, now),
      # by a layer row whose request failed, and by the data-sources lists (js/service-status.js). It rides THIS
      # pull request because this is the one unattended path onto main (see the header). The script rewrites the
      # file only when what it says changed, and a half it cannot read keeps last time's answer with its own date.
      # ⚠ A failure here is a warning: it must not stop the catalogue, which is what this job exists for.
      - name: Rebuild the reader's status bundle from last night's checks
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-service-status.mjs || echo "::warning::data/service-status.json could not be rebuilt — it stays as it was"
      - name: Open a pull request when the catalogue or a due bundle actually moved
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "nothing under data/ moved — nothing to propose"
            exit 0
          fi
          BRANCH="data/tle-refresh"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # only what the two rebuild steps wrote: the catalogue, and the paths data-refresh reported
          git add data/tle data/service-status.json $(cat refresh-paths.txt 2>/dev/null)
          {
            echo "data: refresh the bundled satellite catalogue and the bundles that were due"
            echo
            echo "Rebuilt by .github/workflows/tle-refresh.yml (#R185). Source and object count are in"
            echo "data/tle/catalogue.json; the other bundles were chosen by scripts/data-refresh.mjs."
            echo
            cat refresh-summary.md 2>/dev/null || true
          } > commit-message.txt
          git commit -F commit-message.txt
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            BODY="$(node -e 'const m=require("./data/tle/catalogue.json");console.log(`Rebuilt by the scheduled \`TLE snapshot\` workflow.\n\n| | |\n|---|---|\n| source | ${m.source} |\n| objects | ${m.objects} |\n| newest epoch | ${m.newestEpoch} |\n| median element age | ${m.medianElementAgeHours} h |\n\nThis is the copy the live-satellite layer falls back to when CelesTrak cannot be reached (#R185). Real element sets, propagated by SGP4 in real time; the app reports their age.`)')"
            BODY="$BODY

          $(cat refresh-summary.md 2>/dev/null || true)"
            gh pr create --base main --head "$BRANCH" \
              --title "data: refresh the bundled satellite catalogue and the bundles that were due" \
              --body "$BODY"
          else
            echo "an open pull request already tracks this branch — it now carries the newer catalogue and bundles"
          fi
      # (perf-baseline-auto-tighten) THE LANDING LIVES IN .github/actions/land-bot-pr — moved there, not
      # copied, when a second workflow (perf-ceiling.yml) needed it. Approving the parked runs, waiting
      # for them, telling «not reported yet» and «cancelled» apart from red, merging, and dispatching
      # deploy.yml are all there, with the measurements that put each of them there.
      - name: Approve the checks this job caused, wait for them, and land the catalogue
        id: land
        if: ${{ !cancelled() }}
        uses: ./.github/actions/land-bot-pr
        with:
          branch: data/tle-refresh
          what: the catalogue
      - name: The catalogue did not land this time — is main's copy stale?
        if: ${{ !cancelled() && steps.land.outputs.result == 'lost' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # ⚠⚠ LOSING THE RACE IS NOT THE FAILURE THIS JOB EXISTS TO REPORT. Measured: the approvals
          # work, the checks run and they pass — but CI takes ~6 minutes and this repository merges
          # every few minutes, so `update-branch` can be overtaken before the merge button is
          # reachable. Going red for that, twice a day, would rebuild the exact thing #R372 set out
          # to remove: an alarm nobody reads. What actually matters is whether MAIN's catalogue has
          # gone stale, so that is what is measured, and that is the only thing that fails the job.
          BUILT="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/tle/catalogue.json?ref=main" \
                    --jq .content | base64 -d | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).builtAt||"")}catch{console.log("")}})')"
          AGE_D=-1
          if [ -n "$BUILT" ]; then
            AGE_D="$(node -e "console.log(Math.floor((Date.now()-Date.parse(process.argv[1]))/86400000))" "$BUILT")"
          fi
          echo "main's catalogue was built $BUILT (${AGE_D} day(s) ago)"
          if [ "$AGE_D" -lt 0 ] || [ "$AGE_D" -ge 3 ]; then
            echo "::error::could not land the catalogue, and main's copy is ${AGE_D} day(s) old. THIS is the fifteen-day silence #R372 was about — read this run's log rather than waiting for the next one."
            exit 1
          fi
          echo "::notice::could not land this run's catalogue (main kept moving), but main's copy is only ${AGE_D} day(s) old. The next scheduled run will retry."
