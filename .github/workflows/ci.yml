# IntMap CI — runs on every PR, every push to main, and on demand.
# Two jobs: cheap static checks (always) and a real-browser smoke + internal-QA run.
# Least-privilege by default: the whole workflow only needs to read the repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token — no job here writes to the repo, deploys, or needs secrets.
permissions:
  contents: read

# A newer commit on the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static checks (syntax, JSON/YAML, merge markers, secrets, assets, action-pinning)
        run: npm run check:static
      # (#R178) 「MapLibre依存脱却」: only js/geo-engine.js may name the renderer. An AST gate, so a
      # comment that says "the map. When…" never trips it, and a local `map` variable is not coupling.
      - name: Renderer-decoupling gate (only js/geo-engine.js may name MapLibre)
        run: npm run check:engine
      # (#R166) Was `node --test tests/security-logic.mjs tests/monitor-logic.test.mjs`, so the R1xx
      # source-level suites ran only on a developer's machine — including the file-split invariants,
      # which is exactly the kind of guard that must not be optional. `npm run test:checks` is the
      # same list `npm test` uses, so the two can no longer drift. ~2 s for 200+ tests.
      - name: Source-level regression checks (Edge Function invariants, area-monitor engine, R1xx suites)
        run: npm run test:checks

  # ══ (#R186) THE BROWSER SUITE RUNS ON TEN MACHINES, NOT TEN WORKERS ════════════════════════════
  # 360 real-browser tests on ONE runner took 70 minutes on a good day and over two hours on a bad
  # one — and the bad days are not random. `playwright.config.js` already records the mechanism from
  # #R184: when this job gets long, the timing-sensitive tests (the Cesium camera comparisons, the
  # terrain reads, the 3-D flight cases — each of them minutes long by nature) start failing on LOAD
  # rather than on their own merits, and every retry makes the job longer still.
  #
  # Sharding fixes both halves at once, and it is the one lever that costs no coverage: every test
  # still runs, and `workers: 2` still means two browsers per machine, so the CONTENTION each test
  # sees is no worse than what it saw before. What changes is that ten machines share the work.
  # The gate job below keeps the single check name the branch has always reported.
  #
  # ⚠ AND THE SUITE IS SPLIT IN TWO BEFORE IT IS SHARDED. Playwright shards by TEST COUNT, and the
  # expensive specs are the ones with FEW tests that each take minutes — so eight shards still parked
  # every `*-cesium*` file on one machine: that shard took ONE HOUR while the other seven finished in
  # two to fifteen minutes, and four of its tests failed on load rather than on their merits (all four
  # pass locally). More shards cannot fix that; only separating them can.
  #
  # So the 31 Cesium tests get four machines at ONE worker each — no intra-machine contention, which
  # is the condition they pass under — and the other 329 get six machines at two workers. The split is
  # in playwright.config.js behind IM_SUITE, which is unset everywhere else, so `npm test` locally is
  # unchanged and no test can fall between the two halves (verified: 31 + 329 = 360, 4 + 44 = 48).
  browser:
    name: Browser ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one slow shard must not hide the results of the others
      matrix:
        include:
          - { suite: cesium, shard: 1, of: 4 }
          - { suite: cesium, shard: 2, of: 4 }
          - { suite: cesium, shard: 3, of: 4 }
          - { suite: cesium, shard: 4, of: 4 }
          - { suite: rest, shard: 1, of: 6 }
          - { suite: rest, shard: 2, of: 6 }
          - { suite: rest, shard: 3, of: 6 }
          - { suite: rest, shard: 4, of: 6 }
          - { suite: rest, shard: 5, of: 6 }
          - { suite: rest, shard: 6, of: 6 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache the Playwright browser binaries between runs (keyed on the lockfile).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests (smoke + internal QA)
        env:
          IM_SUITE: ${{ matrix.suite }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.of }}
      # On failure, publish the report + screenshots + traces so the cause is visible in GitHub.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # One check, whatever the shard count is — so the PR still reports a single browser result and any
  # required-check configuration keeps matching. It carries the name the single job used to have.
  browser-gate:
    name: Browser smoke + internal QA
    runs-on: ubuntu-latest
    needs: browser
    if: ${{ always() }}
    steps:
      - name: All browser shards passed
        run: |
          echo "shards: ${{ needs.browser.result }}"
          test "${{ needs.browser.result }}" = "success"
