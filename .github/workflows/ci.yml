# IntMap CI — runs on every PR, every push to main, and on demand.
# Two jobs: cheap static checks (always) and a real-browser smoke + internal-QA run.
# Least-privilege by default: the whole workflow only needs to read the repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # (#R203) …and the DEEP tier every night. 18:00 UTC = 03:00 JST.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# Read-only token — no job here writes to the repo, deploys, or needs secrets.
permissions:
  contents: read

# A newer commit on the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static checks (syntax, JSON/YAML, merge markers, secrets, assets, action-pinning)
        run: npm run check:static
      # (#R178) 「MapLibre依存脱却」: only js/geo-engine.js may name the renderer. An AST gate, so a
      # comment that says "the map. When…" never trips it, and a local `map` variable is not coupling.
      - name: Renderer-decoupling gate (only js/geo-engine.js may name MapLibre)
        run: npm run check:engine
      # (#R197) 「そもそもの時間が長すぎる。個別対応するな。何重にもテストとか意味がない。」
      # The suite's measured serial time has a CEILING, and the ceiling may only ever be LOWERED.
      # Every previous round fixed test time for that round and the suite grew back, because the
      # convention was one new spec file per round and nothing counted the total. A round that wants
      # to add test time now has to take at least as much out somewhere else, which is what forces
      # consolidation instead of accumulation. Unmeasured specs are charged p75, so deleting a
      # duration cannot buy headroom. See scripts/test-budget.mjs.
      - name: Test-time budget (the ceiling only goes down)
        run: npm run check:testbudget
      # (#R166) Was `node --test tests/security-logic.mjs tests/monitor-logic.test.mjs`, so the R1xx
      # source-level suites ran only on a developer's machine — including the file-split invariants,
      # which is exactly the kind of guard that must not be optional. `npm run test:checks` is the
      # same list `npm test` uses, so the two can no longer drift. ~2 s for 200+ tests.
      - name: Source-level regression checks (Edge Function invariants, area-monitor engine, R1xx suites)
        run: npm run test:checks

  # ══ (#R186) THE BROWSER SUITE RUNS ON TEN MACHINES, NOT TEN WORKERS ════════════════════════════
  # 360 real-browser tests on ONE runner took 70 minutes on a good day and over two hours on a bad
  # one — and the bad days are not random. `playwright.config.js` already records the mechanism from
  # #R184: when this job gets long, the timing-sensitive tests (the Cesium camera comparisons, the
  # terrain reads, the 3-D flight cases — each of them minutes long by nature) start failing on LOAD
  # rather than on their own merits, and every retry makes the job longer still.
  #
  # Sharding fixes both halves at once, and it is the one lever that costs no coverage: every test
  # still runs, and `workers: 2` still means two browsers per machine, so the CONTENTION each test
  # sees is no worse than what it saw before. What changes is that ten machines share the work.
  # The gate job below keeps the single check name the branch has always reported.
  #
  # ⚠ AND THE SUITE IS SPLIT IN TWO BEFORE IT IS SHARDED. Playwright shards by TEST COUNT, and the
  # expensive specs are the ones with FEW tests that each take minutes — so eight shards still parked
  # every `*-cesium*` file on one machine: that shard took ONE HOUR while the other seven finished in
  # two to fifteen minutes, and four of its tests failed on load rather than on their merits (all four
  # pass locally). More shards cannot fix that; only separating them can.
  #
  # ══ (#R195) …AND SEPARATING FAMILIES BY HAND IS ITSELF THE DEFECT ═══════════════════════════════
  # 「今回だけで終わるな。そもそもの構造をどうにかしろ」. The paragraph above is the record of noticing
  # ONE heavy family and carving it out. It worked, and it did not generalise: this round the shards
  # came out 2m11, 2m20, 7m14, 8m51, 11m17 and **35m58**, because the flight-sim specs had clumped
  # exactly the way the Cesium ones once did. Carving those out too would have bought one round.
  #
  # The cause is that `--shard=i/n` divides by TEST COUNT while this suite's files run from 2 s to
  # 689 s. So CI does not use `--shard`. scripts/shard-plan.mjs packs the spec FILES into groups of
  # equal MEASURED time (tests/durations.json) and hands each job its own list. Measured plan at the
  # time of writing: five `rest` groups of ~599 s each, against 131 s … 2,158 s under count-sharding.
  # A spec that becomes slow redistributes itself on the next `--update`; nobody has to notice first.
  #
  # The one thing still stated per-file is which specs need a machine to THEMSELVES — #R186 measured
  # that for Cesium — and it lives in tests/durations.json as `solo`, as data rather than as a regex.
  # Group counts are chosen so no group exceeds the largest single file (r182-cesium, 650 s): more
  # groups cannot go below that, and fewer would waste the parallelism.
  # ══ (#R203) …AND TWELVE MACHINES STILL MEANT AN 85-MINUTE SUITE BEFORE EVERY PUSH ═══════════════
  # 「毎回毎回、テストに時間がかかりすぎ。すべてが長すぎる。明らかにテストが過剰。簡易でいい。
  #   今の時間の1/10以下の時間で全テスト工程を終わらせろ。」
  #
  # Everything above this line made the same 5,123 seconds cheaper to RUN — sharded, packed, planned
  # from measurements. None of it changed WHAT RUNS EVERY TIME, and that is the number the instruction
  # names: one tenth of 85.4 minutes is 8.5, and no amount of packing gets there, because packing only
  # moves work between machines.
  #
  # So the suite is now two tiers (scripts/tiers.mjs, listed as data in tests/durations.json):
  #   · CORE — 29 files, 424 s measured. THIS job. The gate on every PR and every push.
  #   · DEEP — 27 files, 4,699 s. The job below: nightly, after every merge, and on demand. Every
  #     assertion still runs; it just no longer stands between an edit and a push.
  # Two machines cover the core tier at ~4 minutes of wall clock including npm ci and the browser
  # download, against the twelve machines and ~12 minutes this job used to take.
  browser:
    name: Browser ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    env:
      IM_TIER: core
    strategy:
      fail-fast: false            # one slow shard must not hide the results of the others
      matrix:
        include:
          # the core tier has no `solo` spec in it — every `-cesium` file is deep — so the cesium
          # pool would plan an empty group, and an empty group is a job that runs nothing.
          - { suite: rest, shard: 1, of: 2 }
          - { suite: rest, shard: 2, of: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-tier
        with: { tier: core, suite: "${{ matrix.suite }}", shard: "${{ matrix.shard }}", of: "${{ matrix.of }}" }

  # ══ (#R203) THE OTHER 78 MINUTES — NIGHTLY, AFTER EVERY MERGE, AND ON DEMAND ════════════════════
  # 27 spec files, 4,699 s of measured serial time: the Cesium camera comparisons, the terrain reads,
  # the flight simulator, the drone planner, the satellite catalogue, the seismic and tsunami fields.
  # Each of those is a handful of tests that take MINUTES apiece by nature, and none of them is a
  # thing an ordinary edit breaks — which is exactly why they are the wrong thing to make somebody
  # wait for before a push, and the right thing to run while nobody is waiting.
  #
  # ⚠ NOT ONLY NIGHTLY. It also runs on every push to main, so a regression in this half surfaces
  # ~15 minutes after the merge that caused it rather than the next morning; the branch that caused
  # it is still the top of the history when it does. `workflow_dispatch` runs it on a branch on
  # demand — which is what a round that touches 3-D, Cesium or the simulators should do BEFORE it
  # opens the PR, and what `npm run test:deep` does locally.
  #
  # Eight machines: the same measured packing as before, over a pool that is now the heavy half. The
  # `cesium` pool still gets one worker per machine — #R186 measured that contention is what those
  # specs fail on, and tests/durations.json still says so as data (`solo`).
  browser-deep:
    name: Deep ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: cesium, shard: 1, of: 3 }
          - { suite: cesium, shard: 2, of: 3 }
          - { suite: cesium, shard: 3, of: 3 }
          - { suite: rest, shard: 1, of: 5 }
          - { suite: rest, shard: 2, of: 5 }
          - { suite: rest, shard: 3, of: 5 }
          - { suite: rest, shard: 4, of: 5 }
          - { suite: rest, shard: 5, of: 5 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-tier
        with: { tier: deep, suite: "${{ matrix.suite }}", shard: "${{ matrix.shard }}", of: "${{ matrix.of }}" }

  # ══ (#R202) THE JOB THE COMMENT ABOVE HAS BEEN PROMISING SINCE #R195 ══════════════════════════
  # 「毎回毎回、テストに時間がかかりすぎ。いい加減にしろ。」
  #
  # Every main run has computed the measured spec times and uploaded them as `baseline-<suite>-<n>`
  # — and then thrown them away, because nothing ever wrote them back. So scripts/shard-plan.mjs has
  # been packing the twelve machines from whatever a human last pasted into tests/durations.json,
  # and by #R201 two of the eight `rest` groups were PLANNED at 254 s and actually took 695 s. The
  # wall clock of the whole suite is set by its longest group, so a stale table is the wall clock.
  #
  # This closes the loop: download the twelve fragments the run just produced, union them
  # (`--merge`, which keeps any spec the fragments do not mention rather than dropping it), and
  # commit. `[skip ci]` stops the commit from starting another run — and even without it this would
  # converge on the second one, because a table that already matches produces no diff.
  timings:
    name: Record the measured times on main
    runs-on: ubuntu-latest
    needs: [browser, browser-deep]
    if: ${{ github.ref == 'refs/heads/main' && always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: _timings
      - name: Union the fragments from both tiers
        run: |
          set -euo pipefail
          D=$(find _timings -name durations.json)
          B=$(find _timings -name baseline.json)
          echo "durations fragments: $D"
          echo "baseline fragments:  $B"
          if [ -n "$D" ]; then node scripts/shard-plan.mjs --merge $D; fi
          if [ -n "$B" ]; then node scripts/baseline.mjs  --merge $B; fi
          mkdir -p _timecache
          cp tests/durations.json tests/baseline.json _timecache/
      # ⚠ (#R202, SECOND ATTEMPT) THE FIRST VERSION COMMITTED THIS TO main, AND main DOES NOT TAKE
      # COMMITS. The «Protect main» ruleset requires a pull request and status checks and lists no
      # bypass actors, so the push came back GH013 and this job went red on its first real run. That
      # rule is right, and it is the wrong thing to weaken for a DERIVED measurement: durations.json
      # and baseline.json are not source, they are the previous run's own output. A cache is where a
      # derived artefact belongs — and a cache written on the default branch is readable from
      # pull-request runs, which is exactly the direction the shard planner needs to read it.
      - name: Publish them for the next run to plan by
        uses: actions/cache/save@v4
        with:
          path: _timecache
          key: intmap-timings-${{ github.run_id }}

  # One check, whatever the shard count is — so the PR still reports a single browser result and any
  # required-check configuration keeps matching. It carries the name the single job used to have.
  browser-gate:
    name: Browser smoke + internal QA
    runs-on: ubuntu-latest
    needs: [browser, browser-deep]
    if: ${{ always() }}
    steps:
      # ⚠ (#R203) 'skipped' IS A PASS FOR THE DEEP TIER AND ONLY FOR IT. On a pull request that job
      #   does not run at all, and a gate that demanded 'success' from it would make every PR red;
      #   on a push or a nightly it DOES run, and then its result is the one that matters. A failure
      #   or a cancellation is never a pass in either tier.
      - name: All browser shards passed
        run: |
          echo "core: ${{ needs.browser.result }}   deep: ${{ needs.browser-deep.result }}"
          test "${{ needs.browser.result }}" = "success"
          case "${{ needs.browser-deep.result }}" in success|skipped) ;; *) exit 1 ;; esac
