# IntMap CI — runs on every PR, every push to main, and on demand.
# Two jobs: cheap static checks (always) and a real-browser smoke + internal-QA run.
# Least-privilege by default: the whole workflow only needs to read the repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token — no job here writes to the repo, deploys, or needs secrets.
permissions:
  contents: read

# A newer commit on the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static checks (syntax, JSON/YAML, merge markers, secrets, assets, action-pinning)
        run: npm run check:static
      # (#R178) 「MapLibre依存脱却」: only js/geo-engine.js may name the renderer. An AST gate, so a
      # comment that says "the map. When…" never trips it, and a local `map` variable is not coupling.
      - name: Renderer-decoupling gate (only js/geo-engine.js may name MapLibre)
        run: npm run check:engine
      # (#R197) 「そもそもの時間が長すぎる。個別対応するな。何重にもテストとか意味がない。」
      # The suite's measured serial time has a CEILING, and the ceiling may only ever be LOWERED.
      # Every previous round fixed test time for that round and the suite grew back, because the
      # convention was one new spec file per round and nothing counted the total. A round that wants
      # to add test time now has to take at least as much out somewhere else, which is what forces
      # consolidation instead of accumulation. Unmeasured specs are charged p75, so deleting a
      # duration cannot buy headroom. See scripts/test-budget.mjs.
      - name: Test-time budget (the ceiling only goes down)
        run: npm run check:testbudget
      # (#R166) Was `node --test tests/security-logic.mjs tests/monitor-logic.test.mjs`, so the R1xx
      # source-level suites ran only on a developer's machine — including the file-split invariants,
      # which is exactly the kind of guard that must not be optional. `npm run test:checks` is the
      # same list `npm test` uses, so the two can no longer drift. ~2 s for 200+ tests.
      - name: Source-level regression checks (Edge Function invariants, area-monitor engine, R1xx suites)
        run: npm run test:checks

  # ══ (#R186) THE BROWSER SUITE RUNS ON TEN MACHINES, NOT TEN WORKERS ════════════════════════════
  # 360 real-browser tests on ONE runner took 70 minutes on a good day and over two hours on a bad
  # one — and the bad days are not random. `playwright.config.js` already records the mechanism from
  # #R184: when this job gets long, the timing-sensitive tests (the Cesium camera comparisons, the
  # terrain reads, the 3-D flight cases — each of them minutes long by nature) start failing on LOAD
  # rather than on their own merits, and every retry makes the job longer still.
  #
  # Sharding fixes both halves at once, and it is the one lever that costs no coverage: every test
  # still runs, and `workers: 2` still means two browsers per machine, so the CONTENTION each test
  # sees is no worse than what it saw before. What changes is that ten machines share the work.
  # The gate job below keeps the single check name the branch has always reported.
  #
  # ⚠ AND THE SUITE IS SPLIT IN TWO BEFORE IT IS SHARDED. Playwright shards by TEST COUNT, and the
  # expensive specs are the ones with FEW tests that each take minutes — so eight shards still parked
  # every `*-cesium*` file on one machine: that shard took ONE HOUR while the other seven finished in
  # two to fifteen minutes, and four of its tests failed on load rather than on their merits (all four
  # pass locally). More shards cannot fix that; only separating them can.
  #
  # ══ (#R195) …AND SEPARATING FAMILIES BY HAND IS ITSELF THE DEFECT ═══════════════════════════════
  # 「今回だけで終わるな。そもそもの構造をどうにかしろ」. The paragraph above is the record of noticing
  # ONE heavy family and carving it out. It worked, and it did not generalise: this round the shards
  # came out 2m11, 2m20, 7m14, 8m51, 11m17 and **35m58**, because the flight-sim specs had clumped
  # exactly the way the Cesium ones once did. Carving those out too would have bought one round.
  #
  # The cause is that `--shard=i/n` divides by TEST COUNT while this suite's files run from 2 s to
  # 689 s. So CI does not use `--shard`. scripts/shard-plan.mjs packs the spec FILES into groups of
  # equal MEASURED time (tests/durations.json) and hands each job its own list. Measured plan at the
  # time of writing: five `rest` groups of ~599 s each, against 131 s … 2,158 s under count-sharding.
  # A spec that becomes slow redistributes itself on the next `--update`; nobody has to notice first.
  #
  # The one thing still stated per-file is which specs need a machine to THEMSELVES — #R186 measured
  # that for Cesium — and it lives in tests/durations.json as `solo`, as data rather than as a regex.
  # Group counts are chosen so no group exceeds the largest single file (r182-cesium, 650 s): more
  # groups cannot go below that, and fewer would waste the parallelism.
  browser:
    name: Browser ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one slow shard must not hide the results of the others
      matrix:
        include:
          - { suite: cesium, shard: 1, of: 4 }
          - { suite: cesium, shard: 2, of: 4 }
          - { suite: cesium, shard: 3, of: 4 }
          - { suite: cesium, shard: 4, of: 4 }
          - { suite: rest, shard: 1, of: 8 }
          - { suite: rest, shard: 2, of: 8 }
          - { suite: rest, shard: 3, of: 8 }
          - { suite: rest, shard: 4, of: 8 }
          - { suite: rest, shard: 5, of: 8 }
          - { suite: rest, shard: 6, of: 8 }
          - { suite: rest, shard: 7, of: 8 }
          - { suite: rest, shard: 8, of: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache the Playwright browser binaries between runs (keyed on the lockfile).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      # (#R195) the file list comes from the measured plan, not from --shard. The planner FAILS on an
      # empty group rather than returning nothing, because `playwright test` with no paths runs the
      # whole suite — a silent 40-minute job that looks like a pass.
      - name: Plan this machine's share (measured time, not test count)
        id: plan
        run: |
          set -euo pipefail
          FILES=$(node scripts/shard-plan.mjs --pool ${{ matrix.suite }} --group ${{ matrix.shard }} --of ${{ matrix.of }})
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "this machine runs:" && printf '%s\n' $FILES
      - name: Run Playwright tests (smoke + internal QA)
        env:
          IM_SUITE: ${{ matrix.suite }}
        run: npx playwright test ${{ steps.plan.outputs.files }}
      # (#R195) …and say, right here, which of the failures main does NOT have. The rule is to prove
      # a failure is yours before touching it, and the way that was carried out was to re-run main by
      # hand at ~10 minutes a go — while CI had already run every test on main and discarded the
      # answer. tests/baseline.json is main's own last result; this reads it. It never fails the job:
      # the verdict is information for whoever reads the log, and the tests themselves decide red.
      - name: Which of these does main not have?
        if: ${{ failure() }}
        continue-on-error: true
        run: node scripts/baseline.mjs --classify test-results/junit.xml
      # On failure, publish the report + screenshots + traces so the cause is visible in GitHub.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      # (#R195) …and on MAIN, the run's own result BECOMES the baseline, together with the timings the
      # shard planner packs by. Both are committed by the job below, so the next PR inherits them.
      # ⚠ Only main writes: a branch that recorded its own results would define its own "normal".
      - name: Keep this result as main's baseline
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
        continue-on-error: true
        run: |
          node scripts/baseline.mjs --update test-results/junit.xml
          node scripts/shard-plan.mjs --update test-results/junit.xml
      - name: Upload the baseline fragment
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            tests/baseline.json
            tests/durations.json
          retention-days: 7
          if-no-files-found: ignore

  # One check, whatever the shard count is — so the PR still reports a single browser result and any
  # required-check configuration keeps matching. It carries the name the single job used to have.
  browser-gate:
    name: Browser smoke + internal QA
    runs-on: ubuntu-latest
    needs: browser
    if: ${{ always() }}
    steps:
      - name: All browser shards passed
        run: |
          echo "shards: ${{ needs.browser.result }}"
          test "${{ needs.browser.result }}" = "success"
