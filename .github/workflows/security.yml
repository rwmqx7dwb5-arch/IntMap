# IntMap security CI (#R138). Static application security testing (CodeQL) for the
# inline app JS, the Edge Functions (Deno/TS) and the tooling. Findings surface in the
# repo's Security → Code scanning tab and as PR annotations; they are advisory (they do
# not block the merge unless the maintainer makes the check required in branch protection).
#
# The cheap regex/secret/action-pinning checks + Edge-Function auth-logic tests run in
# ci.yml (every PR) — they are NOT duplicated here, to avoid double notifications.
#
# CodeQL is free for PUBLIC repositories (IntMap is public). On a private repo it needs
# GitHub Advanced Security; see docs/TESTING.md.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # (security-watch) DAILY, not weekly: an advisory is published against code that has not changed, so the
    # scheduled run is what finds it — a weekly one let it sit up to six days. 02:47 UTC is clear of db-backup and
    # tle-refresh (03:17) and the nightly drift/liveness runs (04:41).
    - cron: '47 2 * * *'   # daily 02:47 UTC — new advisories, newly-published CodeQL queries
  workflow_dispatch:

# Least privilege. CodeQL needs security-events: write to upload its SARIF results.
permissions:
  contents: read

# A newer commit on the same branch/PR cancels the older in-flight run.
# ⚠ (#R372) …AND THE WEEKLY SWEEP IS NOT ON ANYBODY'S BRANCH. A scheduled run's `github.ref` is the
# default branch, so `security-Security-refs/heads/main` was shared by the weekly CodeQL run and by
# every push to main, and `cancel-in-progress` lets whichever starts second kill the first. This is
# the same structure ci.yml carried until #R372, where it HAD fired: three of sixteen nightlies died
# to a late merge.
# ⚠ SAID PLAINLY — HERE IT HAS NOT FIRED YET. All five scheduled runs on record (2026-07-27 …
# 2026-08-24) are `success`, none cancelled. The reason is luck, not design: GitHub's cron queue is
# under no obligation to be punctual, and the real starts came out at 06:38, 06:32, 04:51, 03:59 and
# 04:02 UTC against a nominal 03:17, so the weekly has simply never overlapped a Monday-morning push.
# The collision is one well-timed merge away, and the fix costs nothing, so it is made before rather
# than after. Only the structure is being repaired; no incident is being claimed.
# So a `schedule` goes to a group of its own and can only be superseded by the next schedule. Every
# other event falls through to `github.ref`, so the group string a push or a PR gets is byte-for-byte
# what it was before this line changed.
# ⚠ `workflow_dispatch` DELIBERATELY STAYS ON `github.ref`, for ci.yml's reason: it is the button a
#   round presses on its own branch, and a constant group would make two branches cancel each other.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ci-job-timeouts: ~3× the longest measured run (docs/TESTING.md)
    permissions:
      contents: read
      security-events: write   # upload the SARIF results to code scanning
      actions: read            # CodeQL reads the workflow/run context
      packages: read           # resolve any CodeQL packs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          # Covers index.html/admin.html inline scripts, supabase/functions/**/*.ts (Deno),
          # and scripts/*.mjs. node_modules is auto-excluded.
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:javascript-typescript"

  # (security-hardening) KNOWN-VULNERABLE DEPENDENCIES — NOTHING ELSE WATCHES FOR THEM.
  # MEASURED 2026-10-08: Dependabot alerts are DISABLED on this repository (`GET /repos/…/vulnerability-alerts`
  # → 404, automated security fixes `enabled: false`), and dependabot.yml's version updates only move the
  # DIRECT dependencies. The lock shipped DOMPurify 3.4.13 to the browser (through Cesium) for twelve days
  # inside two published advisories, and source-map-js 1.2.1 (build tool) inside a high one; no run said so.
  # (security-watch) Dependabot alerts and security updates were turned on 2026-11-16; this job stays, because it
  # is the one that fails a PR and feeds the scheduled watch below — the alerts only list.
  # This asks the registry's advisory database about the LOCK (no install, no node_modules): any advisory in
  # what the browser is shipped (`--omit=dev`) fails, and a high or critical one in the build/test tooling.
  # Daily as well as on every PR, because an advisory is published against code that has not changed.
  # Advisory like CodeQL above (not a required check); the lock's internal consistency — the defect that let
  # 3.4.13 stay below Cesium's own floor — is a required rule in check:static (scripts/lock-ranges.mjs).
  dependency-advisories:
    name: Dependency advisories (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ci-job-timeouts: ~3× the longest measured run (docs/TESTING.md)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Shipped to the browser — any advisory
        run: npm audit --package-lock-only --omit=dev --audit-level=low
      - name: Build and test tooling — high or critical
        if: ${{ always() }}
        run: npm audit --package-lock-only --audit-level=high

  # (security-watch) A RED SCHEDULED RUN USED TO REACH NOBODY. The weekly run failed in the Actions list and
  # nowhere else; a new advisory against main surfaced only when some unrelated PR happened to run the same job
  # (measured 2026-11-16: PR #1129 red on «Dependency advisories» for an advisory main already carried). This job
  # turns the scheduled result into the ONE incident issue every scheduled job here uses
  # (scripts/ci-incident-issue.cjs): opened on red, rewritten while red, closed on the next green.
  # Red means: either job above failed, or code scanning holds an open alert at the severity the ruleset on
  # main blocks a PR for (high / critical) — an alert on main is one no PR introduced, so no PR check will name it.
  watch:
    name: Scheduled security watch
    needs: [codeql, dependency-advisories]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ci-job-timeouts: no scheduled run had reached it by 2026-11-16 (it needs codeql first), so the floor (docs/TESTING.md)
    permissions:
      contents: read
      issues: write            # the single incident issue
      security-events: read    # list the open code-scanning alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Open / rewrite / close security incident issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CODEQL: ${{ needs.codeql.result }}
          AUDIT: ${{ needs.dependency-advisories.result }}
        with:
          script: |
            const incident = require('./scripts/ci-incident-issue.cjs');
            const alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo,
              { ...context.repo, state: 'open', per_page: 100 });
            const blocking = alerts.filter((a) => ['high', 'critical'].includes(a.rule.security_severity_level));
            const causes = [];
            if (process.env.AUDIT !== 'success') causes.push('npm audit reports a published advisory against the lock (job «Dependency advisories»)');
            if (process.env.CODEQL !== 'success') causes.push('the CodeQL analysis did not complete');
            if (blocking.length) causes.push(`${blocking.length} open code-scanning alert(s) at high/critical: ` +
              blocking.map((a) => `#${a.number} ${a.rule.id} (${a.most_recent_instance.location.path})`).join(', '));
            await incident({ github, context }, {
              label: 'status:security-advisory',
              title: 'Scheduled security watch is red',
              labelDescription: 'Automated: a published advisory or an open high/critical code-scanning alert on main',
              ok: causes.length === 0,
              cause: causes.join('; '),
              runbook: '`docs/SECURITY-ARCHITECTURE.md` §8 and `docs/INCIDENT-RESPONSE.md` → "Security advisory".',
            });
