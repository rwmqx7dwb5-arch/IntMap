# (#R341) Keep the shared world-aircraft snapshot advancing without a reader paying for it.
#
# supabase/functions/aviation-feed serves every IntMap browser from ONE snapshot in Supabase
# Storage. Something has to advance that snapshot, and the two obvious candidates do not work here:
#
#   · A BACKGROUND TASK INSIDE THE FUNCTION. Measured: a promise handed to EdgeRuntime.waitUntil did
#     not survive the response — six consecutive world requests answered from the snapshot and the
#     world stayed at 27 aircraft and 0/980 tiles, with no write attempted. A design resting on that
#     looks correct in every single-request test and never advances in production.
#   · pg_cron + pg_net. The right tool, and it needs the database password to install
#     (docs/MIGRATIONS.md explains why `db push` is not usable in this project). Left as the upgrade
#     path rather than as a blocker.
#
# So the sweeper is a scheduled HTTP call. `?refresh=1` is the only caller that pays for a lattice
# slice; every browser answers from the snapshot instantly and is told its age.
#
# ⚠ THE CADENCE IS SET BY THE PROVIDER, NOT BY TASTE — AND NOT BY THIS FILE EITHER (#R504).
# api.adsb.lol was read by #R341 as a burst budget of about four requests refilling over minutes,
# and WORLD_SLICE_TILES was 3 because of it. Re-measured 2026-08-31 from one address with the
# function's own User-Agent, the provider answered 31 of 40 requests spaced two seconds apart — a
# leaky bucket refilling at roughly half a request a second, not a four-shot magazine. The ceiling
# now lives in ONE place, the function's READ_RATE_PER_S, and every channel draws from it; this
# workflow can only ask, never grant. Asking more often than the bucket refills would get the
# address blocked, which is the one outcome that takes the layer down for everybody.
#
# ⚠ A GLOBAL SWEEP IS STILL NOT WHAT THIS BUYS, and that is an honest statement about adsb.lol
# rather than a tuning problem: its documented API has no all-aircraft endpoint, and the readsb
# re-api that DOES answer a whole-planet box is feeders-only — verified 2026-08-31: it returns
# HTTP 207 with an empty body to a caller that is not their own site, and the API's own description
# says the re-api is what you get by feeding them. The function reports `coveragePct` so the UI can
# say how much sky it has actually seen, and since #R504 that number is finally able to climb at
# all, because the sweep's cursor and per-tile ledger now survive an isolate. A provider that
# answers the whole planet in ONE request (OpenSky /states/all — measured 6,838 aircraft, 900 kB,
# 2.7 s) turns this job into a single call that refreshes everything; that is what
# AVIATION_PROVIDER=opensky switches on, and it needs the written agreement OpenSky's terms require
# for operational use. docs/AVIATION-ARCHITECTURE.md carries both ways out of the lattice.
name: Aviation sweep

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Nothing here reads or writes the repository.
permissions:
  contents: read

# Two sweepers at once would spend the provider's burst budget twice as fast for no extra coverage.
concurrency:
  group: aviation-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Advance the world snapshot
        run: |
          set -uo pipefail
          EP="https://vpekfwdpurzejrrmacac.supabase.co/functions/v1/aviation-feed"

          # ⚠ (#R504) `cron: '*/5'` IS NOT WHAT THIS RUNS AT, AND THE SWEEP WAS BUILT AS THOUGH IT
          # WERE. Measured from the run list on 2026-08-31, the last eight scheduled runs started at
          #   19:26  16:42  12:14  06:42  01:15  23:13  21:02  18:25 UTC
          # — gaps of 2h45, 4h28, 5h32, 5h27, 2h02, 2h10, 2h37. GitHub throttles scheduled
          # workflows hard, so this is SIX RUNS A DAY, not 288. Two slices of three tiles each then
          # bought 36 tile reads a day against a 980-tile lattice, and (because the cursor did not
          # survive an isolate before #R504) they were the same three tiles every time.
          #
          # So a run must be worth taking: it now sweeps for most of its wall clock rather than
          # firing twice and stopping. The PACE is still the provider's — the function's own leaky
          # bucket (READ_RATE_PER_S) grants what it grants, and grants nothing at all while a
          # viewport read is spending it. Watch `x-intmap-coverage` in the lines below: it climbs
          # across slices, and stands still on a slice the budget had nothing left for. Asking every
          # 20 s is asking roughly as often as a full burst refills, and there is no way for this
          # loop to make the function ask faster than the bucket allows — which is exactly why the
          # pacing lives there and not here.
          SLICES=10
          for i in $(seq 1 "$SLICES"); do
            code=$(curl -sS --max-time 120 -o /tmp/sweep.bin -D /tmp/sweep.hdr \
                        -w '%{http_code}' "$EP?ch=world&refresh=1&tiles=6" || echo "000")
            echo "--- slice $i/$SLICES: HTTP $code, $(wc -c < /tmp/sweep.bin) bytes"
            grep -i '^x-intmap-' /tmp/sweep.hdr | tr -d '\r' || true
            # A non-2xx is reported, not retried: the provider asked us to stop, or the function is
            # down, and hammering either is worse than skipping a slice.
            if [ "$code" != "200" ]; then
              echo "::warning::aviation-feed refresh returned $code — skipping the rest of this run"
              exit 0
            fi
            # ⚠ AN `&&` AS THE LAST COMMAND OF THE LOOP DECIDES THE STEP'S EXIT CODE.
            # `[ "$i" = "1" ] && sleep 45` returns 1 on the FINAL iteration, and GitHub runs steps
            # under `bash -e`, so the step failed with exit 1 after doing all of its work correctly:
            # measured on the first scheduled-equivalent run — both slices HTTP 200, both
            # `x-intmap-save: ok`, the lattice advanced to 3/980, and the run was still red (#R346).
            # A red that means "it worked" is worse than no alarm at all, because the next real
            # failure looks the same.
            if [ "$i" != "$SLICES" ]; then sleep 20; fi
          done

      - name: Report coverage
        if: always()
        run: |
          set -uo pipefail
          curl -sS --max-time 60 \
            "https://vpekfwdpurzejrrmacac.supabase.co/functions/v1/aviation-feed?meta=1" \
            | head -c 1200 || true
          echo ""
