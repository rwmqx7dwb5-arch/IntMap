name: Handoff bridge self-test

on:
  pull_request:
    paths:
      - 'scripts/handoff.mjs'
      - 'scripts/handoff-inbox.mjs'
      - 'CHATGPT-HANDOFF.md'
      - 'HANDOFF-REVIEW.cmd'
      - '.agents/rules/gpt-handoff.md'
      - '.claude/settings.json'
      - '.github/workflows/handoff-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - run: node scripts/handoff.mjs self-test
      - run: node scripts/handoff-inbox.mjs self-test
