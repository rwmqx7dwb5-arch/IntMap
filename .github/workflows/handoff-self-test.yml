name: Handoff bridge self-test

on:
  pull_request:
    paths:
      - 'scripts/handoff.mjs'
      - 'HANDOFF-REVIEW.cmd'
      - '.claude/rules/gpt-handoff.md'
      - '.claude/settings.json'
      - '.github/workflows/handoff-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/handoff.mjs self-test
