name: Handoff bridge self-test

on:
  pull_request:
    paths:
      - 'scripts/handoff.mjs'
      - 'scripts/handoff-inbox.mjs'
      - 'CHATGPT-HANDOFF.md'
      - 'HANDOFF-REVIEW.cmd'
      - '.agents/rules/gpt-handoff.md'
      - '.claude/settings.json'
      - '.github/workflows/handoff-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node scripts/handoff.mjs self-test
      - run: node scripts/handoff-inbox.mjs self-test
