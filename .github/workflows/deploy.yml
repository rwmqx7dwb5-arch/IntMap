# MANUAL re-publish of production (GitHub Pages) — the dispatch button only.
#
# ══ (ci-build-once) A PUSH TO main NO LONGER RUNS THIS WORKFLOW ═════════════════════════════════
# Production is published by ci.yml's `pages` job: at the end of main's own CI run, only when that
# run is green, from the SAME dist/ its `build` job made and its browser tier served. This workflow
# used to run on every push to main IN PARALLEL with that CI — so it published a merged tree whether
# or not main's run was red (the ruleset's checks are not «strict», so that tree was often one no PR
# had tested), and it paid one more `npm run build` for bytes no test had served.
# What stays is the button: «Run workflow» on main re-publishes main's current commit with the
# recipe below (it builds for itself — there is no CI artifact to reuse from here). Use it when a
# green main did not publish (e.g. the pages job itself failed and a re-run is not wanted), not as a
# way around a red main: it re-runs only the static gates. To publish an OLDER commit, rollback.yml.
#
# Publishing still requires BOTH of these to stay true (see docs/RELEASE.md):
#   1. Repo → Settings → Pages → Source = "GitHub Actions"
#   2. Repo → Settings → Secrets and variables → Actions → Variables:
#        ENABLE_PAGES_DEPLOY = true
# Unsetting the variable is the stop switch: every job below — and ci.yml's `pages` job — then
# skips (green, no-op).
#
# green-skip-by-design vars.ENABLE_PAGES_DEPLOY: an operator's stop switch, not a missing setting.
#   Measured 2026-09-25 with `gh variable list`: ENABLE_PAGES_DEPLOY=true, set 2026-07-18. Turning it
#   off is a deliberate act by someone with admin rights, and while it is off «did not publish» IS
#   the job done — a red run on every push would make the switch unusable. Everywhere else in
#   .github/workflows a missing secret or variable is RED (tests/backup-and-deploy-as-code-checks
#   reads this line; delete it and the skip below becomes a failure of that test). rollback.yml
#   reads the same variable and is red when it is off: there a person asked for a publish.
#
# The flow is: build → static checks → hermetic browser tests → publish the BUILT TREE
# (`dist/`, from `npm run build`) → post-deploy smoke test against the live URL.
# ⚠ (#R628) This line said 「publish the EXACT committed tree」, which stopped being true at #R175:
# what Pages serves is the Vite build, and the committed index.html ends in a module src that is a
# 404 on Pages. `rollback.yml` says so in its own header; this one had not caught up.
name: Deploy (production, Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; serialize them.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify
    if: ${{ vars.ENABLE_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # (data-outside-git) the datasets outside git (data-assets.json) — dist/ is built from them
      - uses: ./.github/actions/data-assets
      - name: Static checks
        run: npm run check:static
      - name: Renderer-decoupling gate (#R178)
        run: npm run check:engine
      # ══ (#R195) THE BROWSER GATE IS NOT RE-RUN HERE ═══════════════════════════════════════════════
      # 「マージ→本番デプロイ→検証 ←遅すぎる」. This job used to install Chromium and re-run
      # tests/smoke.spec.js + tests/internal-qa.spec.js — four to six minutes spent re-proving, on one
      # machine, something CI had just proved on twelve, for the IDENTICAL tree. main is protected by
      # the required "Browser smoke + internal QA" check (it refused an --admin merge of this very PR),
      # so a commit cannot reach this workflow without having passed the whole suite, smoke and QA
      # included. Re-running two of those specs adds no information; it only delays the deploy.
      #
      # What is NOT duplication, and stays: the two static gates above (seconds, and they guard the
      # BUILD rather than the tests), and the post-deploy smoke against the LIVE URL below — that one
      # tests something no pre-merge run can, namely the thing actually published.
      # (#R175) The site is a Vite build now, so what ships is dist/ — bundled, minified, hashed and
      # code-split — not the committed sources. `vite build` is deterministic from the checked-out
      # tree. ⚠ (ci-build-once) This is the manual path, so it builds for itself; the automatic path
      # (ci.yml `pages`) publishes the very build its browser tier served.
      - name: Build the site (Vite)
        run: npm run build
      - name: Assemble site (build output + build stamp)
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r dist/. _site/
          test -f _site/index.html || { echo "::error::dist/index.html missing — the build produced no site"; exit 1; }
          test -f _site/sw.js      || { echo "::error::dist/sw.js missing — static assets were not copied"; exit 1; }
          printf '{ "sha": "%s", "ref": "%s", "runId": "%s", "builtAt": "%s" }\n' \
            "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${GITHUB_RUN_ID}" "$(date -u +%FT%TZ)" \
            > _site/build-info.json
          echo "Published build-info.json:" && cat _site/build-info.json
          echo "Site contents:" && ls -la _site | head -30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  post-smoke:
    name: Post-deploy smoke (live URL)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test the freshly deployed site
        env:
          PROD_URL: ${{ needs.deploy.outputs.page_url || vars.PROD_URL || 'https://rwmqx7dwb5-arch.github.io/IntMap/' }}
        run: npx playwright test --config playwright.prod.config.js
      - name: Upload post-deploy report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: post-deploy-report
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
