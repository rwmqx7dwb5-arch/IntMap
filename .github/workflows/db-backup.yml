# IntMap — scheduled encrypted database backup (DORMANT until secrets are set).
# ----------------------------------------------------------------------------
# A free, self-hosted fallback to Supabase's managed backups. It runs pg_dump,
# encrypts with GPG (AES-256), checksums, and uploads the ENCRYPTED file as a
# short-retention artifact. It stays DORMANT (each run skips) until BOTH secrets
# exist, exactly like the gated Pages deploy — so it never fails an empty repo.
#
# TO ACTIVATE, add two repository secrets (Settings → Secrets and variables →
# Actions → New repository secret) — see docs/BACKUP-RESTORE.md:
#   SUPABASE_DB_URL         Postgres session-pooler connection string (the password
#                           is in it → SECRET). Dashboard → Settings → Database →
#                           Connection string → URI (session pooler).
#   BACKUP_GPG_PASSPHRASE   A strong passphrase you generate and keep in a password
#                           manager. It is the ONLY key to the backups — losing it
#                           makes them unrecoverable; leaking it defeats encryption.
#
# NOTE: even encrypted, these artifacts are held on GitHub. Retention is short
# (7 days). Managed Supabase backups / PITR remain the primary line of defense —
# see docs/BACKUP-RESTORE.md for the trade-offs.
name: DB backup (encrypted)

on:
  schedule:
    - cron: '17 3 * * *'      # daily 03:17 UTC (RPO ≈ 24h; §9.2)
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # open/close the single "backup failing" incident issue

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted pg_dump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # DORMANT GATE — succeed-and-skip unless both secrets are present. Secrets
      # can't be read in `if:` conditions, so gate via a step output.
      - name: Check backup secrets
        id: gate
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$PASS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DB backup is DORMANT — set SUPABASE_DB_URL and BACKUP_GPG_PASSPHRASE to activate."
          fi

      - name: Install tools
        if: steps.gate.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg

      - name: Dump + encrypt + checksum
        if: steps.gate.outputs.present == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          OUT_DIR: ${{ runner.temp }}/backups
        run: bash scripts/backup-db.sh

      - name: Upload encrypted backup (short retention)
        if: steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/backups/*.dump.gpg
            ${{ runner.temp }}/backups/*.sha256
            ${{ runner.temp }}/backups/*.meta.json
          retention-days: 7
          if-no-files-found: error

      # On failure of an ACTIVE (non-dormant) backup, open one deduplicated issue.
      - name: Open / close backup incident issue
        if: ${{ always() && steps.gate.outputs.present == 'true' }}
        uses: actions/github-script@v7
        env:
          JOB_OK: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_OK === 'success';
            const label = 'status:backup-failing';
            const title = 'Scheduled database backup failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            async function ensureLabel() {
              try { await github.rest.issues.getLabel({ ...context.repo, name: label }); }
              catch (e) { if (e.status === 404) {
                await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205',
                  description: 'Automated: scheduled DB backup is failing' });
              } else { throw e; } }
            }
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label })).data;
            if (!ok) {
              if (open.length === 0) {
                await ensureLabel();
                await github.rest.issues.create({ ...context.repo, title, labels: [label],
                  body: [
                    'The scheduled encrypted database backup failed.', '',
                    `- Detected (UTC): ${now}`,
                    `- Run: ${runUrl}`, '',
                    'Runbook: `docs/BACKUP-RESTORE.md` and `docs/DATABASE-INCIDENT.md` → "backup失敗".',
                    'This issue auto-closes on the next successful backup.',
                  ].join('\n') });
              }
            } else {
              for (const iss of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: iss.number,
                  body: `Backup succeeded at ${now}. Auto-closing.` });
                await github.rest.issues.update({ ...context.repo, issue_number: iss.number, state: 'closed' });
              }
            }
