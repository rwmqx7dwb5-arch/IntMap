# IntMap — scheduled encrypted database backup.
# ----------------------------------------------------------------------------
# A free, self-hosted fallback to Supabase's managed backups. It runs pg_dump,
# encrypts with GPG (AES-256), checksums, and uploads the ENCRYPTED file as a
# short-retention artifact.
#
# ⚠ WITHOUT ITS TWO SECRETS THIS RUN IS RED, AND IT OPENS AN ISSUE NAMING THE MISSING ONE.
# It used to skip and report success. MEASURED 2026-09-24, run 35975392869: it printed
# 「DB backup is DORMANT」 and was green — as it had been every night since the file existed — while
# docs/INCIDENT-RESPONSE.md sent a reader in a data-loss incident to 「the newest backup」. There was
# no backup. A run that could not do its job is a failed run; the gate is
# scripts/ci-require-secrets.sh and tests/backup-and-deploy-as-code-checks.test.mjs runs it.
#
# The two secrets, and the one-time registration, are in docs/BACKUP-RESTORE.md (the 正本):
#   SUPABASE_ACCESS_TOKEN   Supabase access token — a short-lived read-only DB login is derived from it (no stored DB password).
#   BACKUP_GPG_PASSPHRASE   The ONLY key to the backups — losing it makes them unrecoverable.
#
# NOTE: even encrypted, these artifacts are held on GitHub. Retention is short
# (7 days). Managed Supabase backups / PITR remain the primary line of defense —
# see docs/BACKUP-RESTORE.md for the trade-offs.
name: DB backup (encrypted)

on:
  schedule:
    - cron: '17 3 * * *'      # daily 03:17 UTC (RPO ≈ 24h; §9.2)
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # open/rewrite/close the single "backup failing" incident issue

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted pg_dump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Secrets can't be read in `if:` conditions, so the gate is a step — and a missing secret
      # FAILS it (exit 1, one ::error:: per missing name). Every step below then skips, except the
      # incident step, which runs on always() and says which secret is missing.
      - name: Require backup secrets
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: bash scripts/ci-require-secrets.sh SUPABASE_ACCESS_TOKEN BACKUP_GPG_PASSPHRASE

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg

      # No stored database password: a short-lived read-only login role is asked of the Management API with
      # the access token (the Supabase CLI's own mechanism).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Short-lived database login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/db-login-url.mjs

      # pg_dump refuses a server newer than itself (measured 2026-09-29: server 17.6, the runner's client
      # 16.15 → «aborting because of server version mismatch»). Ask the server its major and install that
      # client from PostgreSQL's own PGDG repository — no version written here.
      - name: pg_dump matching the server
        run: |
          major=$(psql "$DB_URL" -tAc 'show server_version_num' | tr -d '[:space:]' | cut -c1-2)
          echo "server major: $major"
          # the PGDG repository (PostgreSQL's own) carries every supported major; Ubuntu's carries one
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Dump + encrypt + checksum
        env:
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          OUT_DIR: ${{ runner.temp }}/backups
        run: bash scripts/backup-db.sh

      - name: Upload encrypted backup (short retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/backups/*.dump.gpg
            ${{ runner.temp }}/backups/*.sha256
            ${{ runner.temp }}/backups/*.meta.json
          retention-days: 7
          if-no-files-found: error

      # One deduplicated issue: opened on red (a missing secret included), rewritten while red, closed on green.
      - name: Open / rewrite / close backup incident issue
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          JOB_OK: ${{ job.status }}
          MISSING: ${{ steps.gate.outputs.missing }}
        with:
          script: |
            const incident = require('./scripts/ci-incident-issue.cjs');
            const missing = (process.env.MISSING || '').trim();
            await incident({ github, context }, {
              label: 'status:backup-failing',
              title: 'Scheduled database backup failing',
              labelDescription: 'Automated: scheduled DB backup is failing',
              ok: process.env.JOB_OK === 'success',
              cause: missing
                ? `NO BACKUP WAS TAKEN — repository secret(s) not set: ${missing.split(/\s+/).map((n) => '`' + n + '`').join(', ')}. Register them once (docs/BACKUP-RESTORE.md → 「一度だけの登録」).`
                : 'a backup step failed — read the run log',
              runbook: '`docs/BACKUP-RESTORE.md` and `docs/INCIDENT-RESPONSE.md` → "Backup failing".',
            });
