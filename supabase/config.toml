# ============================================================================
#  IntMap — Supabase CLI config (LOCAL development / CI only).
# ----------------------------------------------------------------------------
#  This file drives the LOCAL Supabase stack (`supabase start`, `supabase db
#  reset`, `supabase test db`). It never contains secrets and never points at
#  production. The production project (ref vpekfwdpurzejrrmacac) is reached only
#  by explicit, credential-gated commands the maintainer runs by hand
#  (see docs/MIGRATIONS.md and docs/BACKUP-RESTORE.md).
#
#  IMPORTANT: `major_version` should MATCH the production Postgres version so
#  that `supabase db diff --linked` produces a faithful drift report. Check it in
#  Dashboard → Project → Settings → Infrastructure ("Postgres version"). If prod
#  is 17, change the 15 below to 17. (Local RLS/pgTAP tests pass on either.)
# ============================================================================

project_id = "intmap"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match to production (see note above).
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local test mailbox (never a real SMTP server).
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Local dev origin. Production redirect URLs live ONLY in the Supabase dashboard
# (Authentication → URL Configuration) — they are not reproducible via migrations.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# (#R155) Password policy. minimum_password_length + password_requirements are the
# SERVER-side floor (enforced on every signup / password change, both here locally and
# — set identically — in the dashboard for prod). The client (index.html) mirrors this
# and additionally runs a Have-I-Been-Pwned k-anonymity check so a KNOWN-BREACHED
# password is rejected before the request is even sent. NOTE: the dashboard's
# "Leaked password protection" toggle (HIBP, server-side) is NOT reproducible in this
# file — enable it in Authentication → Providers/Passwords (see docs/TESTING.md).
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = false

# Google OAuth is used in production but its client id / secret are secrets held
# in the dashboard — never in this repo. Left disabled locally on purpose.
[auth.external.google]
enabled = false

# ============================================================================
#  EVERY Edge Function in this repo, and its verify_jwt.
# ----------------------------------------------------------------------------
#  This block used to name FIVE of the eight. alerts-relay, cable-geo and news-relay were deployed
#  with --no-verify-jwt from a line in their own header comment and appeared nowhere in this file,
#  so `supabase functions deploy` from a clean checkout, or anyone reading this config to learn what
#  the project exposes, saw three fewer public endpoints than exist. A deploy flag that lives only
#  in a comment is not configuration.
#
#  ⚠ `_shared/` IS NOT A FUNCTION. It is a library directory (newsgeo.js, relay-guard.js) that other
#  functions import with a relative path and the CLI bundles into each of them; it has no index.ts,
#  no route and no verify_jwt, and giving it a [functions.*] block here would try to deploy it as an
#  endpoint. It is listed nowhere on purpose — this note is so that stays deliberate.
#
#  THE ELEVEN, and why each is where it is:
#    ai-proxy        JWT   the caller's identity IS the quota; anonymous use is the whole thing to stop
#    delete-account  JWT   deletes the CALLER's own account; it also re-verifies the user explicitly
#    monitor-run     no    two callers, two credentials: pg_cron with x-monitor-secret and the "Run
#                          now" button with a user JWT. It does its own auth for both, fail-closed.
#    refresh-news    no    called by a scheduler with the REFRESH_SECRET header; fail-closed if unset
#    news-ingest     no    (#R351) the Event pipeline's collector: same shape as refresh-news — a
#                          scheduler calls it with NEWS_INGEST_SECRET, fail-closed if unset. It writes
#                          the news_* Event tables and never touches current_news.
#    alerts-relay    no    keyless public relay of official warning feeds — no user data reaches it
#    cable-geo       no    keyless public relay of two TeleGeography GeoJSON URLs
#    news-relay      no    keyless public relay of Google News RSS
#    sv-cov          no    keyless public relay of Google's Street-View coverage tiles
#    aviation-feed   no    (#R341) the ONE upstream reader for live air traffic. Keyless, no user
#                          data. Unlike the four relays above it does not forward a caller-named URL
#                          — it owns the provider list, and the caller may only choose a CHANNEL
#                          (world / view / meta). That is the point: the browser used to issue up to
#                          128 upstream requests per sweep per user, and now issues none.
#  The FOUR keyless relays — alerts-relay, cable-geo, news-relay, sv-cov — share the bounds in
#  _shared/relay-guard.js (allow-list, deadline, byte ceiling, content-type, generic errors); that,
#  not a JWT, is what stands in front of them, because requiring a login for a public map layer would
#  break it for everyone who is not signed in.
#  ⚠ aviation-feed is keyless too but is NOT a fifth relay, and the distinction is the security
#  property: a relay forwards a URL the CALLER named (hence the allow-list), while aviation-feed
#  names its own upstreams and the caller may only pick a channel. It uses the same deadline, byte
#  ceiling, content-type check and generic errors from relay-guard, and needs no allow-list because
#  no caller-supplied URL ever reaches fetch().
# ============================================================================
[functions.ai-proxy]
verify_jwt = true

[functions.refresh-news]
verify_jwt = false

# monitor-run (#R141) is deployed --no-verify-jwt: pg_cron calls it with a shared
# secret (x-monitor-secret) and the "Run now" UI calls it with a user JWT; the
# function does its OWN auth for both paths (fail-closed on the secret).
[functions.monitor-run]
verify_jwt = false

# sv-cov (#R145) is a keyless, tightly-allowlisted relay of Google's public Street
# View coverage tiles (no user data) — deployed --no-verify-jwt.
[functions.sv-cov]
verify_jwt = false

# delete-account (#R155) hard-deletes the caller's OWN account + data. verify_jwt ON;
# it ALSO verifies the user explicitly and requires { confirm: "DELETE" }.
[functions.delete-account]
verify_jwt = true

# alerts-relay (#R266) relays MeteoAlarm + CMA warning feeds (neither sends CORS headers).
# Keyless, no user data, GET only, allow-listed hosts and paths — deployed --no-verify-jwt.
[functions.alerts-relay]
verify_jwt = false

# cable-geo (#R190) relays the two TeleGeography submarine-cable GeoJSON URLs. Keyless,
# no user data — deployed --no-verify-jwt.
[functions.cable-geo]
verify_jwt = false

# news-relay (#R216) relays Google News RSS (news.google.com sends no ACAO). Keyless,
# no user data — deployed --no-verify-jwt.
[functions.gdelt-relay]
verify_jwt = false

[functions.news-relay]
verify_jwt = false

# aviation-feed (#R341) is the single upstream reader for live air traffic: it polls the configured
# provider (adsb.lol by default; OpenSky when OPENSKY_AGREEMENT=1) and hands every IntMap browser
# the same IMAV/1 binary snapshot. Keyless and no user data, so --no-verify-jwt — a login for a
# public map layer would break it for everyone signed out. The provider keys, when a provider needs
# any, live in this function's environment and never reach the browser.
[functions.aviation-feed]
# ⚠ (#R351) THIS LINE WAS MISSING ON main. When routing-relay (#R347) landed on top of
# aviation-feed (#R341), the merge left aviation-feed's block with no `verify_jwt` key at all —
# the one below `[functions.routing-relay]` belongs to routing-relay. A key that is absent is not
# `false`: the CLI's default is verify_jwt=true, so the next `supabase functions deploy
# aviation-feed` from a clean checkout would have put a JWT in front of a keyless public map
# layer and broken it for every signed-out reader. Production is unaffected (it still carries the
# flag from the deploy that predates the drift), which is exactly why nothing noticed. This is the
# defect §5 of docs/SECURITY-ARCHITECTURE.md was written about: a deploy flag that lives only in a
# header comment is not configuration.
verify_jwt = false

# routing-relay (#R347) holds the Mapbox Directions key so the page never sees it, and relays the
# traffic-aware routes and their refreshes. verify_jwt is OFF because routing is offered to signed-out
# readers exactly as it is to signed-in ones — requiring a login would break the panel for everyone
# who is not. What stands in front of it instead is the allow-list plus a per-IP rate limit, which is
# the only spend ceiling Mapbox itself does not provide (see the function's own header).
[functions.routing-relay]
verify_jwt = false

# news-ingest (#R351) collects the Source Registry's feeds into the Event tables (news_articles /
# news_events / …). Deployed --no-verify-jwt: a scheduler calls it with the x-news-ingest-secret
# header and the function does its own fail-closed auth, exactly like refresh-news and monitor-run.
[functions.news-ingest]
verify_jwt = false

# volcano-feed (#R353) relays the two volcano feeds that send no CORS headers: the Smithsonian/USGS
# Weekly Volcanic Activity Report (RSS, volcano.si.edu) and the international SIGMET set
# (aviationweather.gov), from which it keeps only the volcanic-ash ones. Both are parsed server-side
# so the page receives rows keyed by GVP volcano number rather than an XML scraper in the bundle.
# The four other volcano sources (USGS HANS, JMA, USGS hazard-zone ArcGIS, USGS earthquakes) all
# answer with Access-Control-Allow-Origin: * and are fetched DIRECTLY — a relay that is not needed
# is one more thing to be down. Keyless & public; no user data reaches it.
[functions.volcano-feed]
verify_jwt = false
