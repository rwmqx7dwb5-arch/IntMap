<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- (csp-without-inline) This page's script policy: its own files, and its one inline <script> by the sha256 of its
     text (node scripts/csp.mjs --write writes it; npm run check:static refuses a missing or stale one, and any
     'unsafe-inline' in script-src). Nothing is fetched, framed or submitted beyond this origin; the CJK faces come
     from Google Fonts. style-src keeps 'unsafe-inline': the policy text (js/legal-text.js, the one copy the app shows too)
     sets style attributes on its headings. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'sha256-wKlAwq8UVD+9IJESeom6R7V83n4oZKW+a+5Eb8u1lcA='">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IntMap — Privacy Policy</title>
<meta name="description" content="Privacy Policy — IntMap.">
<link rel="icon" href="./IntMap.Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/pages.css">
<!-- The Privacy Policy with a URL of its own, so it can be linked to, cited and read without
     opening the app. A SHELL, exactly like sources.html / science.html:
       · the words   → js/legal-text.js   (the same file the in-app modal reads — one source)
       · the look    → css/pages.css      (shared with the other three reading pages)
       · the machine → js/legal-page.js   (nine-language chrome; the document itself is JA/EN)
     The title and description above are the pre-JS defaults; js/legal-page.js replaces both with
     the reader's language on load, the same way index.html's are wired through the registry. -->
</head>
<body>

<div class="pg-top">
  <div class="pg-top-in">
    <a class="pg-back" href="./index.html">←</a>
    <span class="pg-top-spacer"></span>
    <a class="pg-sibling" href="./terms.html"></a>
    <span class="pg-lang"></span>
  </div>
</div>

<main class="pg-wrap" id="pg-root"></main>

<!-- the generated language list, then the registry that reads it, then the text, then the shell —
     the same order (and the same reason) as sources.html. -->
<script type="module" src="./js/locales/_langs.js"></script>
<script type="module" src="./js/lang-registry.js"></script>
<script type="module" src="./js/legal-text.js"></script>
<script type="module" src="./js/legal-page.js"></script>
<script type="module">
  window.IntMapLegalPage.mount('privacy');
</script>
</body>
</html>
