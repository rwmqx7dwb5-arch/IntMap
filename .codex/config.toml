developer_instructions = '''
# IntMap · Codex 固有の作法

恒久指示の正本は `AGENTS.md`（Codex が自動で読む）。ここはその Codex 版の付則。
Claude Code 側の対応物は `CLAUDE.md`、両者の対応表は `docs/AGENT-SETUP.md`。

## C-0. 起動時の文脈が届いているか（#R704）

`SessionStart` hook は **hash に対して trust されるまで一覧に出るだけで走らない**（`/hooks`）。
⚠ **実測（#R704）: `~/.codex/config.toml` の `[hooks.state]` は空で、この hook は一度も走って
いなかった**——つまり Codex のセッションは、branch も空きラウンドも、#R696 が 1 か所にまとめた
蓄積メモリも、**一度も受け取っていなかった**。

**冒頭にそれらが見えていないなら、それは「無い」ではなく「届いていない」である。** 自分で取る:

```bash
node scripts/codex-setup.mjs        # 何が届いていて、何が手作業で残っているか
```

これが、`.agents/session-start.json`（両製品が同じものを描く正本）から**このとき走らせるべき
コマンドそのもの**を印字する。手で憶えない。`--apply` は、このマシンの `~/.codex/config.toml` を
Claude Code と同じ使用感（推論の深さ・承認・サンドボックス・workspace の外で書く先）に揃える。


## C-1. セッションの始め方

- **セッション名は自動生成に任せる。** `/rename` を使わない。
- `AGENTS.md` §1 の事前確認のうち、**`.agents/rules/` は自分で開く**
  （Claude Code は自動で読み込むが、Codex は読まない）。実体は
  `execution-strategy.md`・`no-ad-hoc-hardcoding.md`・`gpt-handoff.md`。
  ⚠ **数ではなくディレクトリで確かめる**——足されたものが黙って落ちないように、
  `.agents/rules/` にあるファイルは全部読む。
- 状態は `node scripts/worktree.mjs status` が 1 回で出す。手で数え直さない。

## C-2. 不明点

`AGENTS.md` §8 は「推測で埋めるな・質問は説明文に混ぜるな」と要求する。
Codex には専用の質問 UI が無いので、**質問だけを本文にして turn を終える**。
作業を進めながら末尾に質問を添えない——それは §8 が禁じている形。

## C-3. 委譲（subagent）

`.codex/agents/*.toml` の 5 役は `.agents/roles/` から生成されたもの（`npm run check:agents`）。
`scout` / `verifier` / `i18n` / `implementer` / `prod-verifier` を、
`.agents/rules/execution-strategy.md` §2 の表のとおりに使い分ける。

- **独立した仕事は 1 回の依頼でまとめて spawn する**（1 つずつ待たない）。
- 隔離は `node scripts/worktree.mjs new <slug>`。同じファイルを 2 体に書かせない。
- **統合・commit・push・merge は主スレッドだけが行う。**

## C-4. 資格情報

`CLAUDE.local.md`（追跡対象外）にある。**Codex は自動で読まない**ので、
本番ログインが要る検証の前に自分で開く。中身をどこにも書き写さない。

## C-5. dev サーバとブラウザ

シェルから直に dev サーバを起動しない。`node scripts/worktree.mjs new` が
`intmap-preview-r<N>` / ポート `4000 + N` を用意する。本番検証は browser プラグインで行い、
測った数字は**本番で**測る（`AGENTS.md` §5.1 の production verification）。

## C-6. サンドボックスと承認

`AGENTS.md` §5.1 は「非破壊的な migration・設定変更・deployment・commit・push・PR 作成・
merge に追加承認を求めない」と要求する。それを満たすには **workspace-write + ネットワーク**が
要る（`docs/AGENT-SETUP.md` §7）。read-only で始まった場合は、承認を求めるのではなく
**その旨を報告してから**続けること。

## C-7. メモリ（Claude Code と**同じ 1 か所**を読み書きする）

`AGENTS.md` §1 のメモリは、もう「製品ごとの別の写し」ではない。場所は
`node scripts/agent-memory.mjs --path` が出す（このマシンの絶対パスをどの追跡ファイルにも
書かないための導出。どの worktree から呼んでも同じ場所を指す）。

- `SessionStart` hook が索引を渡す。**渡ってこないなら hook が trust されていない**（§C-6 の
  `/hooks`）——「メモリが無い」ではないので、そう報告しない。
- **索引は「思い出す鍵」であって全文ではない。** 鍵が当たったら、その `.md` を開いて読む。
- **学んだことは同じディレクトリへ書く。** Codex 自身の `/memories` にだけ書くと Claude Code
  からは見えず、`AGENTS.md` §9 が禁じる「正本が 2 つ」になる。
  ⚠ そこは workspace の外なので、サンドボックスが書き込みを拒むことがある（`codex-setup.mjs`
  の `--apply` が `writable_roots` に入れる）。**拒まれたら承認を求めて書く**——黙って
  `/memories` に逃がさない。
- **1 事実 1 ファイル。名前は主題で**（ラウンド番号を書かない・`.agents/skills/intmap-round/` §4）。
  書いたら `MEMORY.md` に 1 行足す。

'''

