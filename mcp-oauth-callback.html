<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IntMap — sign-in</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --fg:#1d1d1f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f5f5f7; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align:center; padding:24px; }
</style>
</head>
<body>
<p id="m">Finishing sign-in… You can close this window.</p>
<script>
/* (mcp-oauth) The service sent the reader back here with ?code=…&state=… (or ?error=…). This page hands that query to the IntMap page that opened it —
   the same origin only — and closes. It reads nothing else, stores nothing, and calls no server: the code is exchanged by the IntMap page, which alone holds the PKCE verifier. */
(function () {
  var q = location.search || '';
  var msg = { type: 'intmap-mcp-oauth', query: q };
  try { if (window.opener) window.opener.postMessage(msg, location.origin); } catch (e) {}
  try { var bc = new BroadcastChannel('intmap-mcp-oauth'); bc.postMessage(msg); bc.close(); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  setTimeout(function () { try { window.close(); } catch (e) {} document.getElementById('m').textContent = 'Sign-in finished. You can close this window.'; }, 300);
})();
</script>
</body>
</html>
