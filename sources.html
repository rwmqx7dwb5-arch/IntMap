<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IntMap — Data sources</title>
<meta name="description" content="Every organisation whose data IntMap shows, where it is used, how it is fetched, its licence, and what it means for your privacy.">
<link rel="icon" href="./IntMap.Icon.png">
<link rel="stylesheet" href="./css/pages.css">
<!-- (#R218) 「データ出典ページのデザインと配色に不自然な箇所がある。Apple風の洗練されたページに。
     （ロジック解説ページも）五言語対応に。今後、対応言語をさらに増やしていく方針です。容易に言語を
     追加できるように準備しておいて。」

     This file is now a SHELL. It holds no prose and no styling of its own:
       · the words        → js/locales/pages.<lang>.js   (one file per language)
       · the look         → css/pages.css                (shared with science.html)
       · the machinery    → js/page-i18n.js              (loads a language, renders a document)
       · the registry list→ js/sources-list.js           (the only thing this page renders itself)
     Adding a sixth language touches none of these four files except by adding one more locale
     and one row in js/page-i18n.js's LANGS — see the note at the top of that file. -->
</head>
<body>

<div class="pg-top">
  <div class="pg-top-in">
    <a class="pg-back" href="./index.html">←</a>
    <span class="pg-top-spacer"></span>
    <a class="pg-sibling" href="./science.html"></a>
    <span class="pg-lang"></span>
  </div>
</div>

<main class="pg-wrap" id="pg-root"></main>

<script src="./js/reference-data.js"></script>
<script src="./js/page-i18n.js"></script>
<script src="./js/sources-list.js"></script>
<script>
  window.IntMapPageI18N.mount({
    page: 'sources',
    root: '#pg-root',
    onRender: function (slots, lang) { window.IntMapSourcesList.render(lang); }
  });
</script>
</body>
</html>
